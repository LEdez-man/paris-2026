.","Eigentlich sollte er nach 20 Jahren abgebaut werden dürfen, aber die Funktechnik rettete ihn."],"quiz":[{"q":"Für welche Weltausstellung wurde der Eiffelturm gebaut?","a":"Für die Weltausstellung von 1889."},{"q":"Warum wurde der Turm nach 1909 nicht abgebaut?","a":"Wegen seines Nutzens für die Funktechnik (drahtlose Telegrafie); das Nutzungsrecht wurde 1910 um 70 Jahre verlängert."},{"q":"Wie viele Nieten hat der Turm?","a":"Rund 2,5 Millionen."}],"sources":[{"title":"Tour Eiffel (offiziell): Geschichte","url":"https://www.toureiffel.paris/fr/le-monument/histoire"},{"title":"Tour Eiffel (offiziell): Kennzahlen","url":"https://www.toureiffel.paris/en/the-monument/key-figures"},{"title":"Wikipedia (fr): Tour Eiffel","url":"https://fr.wikipedia.org/wiki/Tour_Eiffel"},{"title":"Wikipedia (en): Eiffel Tower","url":"https://en.wikipedia.org/wiki/Eiffel_Tower"},{"title":"Wikipedia (en): Gustave Eiffel","url":"https://en.wikipedia.org/wiki/Gustave_Eiffel"}]}},{"t":"13:45","name":"Mittag in der Rue Cler","q":"Rue Cler Paris","mode":"zu Fuß (10 Min.)","hook":"Eine Einkaufsstraße ohne Autos, wie schmeckt hier der Mittag?","info":"Die Rue Cler ist eine Fußgängerstraße mit Bäckereien, Käseläden und Bistros. Ideal für eine Mittagspause in einer ruhigen Ecke von Paris. Die Markttage sind laut Stadtführer Mittwoch und Samstag, am Dienstag haben die festen Läden offen.","tip":"Ein Baguette-Sandwich und ein Stück Tarte passen gut zu einem Picknick auf dem Champ de Mars.","deep":{"lage":"Gros-Caillou, 7. Arrondissement","history":["Die Rue Cler liegt im Quartier du Gros-Caillou im 7. Arrondissement. Der Name Gros-Caillou geht wahrscheinlich auf einen großen Grenzstein zwischen den Grundherrschaften Saint-Germain und Sainte-Geneviève zurück; erste Erwähnungen stammen von 1510 und 1523. Das Gebiet gehörte zur ehemaligen Île des Cygnes und zur östlichen Plaine de Grenelle; ein Nebenarm der Seine, die „petite Seine“, trennte es vom Festland. Er wurde ab 1786 teilweise und 1812 vollständig zugeschüttet.","Bis ins späte 17. Jahrhundert war die Plaine de Grenelle überwiegend Acker, Gemüsegarten und Jagdgebiet. Die Bebauung begann um 1700, als Handwerker und Arbeiter der Baustelle des Invalidenhauses sich an der Rue Saint-Dominique und der Rue de Grenelle ansiedelten. Später kamen Arbeiter für den Palais Bourbon und die École militaire; am Port du Gros-Caillou lagerte Holz.","Die Straße selbst entstand in Abschnitten: Der Teil zwischen Rue de Grenelle und Rue Saint-Dominique wurde 1738 angelegt, der Teil bis zur Avenue de La Motte-Picquet 1826. Ihren Namen trägt sie seit 1864 nach General Jean Joseph Gustave Cler (1814–1859), der bei Magenta im zweiten Italienfeldzug Napoleons III. fiel.","Zur Sozialgeschichte: Am Quai d'Orsay beschäftigte die Tabakmanufaktur mehr als tausend Arbeiter; sie schloss 1905 und wurde 1909 abgerissen. Der östliche Teil des Quartiers behielt bis in die Mitte des 20. Jahrhunderts einen volkstümlichen, dörflichen Charakter mit kleinen Läden; bürgerliche Wohnbebauung kam erst mit Neuparzellierungen wie dem ehemaligen Tabakgelände (1909).","Zur Versorgung der Gesamtstadt diente bis 1969 der Großmarkt Les Halles, den Philipp II. Augustus 1183 in seine Verfügung brachte und dessen Baltard-Hallen von den 1850er Jahren bis 1973 standen. Die Rue Cler ist heute als Fußgängerstraße weitgehend autofrei und zählt nahezu hundert Geschäfte und Restaurants, vor allem Lebensmittel; Markttage sind laut Sekundärquelle Mittwoch und Samstag vormittags."],"terms":[{"fr":"Gros-Caillou","de":"großer Kieselstein","ety":"Wahrscheinlich nach einem Grenzstein zwischen den Herrschaften Saint-Germain und Sainte-Geneviève; die Herleitung gilt nicht als gesichert."}],"kids":["Das Viertel heißt „großer Kieselstein“, vermutlich nach einem Grenzstein zwischen zwei Klosterherrschaften.","Die Straße trägt seit 1864 den Namen eines Generals, der 1859 bei Magenta fiel.","Die Tabakmanufaktur am Quai d'Orsay beschäftigte mehr als tausend Arbeiter und schloss 1905.","In der Rue Cler gibt es nahezu hundert Läden und Restaurants, vor allem für Lebensmittel."],"quiz":[{"q":"Was bedeutet „Gros-Caillou“ übersetzt?","a":"Großer Kieselstein."},{"q":"Nach wem ist die Rue Cler benannt, und in welcher Schlacht starb er?","a":"Nach General Jean Joseph Gustave Cler; er fiel 1859 bei Magenta."}],"sources":[{"title":"Wikipedia (fr): Rue Cler","url":"https://fr.wikipedia.org/wiki/Rue_Cler"},{"title":"Wikipedia (fr): Quartier du Gros-Caillou","url":"https://fr.wikipedia.org/wiki/Quartier_du_Gros-Caillou"},{"title":"France Today: Read the Signs, Rue Cler in Paris","url":"https://francetoday.com/travel/paris/read-the-signs-rue-cler-in-paris/"},{"title":"Cityzeum: Rue Cler","url":"https://www.cityzeum.com/rue-cler"},{"title":"Wikipedia (en): Les Halles","url":"https://en.wikipedia.org/wiki/Les_Halles"}]}},{"t":"15:30","name":"Hôtel des Invalides und Dôme","q":"Hotel des Invalides Paris","mode":"zu Fuß (15 Min.)","hook":"Wer liegt unter der goldenen Kuppel?","info":"Ludwig XIV. ließ den Komplex ab 1670 als Heim für verwundete Soldaten bauen. Unter dem vergoldeten Dôme liegt Napoleon I. in einem Sarkophag. Das Musée de l'Armée zeigt die Weltkriege und passt zu eurem Besuch in Verdun. Öffnungszeiten und Preise vorab auf musee-armee.fr prüfen, wir konnten sie nicht verifizieren.","tip":"Für die Weltkriege ca. 1,5 Stunden einplanen.","cost":"Preise: bitte auf musee-armee.fr prüfen.","deep":{"lage":"Esplanade des Invalides, 7. Arrondissement","history":["Ludwig XIV. (1638–1715), Bourbone, gründete 1670 den Hôtel royal des Invalides auf Staatskosten und übertrug das Projekt seinem Kriegsminister Louvois; er kaufte dafür die Plaine de Grenelle. Das Museum nennt als Motive die Versorgung verwundeter Soldaten, die Förderung freiwilliger Anwerbung, die Präsenz des Königs in Paris und die Verwahrung von Bettlern. Geplant war der Bau für 1.500 Pensionäre, aufgenommen wurden mehr als 4.000. Das Hospital hatte 300 Einzelbetten, geführt von den Grauen Schwestern.","Libéral Bruant entwarf die vierflügelige Anlage um einen großen Hof und leitete den Bau von 1671 bis 1676. Dann übernahm sein ehemaliger Schüler Jules Hardouin-Mansart. Die Soldatenkirche war 1679 fertig, die königliche Dôme-Kirche weihte Ludwig XIV. 1706 ein; die Kuppel ist rund 107 m hoch und wurde 1989 neu vergoldet.","Am 14. Juli 1789 holten Aufständische hier Waffen, die danach bei der Erstürmung der Bastille zum Einsatz kamen; die Invaliden leisteten keinen Widerstand, der Dôme hieß zeitweise „Temple de Mars“. Napoleon I. (1769–1821), Bonaparte, förderte das Haus. 1840 holte die Julimonarchie seine Asche von Sankt Helena, 1861 weihte Napoleon III. das von Louis Visconti entworfene Grabmal ein, mit einem Sarkophag aus rotem Quarzit.","Unweit liegt der Palais Bourbon, 1722–1728 für Louise-Françoise de Bourbon, eine Tochter Ludwigs XIV. und der Madame de Montespan, erbaut. 1764 kam er an die Prinzen de Condé, 1791 wurde er Nationalgut; seit 1798 tagte hier der Rat der Fünfhundert. Bernard Poyet gab ihm 1806–1810 die Säulenfassade, ab 1815 tagte die Chambre des députés. Seit 1946 heißt die Kammer Assemblée nationale.","Die Cinquième République entstand aus der Algerienkrise vom Mai 1958: De Gaulle wurde am 1. Juni Regierungschef, das Referendum vom 28. September (über 80 % Zustimmung) bestätigte die Verfassung, verkündet am 4. Oktober 1958. Der Präsident ist Schiedsrichter (Art. 5) und ernennt den Premier (Art. 8); die Regierung bestimmt die Politik (Art. 20) und haftet vor der Assemblée nationale (Art. 49), die der Präsident auflösen kann (Art. 12). Seit dem Referendum von 1962 wird der Präsident direkt gewählt, seit 2000 für fünf Jahre."],"terms":[{"fr":"invalide","de":"dienstunfähiger, versehrter Soldat","ety":"Von lat. invalidus, „kraftlos, schwach“."},{"fr":"dôme","de":"Kuppel","ety":"Über ital. duomo aus lat. domus, „Haus“; im Französischen meint das Wort die Kuppel, nicht den Dom."},{"fr":"cohabitation","de":"Kohabitation (Präsident und Premier aus gegnerischen Lagern)","ety":"Von lat. cohabitare, „zusammenwohnen“."}],"kids":["Für 1.500 Pensionäre geplant, nahm der Bau später mehr als 4.000 Invaliden auf.","Das Hospital hatte 300 Einzelbetten, die im Winter beheizt wurden.","Napoleons Sarkophag besteht aus rotem Quarzit; seine Asche kam 1840 aus Sankt Helena nach Paris.","Die Kuppel ist rund 107 m hoch und wurde 1989 neu vergoldet."],"quiz":[{"q":"Wer ließ die Invalides gründen, und für wen?","a":"Ludwig XIV. ab 1670, für verwundete und alte Soldaten."},{"q":"Wer ernennt in der Fünften Republik den Premierminister?","a":"Der Präsident der Republik (Art. 8 der Verfassung)."},{"q":"Wann wurde Napoleons Grabmal im Dôme eingeweiht, und wer weihte es ein?","a":"1861, durch Napoleon III."}],"sources":[{"title":"Musée de l'Armée: Dossier pédagogique, Hôtel des Invalides","url":"https://www.musee-armee.fr/fileadmin/user_upload/Ressources_pedagogiques/2025/DossierPedagogique_Hotel_des_invalides_BAT2.pdf"},{"title":"Musée de l'Armée: 1670–2020, die Invalides einst und heute","url":"https://www.musee-armee.fr/en/programme/the-hotel-des-invalides-celebrate-its-350th-anniversary/1670-2020-the-invalides-of-past-and-present.html"},{"title":"Wikipedia (fr): Palais Bourbon","url":"https://fr.wikipedia.org/wiki/Palais_Bourbon"},{"title":"Conseil constitutionnel: Verfassung vom 4. Oktober 1958","url":"https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"},{"title":"Wikipedia (en): French Fifth Republic","url":"https://en.wikipedia.org/wiki/French_Fifth_Republic"}]}},{"t":"17:45","name":"Rückfahrt und Abendessen im Viertel","q":"Rue Lepic Paris restaurants","mode":"Metro","hook":"Optional: Eiffelturm-Funkeln um 20:00 Uhr.","info":"Wer fit ist, geht abends noch einmal zum Turm (Bir-Hakeim oder Trocadéro). Ansonsten Abendessen in Montmartre.","tip":"Taschendiebe in der Metro und rund um den Turm: Rucksäcke vorne tragen."}],"kids":"Wer entdeckt auf dem Champ de Mars die beste Perspektive für ein Foto mit dem ganzen Turm?","fallback":"Eiffelturm kürzer, dafür länger im Musée de l'Armée (Weltkriege und Napoleon).","legs":[{"from":"Wohnung","to":"Trocadéro","m":5023,"rec":"metro","mixM":440,"metroMin":38,"via":"Blanche (Metro 2), Étoile umsteigen, Trocadéro (Metro 6)","metro":"Blanche (435 m), Metro 2 Richtung Porte Dauphine bis Charles de Gaulle–Étoile (7 Stationen), umsteigen in Metro 6 Richtung Nation bis Trocadéro (3 Stationen).","min":67},{"from":"Trocadéro","to":"Eiffelturm","m":717,"rec":"walk","mixM":717,"note":"Über die Pont d'Iéna","min":10},{"from":"Eiffelturm","to":"Rue Cler (Mittag)","m":1195,"rec":"walk","mixM":1195,"note":"Über den Champ de Mars","min":16},{"from":"Rue Cler","to":"Invalides","m":607,"rec":"walk","mixM":607,"min":8},{"from":"Invalides","to":"Wohnung","m":4343,"rec":"metro","mixM":455,"metroMin":28,"via":"Invalides (Metro 8), Concorde umsteigen, Abbesses (Metro 12)","metro":"Station Invalides, Metro 8 Richtung Créteil–Pointe du Lac bis Concorde (1 Station), umsteigen in Metro 12 Richtung Mairie d'Aubervilliers bis Abbesses (7 Stationen), dann 305 m.","min":58}]},{"id":"p3","badge":{"label":"3","kind":"day","bg":"#8E3FB3","fg":"#FFFFFF","sym":"🎨"},"tag":"Paris, Tag 3","date":"2026-10-14","short":"Mi 14.10.","name":"Orsay und Champs-Élysées","title":"Mittwoch: Orsay, Tuilerien, Champs-Élysées, Arc de Triomphe","line":{"label":"1","kind":"metro","bg":"#FFCE00","fg":"#1A1A1A","caption":"Metro-Linie 1, Concorde bis Étoile"},"lead":"Kunst am Morgen, dann der große Boulevard bis zum Triumphbogen. Der Louvre ist bewusst nicht dabei.","leave":"10:30","sunset":"19:02","stops":[{"t":"11:00","name":"Musée d'Orsay","q":"Musee d'Orsay Paris","mode":"Metro 12 (Solférino)","hook":"Welcher Bahnhof ist heute ein Museum?","info":"Der Gare d'Orsay entstand für die Weltausstellung 1900 und wurde 1986 zum Museum. Ihr seht Monet, Renoir, Degas, van Gogh und Cézanne. Hinter der großen Bahnhofsuhr liegt ein Café. Der Eintritt für unter 18-Jährige ist frei, ohne Reservierung. Geöffnet Di–So 9:30–18:00, Mo geschlossen.","tip":"Nehmt euch 2 Stunden. Die Impressionisten sind im Obergeschoss.","cost":"Erw. 16 € online (14 € vor Ort), unter 18 frei.","closedOn":["Mo"],"deep":{"lage":"Linkes Seine-Ufer, 7. Arrondissement","history":["Das Gelände am Quai d'Orsay war nach dem Tod der Königin Marguerite de Valois 1615 parzelliert worden; 1708 begann der Bau des Quais. Zwischen 1810 und 1838 entstand das Palais d'Orsay (Jean-Charles Bonnard, später Jacques Lacornée), zunächst für das Außenministerium gedacht, dann Sitz von Cour des comptes und Conseil d'État. In der Commune 1871 brannte das Viertel; die geschwärzten Mauern des Palais standen rund 30 Jahre.","1897 befragte die Compagnie des chemins de fer d'Orléans drei Architekten für einen neuen zentralen Endbahnhof. 1898 erhielt Victor Laloux den Auftrag, der zuvor das Hôtel de Ville in Tours vollendet hatte. Bahnhof und Hotel entstanden in rund zwei Jahren und wurden am 14. Juli 1900 zur Weltausstellung eröffnet. Hinter der Steinfassade verbirgt sich eine Metallkonstruktion. Die Halle misst 32 m Höhe, 40 m Breite und 138 m Länge; die 16 Gleise lagen unterirdisch, der Betrieb war elektrisch.","Bis 1939 war der Bahnhof Endpunkt der Südwestlinie. Danach waren die Bahnsteige für die längeren, elektrifizierten Züge zu kurz, es blieb der Vorortverkehr. Das Haus diente später als Sammelstelle für Päckchen an Gefangene, bei der Befreiung als Aufnahmezentrum, als Filmkulisse und als Ausweichquartier für Auktionen, solange das Hôtel Drouot wiederaufgebaut wurde. Das Hotel schloss am 1. Januar 1973; in seinem Festsaal hielt Charles de Gaulle die Pressekonferenz zu seiner Rückkehr an die Macht. Am 8. März 1973 kam der Bau, dem ein moderner Hotelneubau drohte, ins Zusatzinventar der Monuments historiques.","1977 beschloss die Regierung auf Initiative von Valéry Giscard d'Estaing ein Museum, 1978 folgte die Unterschutzstellung. Das Büro ACT (Bardon, Colboc, Philippon) gewann 1979 den Wettbewerb, Gae Aulenti gestaltete ab 1980 das Innere. François Mitterrand weihte das Haus am 1. Dezember 1986 ein, für das Publikum öffnete es am 9. Dezember; 2026 ist das 40. Jubiläum. Gezeigt wird Kunst von 1848 bis 1914. Die Impressionisten hingen zuvor im Jeu de Paume (seit 1947). Wie spät sie in staatliche Sammlungen kamen, zeigt das Vermächtnis Gustave Caillebottes von 1894: 67 Werke, von denen 40 ausgewählt und 1897 im Musée du Luxembourg gezeigt wurden."],"terms":[{"fr":"Cour des comptes","de":"Rechnungshof","ety":"„Comptes“ geht über altfranzösisch conte auf lateinisch computare („zusammenrechnen“) zurück."}],"kids":["Die Haupthalle ist 138 m lang, 40 m breit und 32 m hoch, und die 16 Gleise lagen unter dem Boden.","Der Bahnhof wurde am 14. Juli 1900 eröffnet, das Museum am 9. Dezember 1986 für Besucher.","Ab 1939 war der Bahnhof zu klein geworden, weil die Bahnsteige für die längeren Züge nicht reichten.","Vor dem Bahnhof stand hier rund 30 Jahre lang die Brandruine des Palais d'Orsay mitten in Paris."],"quiz":[{"q":"Wofür wurde das Gebäude des Musée d'Orsay ursprünglich gebaut?","a":"Als Bahnhof mit Hotel (Gare d'Orsay), eröffnet am 14. Juli 1900 zur Weltausstellung."},{"q":"Wie viele Gleise hatte der Bahnhof, und wo lagen sie?","a":"16 Gleise, unterirdisch."},{"q":"Welches Gebäude stand vor dem Bahnhof an derselben Stelle, und was geschah 1871 damit?","a":"Das Palais d'Orsay (Cour des comptes und Conseil d'État); es brannte in der Commune aus, die Ruine blieb etwa 30 Jahre stehen."}],"sources":[{"title":"Musée d'Orsay: De la gare au musée","url":"https://www.musee-orsay.fr/en/node/283773"},{"title":"Musée d'Orsay: Histoire du musée","url":"https://www.musee-orsay.fr/it/node/60"},{"title":"Musée d'Orsay: Paintings (Herkunft der Sammlung, Impressionismus)","url":"https://www.musee-orsay.fr/en/collections/paintings"},{"title":"Musée d'Orsay: 40 ans du musée d'Orsay","url":"https://www.musee-orsay.fr/en/node/337027"}]}},{"t":"13:15","name":"Passerelle und Jardin des Tuileries","q":"Jardin des Tuileries Paris","mode":"zu Fuß (10 Min.)","hook":"Wo hat Paris sein Wohnzimmer unter freiem Himmel?","info":"Über die Fußgängerbrücke geht ihr direkt in den Garten der ehemaligen Königsresidenz. Es gibt Teich, Karussell und Stühle zum Ausruhen. Mittags passen Kioske oder eine Boulangerie in der Rue de Rivoli.","tip":"Mittagspause im Garten, Stühle stehen frei herum.","deep":{"lage":"1. Arrondissement, zwischen Louvre und Place de la Concorde","history":["Catherine de Médicis (1519–1589), Florentinerin aus dem Haus Medici und Witwe Heinrichs II. aus dem Haus Valois, ließ ab 1564 vor der damaligen Stadtmauer ein Landschloss mit Garten errichten. Der Ort hieß nach den Ziegeleien (tuileries), die dort seit dem Mittelalter arbeiteten. Als Baumeister gelten Philibert de l'Orme und später Jean Bullant.","Heinrich IV. ließ 1607–1610 die lange Galerie am Seine-Ufer zum Louvre bauen, Ludwig XIV. gab dem Schloss seine symmetrische Form. Den Garten gestaltete 1664 André Le Nôtre neu, Gärtner des Königs und Sohn und Enkel königlicher Gärtner; er wurde auf dem Gelände geboren, lebte und starb dort. Er gliederte die Anlage in Grand Carré, Grand Couvert und das Oktogon mit den Terrassen. Anfangs stand der Garten nur einem ausgewählten Publikum offen.","In der Revolution wurde das Schloss zum Schauplatz: Nach den Oktobertagen 1789 brachte man Ludwig XVI. und seine Familie hierher, im August 1792 mussten sie es verlassen, der Palast wurde geplündert. Später tagte hier der Konvent, Napoleon I. und Napoleon III. residierten hier, Letzterer vollendete 1857 die Verbindung zum Louvre.","Ende Mai 1871 setzten Aufständische der Commune den Palast in Brand. Das Feuer dauerte drei Tage; stehen blieben Mauern und die Pavillons de Flore und de Marsan. Über einen Wiederaufbau wurde debattiert, doch 1882 beschloss ein Gesetz den Abriss, 1883 waren die Ruinen geräumt. Ein Giebel mit Uhr steht heute im Square Georges-Cain. Seit 2002 wirbt ein privates Komitee für den Wiederaufbau; Denkmalbehörden, Staat, Stadt Paris und Louvre lehnen das ab. Der Garten blieb; seit 2005 verwaltet ihn der Louvre.","Die Passerelle wurde 1997–1999 nach Plänen von Marc Mimram gebaut, zunächst als Passerelle Solférino. Die 106 m lange Fußgängerbrücke überspannt die Seine ohne Pfeiler im Fluss. Den Namen Léopold-Sédar-Senghor, nach dem Dichter, erhielt sie am 9. Oktober 2006 zu dessen 100. Geburtstag."],"terms":[{"fr":"tuilerie","de":"Ziegelei","ety":"Abgeleitet von tuile („Dachziegel“), von lateinisch tegula."}],"kids":["Der Name stammt von den Ziegeleien (tuileries), die hier standen, bevor Catherine de Médicis 1564 ihr Schloss bauen ließ.","Der Tuilerienpalast brannte 1871 drei Tage lang, 1882 beschloss ein Gesetz den Abriss, und 1883 waren die Ruinen geräumt.","Die Passerelle ist 106 m lang und kommt ohne Pfeiler im Fluss aus."],"quiz":[{"q":"Woher hat der Garten seinen Namen?","a":"Von den Ziegeleien (tuileries), die an dieser Stelle schon im Mittelalter arbeiteten."},{"q":"In welchem Jahr brannte der Tuilerienpalast, und wer legte das Feuer?","a":"1871, Aufständische der Pariser Commune."},{"q":"Wie hieß die Fußgängerbrücke vor 2006, und nach wem heißt sie heute?","a":"Passerelle Solférino; heute nach dem Dichter Léopold Sédar Senghor."}],"sources":[{"title":"Louvre: Du jardin royal au jardin public","url":"https://www.louvre.fr/decouvrir/le-palais/du-jardin-royal-au-jardin-public"},{"title":"Fondation Napoléon: La belle histoire des Tuileries","url":"https://www.napoleon.org/magazine/livres/la-belle-histoire-des-tuileries/"},{"title":"Wikipedia (fr): Palais des Tuileries (Orientierung, Abgleich mit den Seiten oben)","url":"https://fr.wikipedia.org/wiki/Palais_des_Tuileries"},{"title":"Wikipedia (en): Passerelle Léopold-Sédar-Senghor","url":"https://en.wikipedia.org/wiki/Passerelle_L%C3%A9opold-S%C3%A9dar-Senghor"}]}},{"t":"14:30","name":"Place de la Concorde mit Obelisk","q":"Place de la Concorde Paris","mode":"zu Fuß (10 Min.)","hook":"Wie kommt ein ägyptischer Obelisk nach Paris?","info":"Der Obelisk stammt aus dem Tempel von Luxor und ist rund 3.300 Jahre alt, seit 1836 steht er hier. Während der Revolution stand auf dem Platz die Guillotine, auch Ludwig XVI. wurde hier 1793 hingerichtet.","tip":"Vorsicht beim Überqueren, der Verkehr ist dicht.","deep":{"lage":"Grenze des 1. und 8. Arrondissements, am Ostende der Champs-Élysées","history":["1748 beschloss die Stadt Paris einen Platz für ein Reiterstandbild Ludwigs XV. Ange-Jacques Gabriels Entwurf wurde 1755 angenommen, der Platz 1772 fertiggestellt (Nordfassaden 1766–1775). Das Ostgebäude an der Rue Royale, der heutige Hôtel de la Marine, war ab 1768 ganz dem Garde-Meuble de la Couronne zugewiesen, der Verwaltung von Möbeln und Kronschätzen; 1792 wurden dort die Kronjuwelen gestohlen. Ab 1789 zog das Marineministerium ein, 1806 hatte es das ganze Haus; 1848 wurde hier das Dekret zur Abschaffung der Sklaverei entworfen und unterzeichnet. 2015 zog die Marine aus, im Juni 2021 öffnete das Haus als Museum.","Nach dem 10. August 1792 hieß der Platz Place de la Révolution. Das Standbild wurde gestürzt und eingeschmolzen, die Guillotine aufgestellt; Ludwig XVI. und Marie-Antoinette starben hier. Nach einer Angabe wurden auf dem Platz 1.119 der 2.498 in Paris Guillotinierten hingerichtet. Den Namen Concorde gab das Directoire, wohl im Zeichen der Versöhnung nach dem Terror.","Den Obelisken aus dem Tempel von Luxor bot Muhammad Ali, Wali von Ägypten, 1831 Frankreich an. Er ist rund 3.300 Jahre alt, 22,86 m hoch und etwa 227 t schwer. Der Ingenieur Apollinaire Lebas leitete 1836 die Aufrichtung unter Louis-Philippe (Haus Orléans, König 1830–1848) vor mehr als 200.000 Zuschauern; der König wollte ein Monument, das an kein politisches Ereignis erinnert. Jacques Ignace Hittorff fügte 1836–1846 zwei Brunnen hinzu, eingeweiht am 1. Mai 1840.","Jenseits der Seine liegt das Palais Bourbon. Das Haus entstand 1722, in der Revolution tagte hier der Rat der Fünfhundert, 1806–1810 schuf Bernard Poyet für das Corps législatif die Säulenhalle zur Brücke (zwölf Säulen, 30 Stufen). Heute sitzen hier 577 Abgeordnete, für fünf Jahre direkt in Einerwahlkreisen gewählt: Im ersten Wahlgang siegt, wer mehr als die Hälfte der Stimmen und mindestens ein Viertel der Eingetragenen erreicht; in den zweiten kommen Kandidaten mit mindestens 12,5 Prozent der Eingetragenen, es gilt die relative Mehrheit. Die Regierung braucht das Vertrauen der Assemblée; der Präsident kann sie auflösen, Neuwahlen folgen dann nach 20 bis 40 Tagen."],"terms":[{"fr":"concorde","de":"Eintracht","ety":"Von lateinisch concordia, zu con- („zusammen“) und cor, cordis („Herz“)."},{"fr":"obélisque","de":"Obelisk","ety":"Über lateinisch obeliscus von griechisch obelískos, einer Verkleinerung zu obelós („Spieß“)."},{"fr":"Garde-Meuble","de":"Möbelverwahrung (der Krone)","ety":"Garde „Verwahrung“ aus dem Germanischen, meuble „bewegliches Gut“ von lateinisch mobilis."}],"kids":["Der Obelisk ist 22,86 m hoch, wiegt etwa 227 Tonnen und ist rund 3.300 Jahre alt.","Bei der Aufrichtung 1836 sahen mehr als 200.000 Menschen zu.","Auf diesem Platz stand die Guillotine, und hier wurden Ludwig XVI. und Marie-Antoinette hingerichtet.","Concorde heißt Eintracht; den Namen wählte das Directoire nach der Zeit des Terrors."],"quiz":[{"q":"Woher stammt der Obelisk, und wer hat ihn Frankreich angeboten?","a":"Aus dem Tempel von Luxor; Muhammad Ali, Wali von Ägypten, bot ihn 1831 an, aufgestellt wurde er 1836."},{"q":"Wie hieß der Platz nach dem 10. August 1792, und was geschah mit dem Standbild Ludwigs XV.?","a":"Place de la Révolution; das Reiterstandbild Ludwigs XV. wurde gestürzt und eingeschmolzen."},{"q":"Wie viele Abgeordnete hat die Nationalversammlung, und für wie lange werden sie gewählt?","a":"577, für fünf Jahre."}],"sources":[{"title":"Wikipedia (fr): Place de la Concorde (Orientierung, Abgleich mit den Seiten unten)","url":"https://fr.wikipedia.org/wiki/Place_de_la_Concorde"},{"title":"Atout France: Hôtel de la Marine (Pressedossier, Zeittafel)","url":"https://it-res.france.fr/2022/PRESSE/HOTELDELAMARINE.pdf"},{"title":"Assemblée nationale: Les travaux réalisés sous le Premier Empire","url":"https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/patrimoine/palais-bourbon-et-hotel-de-lassay/l-histoire-du-palais-bourbon-et-de-l-hotel-de-lassay/les-travaux-realises-sous-le-premier-empire"},{"title":"Assemblée nationale: Fiche 3, Élection des députés","url":"https://www.assemblee-nationale.fr/dyn/contenu/telechargement/625543/file/Fiche%203%20-%20Election%20des%20d%C3%A9put%C3%A9s.pdf"},{"title":"Paris.fr: Embarquez à bord de l'Hôtel de la Marine","url":"https://www.paris.fr/pages/embarquez-a-bord-de-l-hotel-de-la-marine-19829"}]}},{"t":"15:00","name":"Spaziergang über die Champs-Élysées","q":"Avenue des Champs-Elysees Paris","mode":"zu Fuß (ca. 2 km)","hook":"Warum heißt die berühmteste Straße „Elysische Felder“?","info":"Der Name stammt aus der griechischen Mythologie (Elysion, Ort der Seligen). Die 1,9 km lange Prachtstraße führt von der Concorde zum Arc de Triomphe. Heute stehen Läden, Cafés und Kinos entlang der Straße.","tip":"Müde Beine? Eine Station mit der Metro 1 bringt euch ein Stück weiter.","deep":{"lage":"8. Arrondissement, von der Concorde bis zum Arc de Triomphe","history":["Das Gelände war sumpfiger Grund vor der Stadt. 1616 ließ Marie de Médicis die Promenade Cours-la-Reine anlegen; André Le Nôtre zog später die Achse der Tuilerien weiter, als hier noch offenes Land lag. Der Name Champs-Élysées ist seit 1709 festgelegt, 1724 wurde die Allee bis zur Étoile verlängert, in den 1770er-Jahren verbreiterte und verlängerte sie der Marquis de Marigny. Die Avenue misst 1.910 m in der Länge und 70 m in der Breite; Jacques Hittorff ergänzte in den 1840er-Jahren Brunnen und Gaslaternen.","Im Zweiten Kaiserreich wurde sie Adresse vornehmer Stadtpalais. Heute gilt sie als eine der teuersten Geschäftsstraßen der Welt; die Zahl der Kinos sank von etwa 20 auf zwei. Auf der Avenue findet die Militärparade zum 14. Juli statt, und seit 1975 endet hier die Tour de France.","Der Élysée-Palast liegt an der Rue du Faubourg-Saint-Honoré. 1718 ließ ihn Louis-Henri de La Tour d'Auvergne, comte d'Évreux, als Hôtel d'Évreux beginnen, 1753 kaufte ihn die Marquise de Pompadour. Im Juni 1815 unterzeichnete Napoleon I. hier seine Abdankung. 1848 zog mit Louis-Napoléon Bonaparte der erste Präsident ein; die Dritte Republik machte den Palast zur offiziellen Residenz.","Die Verfassung vom 4. Oktober 1958 stärkte das Präsidentenamt. Seit dem Referendum vom 28. Oktober 1962 (62,25 Prozent Ja) wird der Präsident direkt gewählt, zuvor bestimmte ihn ein Wahlgremium; erstmals geschah das 1965. Er ernennt den Premierminister, kann die Nationalversammlung auflösen und ernennt drei der neun Mitglieder des Conseil constitutionnel. Die Regierung bestimmt die Politik der Nation und braucht das Vertrauen der Assemblée.","Stehen Präsident und Parlamentsmehrheit in verschiedenen Lagern, spricht man von Cohabitation: 1986–1988 Mitterrand und Chirac, 1993–1995 Mitterrand und Balladur, 1997–2002 Chirac und Jospin. Das Referendum vom 24. September 2000 senkte die Amtszeit von sieben auf fünf Jahre (73,21 Prozent Ja bei 30,19 Prozent Beteiligung); Parlamentswahlen sollten auf die Präsidentenwahl folgen und Cohabitation unwahrscheinlicher machen. 2002 wurde Chirac für die erste Fünfjahres-Amtszeit wiedergewählt, seit 2008 sind nur zwei aufeinanderfolgende Amtszeiten erlaubt."],"terms":[{"fr":"Champs-Élysées","de":"Elysische Felder","ety":"Nach griechisch Ēlýsion, in der Sage der Aufenthaltsort der Seligen; der Straßenname ist seit 1709 festgelegt."},{"fr":"cohabitation","de":"Zusammenleben (Präsident und Regierung aus gegnerischen Lagern)","ety":"Von lateinisch cohabitare, „zusammenwohnen“."},{"fr":"quinquennat","de":"fünfjährige Amtszeit","ety":"Von lateinisch quinquennium, „Zeitraum von fünf Jahren“."}],"kids":["Die Avenue ist 1.910 m lang und 70 m breit.","Seit 1975 endet die Tour de France auf den Champs-Élysées.","Von früher rund 20 Kinos an der Avenue sind heute zwei übrig.","Der Élysée-Palast hieß ursprünglich Hôtel d'Évreux und wurde ab 1718 gebaut."],"quiz":[{"q":"Welches Radrennen endet seit 1975 auf den Champs-Élysées?","a":"Die Tour de France."},{"q":"Seit wann wird der französische Präsident direkt vom Volk gewählt?","a":"Beschlossen im Referendum vom 28. Oktober 1962, erstmals angewandt 1965."},{"q":"Wie nennt man es, wenn Präsident und Parlamentsmehrheit verschiedenen Lagern angehören, und wie lange dauert die Amtszeit des Präsidenten seit dem Referendum 2000?","a":"Cohabitation; fünf Jahre."}],"sources":[{"title":"Wikipedia (fr): Avenue des Champs-Élysées (Orientierung)","url":"https://fr.wikipedia.org/wiki/Avenue_des_Champs-Élysées"},{"title":"Élysée: Le palais de l'Élysée et son histoire","url":"https://www.elysee.fr/la-presidence/visite-palais-de-l-elysee-et-son-histoire"},{"title":"Éduscol: La Constitution du 4 octobre 1958","url":"https://eduscol.education.fr/media/5666/download"},{"title":"Wikipedia (en): 1962 French presidential election referendum","url":"https://en.wikipedia.org/wiki/1962_French_presidential_election_referendum"},{"title":"Wikipedia (en): 2000 French constitutional referendum","url":"https://en.wikipedia.org/wiki/2000_French_constitutional_referendum"}]}},{"t":"17:15","name":"Arc de Triomphe und Grab des Unbekannten Soldaten","q":"Arc de Triomphe Paris","mode":"Metro 1 / zu Fuß","hook":"In welcher Stadt wurde der Unbekannte Soldat ausgewählt? Ihr wart am Sonntag dort.","info":"Napoleon ließ den Bogen 1806 beginnen, fertig war er erst 1836. Unter dem Bogen liegt seit 1921 der Unbekannte Soldat des Ersten Weltkriegs. Er wurde im November 1920 in der Zitadelle von Verdun aus acht Särgen gewählt. Jeden Abend um 18:30 Uhr wird die Flamme neu entfacht. Die Terrasse (Eintritt 16 €) ist derzeit nur über Treppen erreichbar, der Aufzug wird gewartet.","tip":"Zur Flammenzeremonie um 18:30 Uhr da sein. Die Unterführung zum Bogen benutzen, nicht über die Kreuzung laufen.","cost":"Terrasse: ca. 16 € (Erw.), laut offizieller Seite.","deep":{"lage":"Place Charles-de-Gaulle, Grenze des 8., 16. und 17. Arrondissements","history":["Napoleon I. (1769–1821), seit 1804 Kaiser aus der Familie Bonaparte, ließ nach dem Sieg bei Austerlitz im Dezember 1805 einen Triumphbogen planen; das Dekret datiert vom 18. Februar 1806, der Grundstein wurde am 15. August 1806, seinem Geburtstag, gelegt. Jean-François-Thérèse Chalgrin entwarf ihn mit Jean-Arnaud Raymond an der Westseite der Champs-Élysées, sichtbar vom Tuilerienpalast. Beim Einzug mit Marie-Louise am 2. April 1810 stand nur ein Modell aus bemalten Rahmen und Leinwand. Chalgrin starb am 20. Januar 1811, 1814 wurde der Bau gestoppt, 1823 ging er weiter. Am 29. Juli 1836 wurde der Bogen unter Louis-Philippe eingeweiht.","Die Place de l'Étoile heißt nach der Butte de l'Étoile, deren Wege sich sternförmig kreuzten; seit 1970 trägt sie den Namen Charles de Gaulles. Hittorff zeichnete sie im Zweiten Kaiserreich unter Präfekt Haussmann (seit 1853) neu: Zwölf Avenuen laufen sternförmig zusammen, die Hôtels ringsum haben einheitliche Fassaden. 1860 wurde Passy eingemeindet und bildet seither den 16. Arrondissement. Fußgänger erreichen den Bogen durch die Unterführung Passage du Souvenir.","Im November 1920 wurden in Verdun acht Särge versammelt (neun waren exhumiert, einer wegen zweifelhafter Nationalität ausgeschieden). André Maginot, Veteran, leitete die Auswahl, der junge Korporal Auguste Thin wählte den sechsten Sarg. Der Tote lag in einer Chapelle ardente an der Place Denfert-Rochereau. Am 11. November 1920 zog der Trauerzug über das Panthéon zum Bogen, am 28. Januar 1921 folgte die endgültige Beisetzung im Beisein von Präsident Millerand und des britischen Premiers Lloyd George.","Am 11. November 1923 entzündete Maginot die Flamme der Erinnerung. Sie ist seither nicht erloschen. Jeden Abend um 18:30 Uhr entfacht ein Verein sie neu. Seit der Siegesparade am 14. Juli 1919 unter Joffre, Foch und Pétain findet die Militärparade zum Nationalfeiertag auf den Champs-Élysées statt, vom Bogen zur Concorde; von 1880 bis 1914 war sie in Longchamp. Der Präsident meldet sich am Bogen beim Paradekommandeur und inspiziert dann die Truppen entlang der Avenue."],"terms":[{"fr":"flamme du souvenir","de":"Flamme der Erinnerung","ety":"Souvenir geht auf lateinisch subvenire („in den Sinn kommen“) zurück."},{"fr":"chapelle ardente","de":"Trauerkapelle (Aufbahrungsraum mit Kerzen)","ety":"Ardente, „brennend“, von lateinisch ardere; gemeint sind die Kerzen um den Toten."}],"kids":["Den Grundstein legte man am 15. August 1806, an Napoleons Geburtstag; fertig war der Bogen am 29. Juli 1836.","Auf die Place de l'Étoile laufen zwölf Avenuen sternförmig zu.","Der Unbekannte Soldat wurde in Verdun aus acht Särgen gewählt, und zwar vom jungen Korporal Auguste Thin, der den sechsten wählte.","Die Flamme brennt seit dem 11. November 1923 und wird jeden Abend um 18:30 Uhr neu entfacht."],"quiz":[{"q":"Um wie viel Uhr wird die Flamme am Grab jeden Abend neu entfacht?","a":"Um 18:30 Uhr."},{"q":"In welcher Stadt wurde der Unbekannte Soldat ausgewählt, und aus wie vielen Särgen?","a":"In Verdun, aus acht Särgen."},{"q":"Wer wählte den Sarg aus, und der wievielte war es?","a":"Der junge Korporal Auguste Thin; es war der sechste."}],"sources":[{"title":"Arc de Triomphe (CMN): Genesis and first stone","url":"https://www.paris-arc-de-triomphe.fr/en/discover/genesis-and-first-stone"},{"title":"Arc de Triomphe (CMN): History of the Arc de triomphe","url":"https://www.paris-arc-de-triomphe.fr/en/discover/history-of-the-arc-de-triomphe"},{"title":"Arc de Triomphe (CMN): The Unknown Soldier","url":"https://www.paris-arc-de-triomphe.fr/en/discover/the-unknown-soldier"},{"title":"Wikipedia (fr): Place Charles-de-Gaulle (Paris) (Orientierung)","url":"https://fr.wikipedia.org/wiki/Place_Charles-de-Gaulle_(Paris)"},{"title":"Wikipedia (en): Bastille Day military parade (Orientierung)","url":"https://en.wikipedia.org/wiki/Bastille_Day_military_parade"}]}},{"t":"19:00","name":"Heimfahrt mit der Metro 2","q":"Charles de Gaulle Etoile Paris","mode":"Metro 2 bis Blanche","hook":"Direkt nach Montmartre ohne Umsteigen.","info":"Die Linie 2 fährt von Charles de Gaulle–Étoile ohne Umstieg bis Blanche, direkt am Moulin Rouge. Von dort sind es etwa 10 Minuten bergauf.","tip":"Abendessen in Montmartre oder auf dem Heimweg.","deep":{"lage":"Metro-Linie 2, Nordring von Étoile (8./16./17. Arr.) bis Blanche (9./18. Arr.)","history":["Paris bekam seine Metro spät. London eröffnete die Metropolitan Railway am 10. Januar 1863, die Pariser Behörden genehmigten erst 1896 ein Untergrundsystem. Am 30. März 1898 erklärte ein Gesetz die Metro zum öffentlichen Nutzen, am 4. Oktober 1898 begannen die Arbeiten an Linie 1 für die Compagnie du chemin de fer métropolitain de Paris. Der Bretone Fulgence Bienvenüe (1852–1936) hatte 1895 das erste Projekt entworfen. Für Unterquerungen der Seine setzten die Ingenieure Senkkästen und Bodenvereisung ein.","Am 19. Juli 1900 ging Linie 1 zwischen Porte Maillot und Porte de Vincennes in Betrieb, passend zur Weltausstellung; im ersten Jahr fuhren 17 Millionen Fahrgäste. Hector Guimards Jugendstil-Zugänge wurden zum Wahrzeichen. Am Eröffnungstag wurden etwa 30.000 Fahrscheine verkauft, die erste Klasse kostete 25, die zweite 20 Centimes.","Die Linie 2 war zunächst Teil einer geplanten Ringstrecke Étoile–Nation–Étoile entlang der äußeren Boulevards und wurde bald geteilt. Der nördliche Ast Porte Dauphine–Étoile eröffnete im Dezember 1900, bis April 1903 reichte er bis Nation. Heute ist die Linie 12,4 km lang; auf rund 2 km, einem Fünftel, verläuft sie zwischen Anvers und Colonel Fabien auf Viadukten über die Gleise von Gare du Nord und Gare de l'Est. Blanche liegt im Pigalle-Viertel am Moulin Rouge.","Am 10. August 1903 löste ein Kurzschluss in Ménilmontant einen Brand aus, der auf Couronnes übergriff; 84 Menschen starben, bis heute das schwerste Unglück der Metro. Später ersetzten Metallwagen vom Typ Sprague-Thomson, geliefert ab 1908, die Holzwagen.","Ab 1935 bereitete man Schutzräume in der Metro vor (Prototypen in Place-des-Fêtes und Maison-Blanche); 28 weitere Stationen, meist der Linien 7, 11 und 12, dienten als Zuflucht. 1944 stoppten die Deutschen den Bau der Linie 11, um dort eine unterirdische Waffenfabrik einzurichten. Das Pappticket verschwindet inzwischen: Seit April 2025 verkaufen über 140 Stationen keine Papierfahrscheine mehr."],"terms":[{"fr":"métropolitain (métro)","de":"Stadtbahn, Untergrundbahn","ety":"Adjektiv zu métropole, griechisch mētrópolis („Mutterstadt“); chemin de fer métropolitain wurde zu métro verkürzt."},{"fr":"Art nouveau","de":"Jugendstil, wörtlich „neue Kunst“","ety":"Aus art (lateinisch ars) und nouveau („neu“, lateinisch novellus)."}],"kids":["Linie 1 wurde am 19. Juli 1900 eröffnet und beförderte im ersten Jahr 17 Millionen Fahrgäste.","Die Linie 2 ist 12,4 km lang, und etwa ein Fünftel davon, rund 2 km, fährt auf Viadukten über der Straße.","Bei der Katastrophe von 1903 starben 84 Menschen, die Wagen waren damals noch aus Holz."],"quiz":[{"q":"Wann wurde die erste Pariser Metrolinie eröffnet, und aus welchem Anlass?","a":"Am 19. Juli 1900, zur Weltausstellung (Linie 1, Porte Maillot bis Porte de Vincennes)."},{"q":"Wie heißt die Stilrichtung der berühmten Metro-Eingänge von Hector Guimard?","a":"Art nouveau (Jugendstil)."},{"q":"Wo und wann ereignete sich das schwerste Unglück der Metro-Geschichte, und wie viele Menschen starben?","a":"Am 10. August 1903 an der Station Couronnes (Brand von Ménilmontant aus), 84 Tote."}],"sources":[{"title":"RATP: 125 ans du métro","url":"https://www.ratp.fr/125-ans-metro"},{"title":"Wikipedia (fr): Ligne 2 du métro de Paris (Orientierung)","url":"https://fr.wikipedia.org/wiki/Ligne_2_du_métro_de_Paris"},{"title":"Complete France: Making tracks, a short history of the Paris Métro","url":"https://www.completefrance.com/travel/holidays/making-tracks-a-short-history-of-the-paris-metro-6313204/"},{"title":"Paris.fr: Paris sous terre, ces refuges oubliés de la Seconde Guerre mondiale","url":"https://www.paris.fr/pages/paris-sous-terre-ces-refuges-oublies-de-la-seconde-guerre-mondiale-8124"},{"title":"Ville de Paris (Testkopie paris-recette.paris.fr): The metro ticket joins the poinçonneur des Lilas","url":"https://paris-recette.paris.fr/pages/the-metro-ticket-joins-the-poinconneur-des-lilas-26095"}]}}],"kids":"Zählt die Autos aus Deutschland auf dem Kreisverkehr um den Arc de Triomphe.","fallback":"länger im Orsay und die Champs-Élysées nur bis zum Arc fahren.","legs":[{"from":"Wohnung","to":"Musée d'Orsay","m":3495,"rec":"metro","mixM":755,"metroMin":30,"via":"Abbesses (Metro 12) bis Solférino","metro":"Abbesses (305 m), Metro 12 Richtung Mairie d'Issy bis Solférino (9 Stationen, ohne Umsteigen), dann ca. 450 m.","min":47},{"from":"Musée d'Orsay","to":"Tuilerien (Passerelle)","m":520,"rec":"walk","mixM":520,"min":7},{"from":"Tuilerien","to":"Place de la Concorde","m":670,"rec":"walk","mixM":670,"min":9},{"from":"Place de la Concorde","to":"Arc de Triomphe","m":2246,"rec":"either","mixM":2246,"metroMin":15,"metro":"Alternative für müde Beine: Metro 1 Richtung La Défense von Concorde bis Charles de Gaulle–Étoile (4 Stationen).","min":30},{"from":"Arc de Triomphe","to":"Wohnung","m":3767,"rec":"metro","mixM":440,"metroMin":22,"via":"Étoile (Metro 2) bis Blanche","metro":"Charles de Gaulle–Étoile, Metro 2 Richtung Nation bis Blanche (7 Stationen, ohne Umsteigen), dann 435 m.","min":50}]},{"id":"p4","badge":{"label":"4","kind":"day","bg":"#00695C","fg":"#FFFFFF","sym":"💀"},"tag":"Paris, Tag 4","date":"2026-10-15","short":"Do 15.10.","name":"Katakomben und Luxembourg","title":"Donnerstag: Katakomben, Luxembourg-Garten, Panthéon","line":{"label":"6","kind":"metro","bg":"#6ECA97","fg":"#1A1A1A","caption":"Metro-Linie 6, Station Denfert-Rochereau"},"lead":"Unterirdisch und etwas gruselig am Vormittag, danach Gartenatmosphäre.","leave":"10:30","sunset":"19:00","stops":[{"t":"11:30","name":"Katakomben von Paris","q":"Catacombes de Paris","mode":"Metro 12 + 4 (Denfert-Rochereau)","hook":"Wo liegen Millionen Pariser?","info":"Die Gebeine kamen ab 1786 aus überfüllten Friedhöfen, zuerst vom Cimetière des Innocents, in alte Kalksteinbrüche. Die Stadt wollte so Gerüche und Seuchengefahr beseitigen. Der Rundgang führt durch Gänge mit Knochenwänden, dauert gut eine Stunde, ist kühl (etwa 14 °C) und hat viele Stufen. Di–So 9:45–20:30, Montag geschlossen.","tip":"Online mit Zeitfenster buchen. Wer Platzangst hat, bleibt besser draußen. Nicht für kleine Kinder, mit 10 und 13 Jahren in der Regel machbar.","cost":"Erw. 31 €, 8–17 J. 15 € (inkl. Audioguide), laut offizieller Seite.","closedOn":["Mo"],"deep":{"lage":"Place Denfert-Rochereau, 14. Arrondissement","history":["Der Untergrund südlich der Seine besteht aus Kalkstein der Stufe Lutétien, vor 40 bis 48 Millionen Jahren am Grund eines tropischen Meeres abgelagert. Dieser „Pariser Stein“ lieferte bis ins frühe 20. Jahrhundert den größten Teil des Baumaterials der Stadt; auch Gips wird unter den Baustoffen genannt. Im ersten Jahrhundert n. Chr. entstanden Tagebaue im Tal der Bièvre, ab dem 14. Jahrhundert unterirdische Brüche mit stehengelassenen Pfeilern. Verbaut wurde er in Kirchen, im Louvre und in den Stadtmauern.","Je dichter die Stadt über den Brüchen wuchs, desto größer die Gefahr. 1774 verschlang ein Einsturz rund 300 m der heutigen Rue Denfert-Rochereau. Am 15. September 1776 verbot Ludwig XVI. den Abbau unter öffentlichen Straßen, am 4. April 1777 schuf er die Inspection générale des carrières unter Charles-Axel Guillaumot, Architekt des Königs. Sie kartierte die Hohlräume, errichtete Stützpfeiler unter den Fassaden und verband die Brüche; die Ingenieure schlugen Baustellennummer, Initialen und Jahr in den Stein. Das Netz misst mehr als 250 km und liegt unter etwa einem Zehntel der Stadtfläche.","Zugleich wurde der Friedhof der Saints-Innocents bei Les Halles zum Problem: rund zwei Millionen Bestattungen aus 22 Pfarreien, dem Hôtel-Dieu und Pestopfern von 1348. Nachdem die Mauer eines benachbarten Kellers dem Druck von Gebeinen und Leichen nachgegeben hatte, wurde er im Dezember 1780 geschlossen. Die Debatte stand im Zeichen der Miasmenlehre (Corbin). Ab 1785 brachte man die Gebeine nachts in die Brüche der Tombe-Issoire, um Widerstand der Bevölkerung und der Kirche zu vermeiden; am 7. April 1786 wurde der Ort als Ossuaire municipal geweiht. Überführungen aus Pfarrfriedhöfen liefen bis 1814, wurden ab 1840 fortgesetzt und endeten 1860 im Zuge von Haussmanns Umbau.","Ab 1809 war das Ossuarium nach Anmeldung zugänglich; 1810–1814 ordnete Inspektor Louis-Étienne Héricart de Thury (1776–1854) die Gebeine zu Wänden. Kaiser Franz I. von Österreich besuchte den Ort 1814, Napoleon III. 1860.","Der Zutritt zu den Brüchen ohne Genehmigung ist seit der Präfekturverordnung vom 2. November 1955 untersagt; den Begriff „Cataphiles“ für die Liebhaber der Gänge machte Barbara Glowczewskis Buch von 1983 bekannt. Im August 1944 diente ein Schutzstollen unter dem Place Denfert-Rochereau (nicht Teil des Rundgangs) als Kommandoposten der FFI."],"terms":[{"fr":"carrière","de":"Steinbruch","ety":"Altfranzösisch quarriere, zu lateinisch quadrum, „Viereck“: dort, wo Steine zu Quadern gehauen werden."},{"fr":"ossuaire","de":"Beinhaus","ety":"Von lateinisch ossuarium, zu os, ossis („Knochen“)."},{"fr":"cataphile","de":"Liebhaber der Katakomben und Steinbruchgänge","ety":"Aus cata- (Kurzform von catacombes) und griechisch philéō („lieben“); der Wortteil cata- ist etymologisch umstritten."}],"kids":["Der Kalkstein, in dem der Rundgang liegt, ist etwa 40 bis 48 Millionen Jahre alt.","1774 verschlang ein Einsturz rund 300 m einer Straße, daraufhin entstand 1777 die Inspection générale des carrières.","Die Gebeine wurden nachts in die Steinbrüche gebracht, damit niemand dagegen protestieren konnte.","Das Netz der Gänge unter Paris misst mehr als 250 km."],"quiz":[{"q":"Woher kamen die ersten Gebeine in den Katakomben?","a":"Vom Friedhof Saints-Innocents bei Les Halles."},{"q":"Was geschah 1774, und welche Behörde entstand daraufhin 1777?","a":"Ein Einsturz verschlang etwa 300 m einer Straße (heutige Rue Denfert-Rochereau); 1777 entstand die Inspection générale des carrières."},{"q":"Wann wurde das Ossuarium geweiht, und wie hieß es zunächst?","a":"Am 7. April 1786, als Ossuaire municipal."}],"sources":[{"title":"Catacombes de Paris: Site history","url":"https://www.catacombes.paris.fr/en/history/site-history"},{"title":"Catacombes de Paris: Geology and quarries","url":"https://www.catacombes.paris.fr/en/history/geology-and-quarries"},{"title":"Annales des Mines: Inspection des carrières (PDF)","url":"https://www.annales.org/archives/images/2016-07-26.pdf"},{"title":"Wikipedia (fr): Cimetière des Innocents (Orientierung)","url":"https://fr.wikipedia.org/wiki/Cimetière_des_Innocents"},{"title":"Wikipedia (fr): Cataphilie (Orientierung)","url":"https://fr.wikipedia.org/wiki/Cataphilie"},{"title":"Corbin, Alain: Pesthauch und Blütenduft. Eine Geschichte des Geruchs, Berlin 1984 (frz. Le Miasme et la jonquille, 1982)"}]}},{"t":"13:00","name":"Mittag in der Rue Daguerre","q":"Rue Daguerre Paris","mode":"zu Fuß (5 Min.)","hook":"Wo isst man in Paris wie die Pariser?","info":"Die Rue Daguerre im 14. Arrondissement ist eine Einkaufsstraße zum Bummeln mit Käse, Fisch und Bäckereien. Perfekt für einen Mittagsimbiss.","tip":"Ein Bistro mit Tagesgericht („plat du jour“) ist meist die günstigste Wahl.","deep":{"lage":"14. Arrondissement, nahe Denfert-Rochereau","history":["Louis Daguerre (18. November 1787 bis 10. Juli 1851), geboren in Cormeilles-en-Parisis, gestorben in Bry-sur-Marne, war Maler und Bühnenbildner. 1822 eröffnete er mit Charles Marie Bouton in Paris das Diorama, ein Theater mit großen, durchscheinenden Bildern, deren Beleuchtung vom Tag zur Nacht wechselte. Mit Joseph Nicéphore Niépce schloss er einen Vertrag; nach dessen Tod 1833 arbeitete er allein weiter und fand zwischen 1835 und 1837, dass Quecksilberdampf das Bild entwickelt und heißes Salzwasser es fixiert.","Am 7. Januar 1839 hörten Académie des sciences und Académie des beaux-arts eine allgemeine Beschreibung des Verfahrens. Der Staat erwarb die Rechte gegen lebenslange Renten (Daguerre 6.000 Francs, Niépces Sohn Isidore 4.000) und übergab das Verfahren am 19. August 1839 als Geschenk der Welt, samt veröffentlichter Anleitung. In Großbritannien war zuvor ein Patent angemeldet worden. Zunächst waren bei hellem Sonnenlicht zehn Minuten oder mehr nötig, wenige Jahre später nur noch einige Sekunden.","Die Straße gab es um 1730 als Weg in der Gemeinde Montrouge, vor den Toren der Stadt. Um 1840 hieß sie Rue de la Pépinière nach der großen Baumschule der Brüder Cels; seit 1867 trägt sie Daguerres Namen. Der Petit-Montrouge kam 1860, bei der Neuordnung in zwanzig Arrondissements, ganz zu Paris und bildet einen Teil des 14. Arrondissements; der nördliche Teil der Straße wurde 1863 ins Pariser Straßennetz einbezogen. Die Gare Montparnasse brachte die Eisenbahn ins Viertel.","Das Quartier war zunächst bescheiden und gehörte seit dem frühen 20. Jahrhundert zum Umfeld der Künstler von Montparnasse: Henri Rousseau wohnte 1905–1906 hier, Alexander Calder stieg 1926 in einem billigen Hotel ab, Agnès Varda lebte ab 1951 in der Straße und drehte hier Teile von Cléo de 5 à 7 (1961) und den Dokumentarfilm Daguerréotypes (1975). Nach einem Stadtführer lebte auch der Arbeitsminister Ambroise Croizat (1945–1947), der die Sécurité sociale aufbaute, in der Straße. Eine überdachte Markthalle wurde 1994 trotz Anwohnerprotest abgerissen; ein Teil der Straße ist heute Fußgängerzone. Seit den 1980er-Jahren gilt das Viertel als aufgewertet."],"terms":[{"fr":"daguerréotype","de":"Daguerreotypie (frühes Fotoverfahren auf Metallplatte)","ety":"Nach Louis Daguerre, dazu griechisch týpos („Abdruck“)."},{"fr":"arrondissement","de":"Stadtbezirk","ety":"Von arrondir („abrunden, zusammenfassen“), zu rond, lateinisch rotundus."}],"kids":["Die Straße heißt seit 1867 nach Louis Daguerre; vorher hieß sie Rue de la Pépinière, nach einer großen Baumschule.","Die ersten Daguerreotypien brauchten bei Sonne zehn Minuten oder mehr Belichtung, wenige Jahre später nur noch einige Sekunden.","Daguerre eröffnete 1822 in Paris das Diorama, ein Theater mit Bildern, die von Tag zu Nacht wechselten.","Seit dem 19. August 1839 durfte man das Verfahren fast überall frei nutzen, nur in Großbritannien war ein Patent angemeldet."],"quiz":[{"q":"Was erfand beziehungsweise vermarktete Louis Daguerre?","a":"Die Daguerreotypie, ein frühes Fotoverfahren, 1839 vom französischen Staat der Welt übergeben."},{"q":"Wie hieß die Rue Daguerre früher, und wonach war sie benannt?","a":"Rue de la Pépinière, nach der großen Baumschule der Brüder Cels."},{"q":"Seit welchem Jahr gehört der Petit-Montrouge zu Paris, und zu welchem Arrondissement?","a":"Seit 1860, als Teil des 14. Arrondissements."}],"sources":[{"title":"Wikipedia (fr): Rue Daguerre (Orientierung)","url":"https://fr.wikipedia.org/wiki/Rue_Daguerre"},{"title":"Wikipedia (en): Louis Daguerre (Orientierung)","url":"https://en.wikipedia.org/wiki/Louis_Daguerre"},{"title":"Wikipedia (fr): 14e arrondissement de Paris (Orientierung)","url":"https://fr.wikipedia.org/wiki/14e_arrondissement_de_Paris"},{"title":"Paris.fr: Au revoir Agnès Varda","url":"https://www.paris.fr/pages/au-revoir-agnes-varda-magnifique-artiste-et-amoureuse-du-14e-arrondissement-6634"},{"title":"Paris Zigzag: Petite histoire de la rue Daguerre","url":"https://www.pariszigzag.fr/insolite/histoire-insolite-paris/petite-histoire-de-la-rue-daguerre-le-quartier-general-des-artistes/"},{"title":"Frizot, Michel (Hg.): Neue Geschichte der Fotografie, Köln 1998"}]}},{"t":"14:45","name":"Jardin du Luxembourg","q":"Jardin du Luxembourg Paris","mode":"Metro/RER B oder zu Fuß (20 Min.)","hook":"Wo schwimmen die kleinen Segelboote?","info":"Der Park gehört zum Palais du Luxembourg, in dem heute der Senat tagt. Es gibt Teich, Statuen, Stuhlreihen und ein Spielbecken mit Segelbooten. Die Médici-Fontäne ist besonders hübsch.","tip":"Segelboot-Miete oder Karussell sind kleine Extras für die Kinder.","deep":{"lage":"6. Arrondissement, linkes Seine-Ufer","history":["Marie de Médicis (1575–1642), aus dem Florentiner Haus Medici, Witwe des 1610 ermordeten Heinrich IV. (Bourbon) und Regentin, kaufte 1612 das Hôtel des François de Luxembourg, Herzog von Piney, mit rund 8 ha Land. Die Kartäuser verweigerten den Verkauf ihres Nachbargrundes. Ab 1615 baute Salomon de Brosse; sie wünschte sich eine Residenz nach Art des Palazzo Pitti und des Boboli-Gartens, wo sie aufgewachsen war. 1625 zog sie ein, 1631 war der Bau fast vollendet, doch nach der Journée des dupes verbannte Ludwig XIII. seine Mutter. Der Garten wuchs um 1630 auf etwa 30 ha; Jacques Boyceau legte Parterres und ein achteckiges Becken an.","1778 schenkte Ludwig XVI. das Palais seinem Bruder, dem Comte de Provence, später Ludwig XVIII. In der Revolution war es Gefängnis (Maison nationale de sûreté, rund 800 Häftlinge), 1795 zog das Directoire ein, Ende 1799 der Sénat conservateur, 1814 die Chambre des Pairs. Beim Umbau unter Napoleon III. verlor der Garten 1865 durch die Verlängerung der Rue de l'Abbé-de-l'Épée rund 7 ha; heute sind es 23 ha. Louis-Philippe gab 1848 die 20 Statuen von Königinnen und berühmten Frauen in Auftrag.","Seit 1879, nach dem Parlamentssitz in Versailles (1871–1879), tagt der Senat der Dritten Republik im Palais. 1940 bezog die Luftwaffe-West das Haus; 1944 folgte die Assemblée consultative provisoire, 1946 die Pariser Friedenskonferenz, dann der Conseil de la République. Seit 1958 ist das Palais Sitz des Senats der Fünften Republik.","Das Parlament hat zwei Kammern. Der Sénat zählt 348 Mitglieder, gewählt für sechs Jahre von rund 162.000 Grands électeurs (zu etwa 95 Prozent Delegierte der Gemeinderäte), alle drei Jahre wird die Hälfte erneuert. Je Departement gibt es von einem (Lozère) bis zwölf (Paris) Senatoren; bei einem oder zwei Sitzen gilt die Mehrheitswahl in zwei Gängen, ab drei Sitzen die Verhältniswahl. Ein Gesetz braucht von beiden Kammern denselben Text (navette); bei Streit versucht eine Kommission aus je 7 Senatoren und Abgeordneten einen Kompromiss, sonst kann die Regierung der Assemblée das letzte Wort geben. Bei Verfassungsänderungen sind beide gleichberechtigt; Gesetze zur Organisation der Gebietskörperschaften gehen zuerst an den Senat, Haushaltsgesetze an die Assemblée."],"terms":[{"fr":"Sénat","de":"Senat","ety":"Von lateinisch senatus, zu senex („alt“): ursprünglich der „Rat der Alten“."},{"fr":"navette (parlementaire)","de":"Pendelverfahren zwischen den Kammern","ety":"Verkleinerung zu altfranzösisch nef („Schiff“, lateinisch navis); gemeint ist das hin und her laufende Weberschiffchen."}],"kids":["Das Palais sollte an den Palazzo Pitti in Florenz erinnern, wo Marie de Médicis aufgewachsen war.","Der Park hatte anfangs etwa 8 ha, um 1630 rund 30 ha und umfasst heute 23 ha.","Der Senat hat 348 Mitglieder, und alle drei Jahre wird die Hälfte neu gewählt.","1940 bezog die deutsche Luftwaffe-West das Palais als Hauptquartier."],"quiz":[{"q":"Welche Königinwitwe ließ das Palais du Luxembourg bauen?","a":"Marie de Médicis, Witwe Heinrichs IV."},{"q":"Wie viele Senatoren gibt es, und wie oft wird gewählt?","a":"348; alle drei Jahre wird die Hälfte neu gewählt, die Amtszeit beträgt sechs Jahre."},{"q":"Wer kann bei Streit zwischen Senat und Assemblée das letzte Wort bekommen?","a":"Die Assemblée nationale, wenn die Regierung es verlangt."}],"sources":[{"title":"Sénat: L'histoire du Palais du Luxembourg","url":"https://www.senat.fr/connaitre-le-senat/patrimoine/lhistoire-du-palais-du-luxembourg.html"},{"title":"Sénat: A princely residence","url":"https://www.senat.fr/lng/en/the-luxembourg-palace/a-princely-residence.html"},{"title":"Sénat: Mode d'élection des sénateurs","url":"https://www.senat.fr/connaitre-le-senat/role-et-fonctionnement/mode-delection-des-senateurs.html"},{"title":"Sénat: Le Sénat et la loi","url":"https://www.senat.fr/connaitre-le-senat/role-et-fonctionnement/le-senat-et-la-loi.html"},{"title":"Wikipedia (en): Jardin du Luxembourg (Orientierung)","url":"https://en.wikipedia.org/wiki/Jardin_du_Luxembourg"}]}},{"t":"16:30","name":"Panthéon von außen (optional innen)","q":"Pantheon Paris","mode":"zu Fuß (10 Min.)","optional":true,"hook":"Wer ruht hier, Voltaire, Victor Hugo oder Marie Curie?","info":"Das Panthéon war ursprünglich eine Kirche und ist heute Grabstätte bedeutender Persönlichkeiten Frankreichs, darunter Voltaire, Rousseau, Victor Hugo und Marie Curie. Im Inneren hängt das Foucaultsche Pendel. Öffnungszeiten und Preise vorab auf paris-pantheon.fr prüfen, wir konnten sie nicht verifizieren.","tip":"Von außen reicht ein Foto, wenn die Kinder müde sind.","cost":"Preise: bitte prüfen.","deep":{"lage":"Montagne Sainte-Geneviève, 5. Arrondissement","history":["Nach einer schweren Erkrankung in Metz gelobte Ludwig XV. (Bourbon, 1710–1774) im Jahr 1744, die Abteikirche der heiligen Genoveva, der Patronin von Paris, neu zu bauen. Am 6. September 1764 legte er den Grundstein, eine königliche Lotterie half bei der Finanzierung. Jacques-Germain Soufflot (1713–1780) hatte die Bauleitung; nach seinem Tod vollendeten Maximilien Brébion und Jean-Baptiste Rondelet das Werk 1790. Bis zum Eiffelturm 1889 war es der höchste Punkt der Stadt.","Mit dem Tod Mirabeaus wurde die Kirche 1791 zur nationalen Ruhmesstätte. Das Dekret vom 4. April 1791 sah über dem Giebel die Inschrift „Aux grands hommes la patrie reconnaissante“ vor; Voltaire wurde am 11. Juli 1791 überführt, Rousseau 1794. Mirabeau gehört zu drei Personen, die später wieder entfernt wurden. Die Nutzung folgte den Regimen: 1806 Kirche mit Krypta für Würdenträger des Kaiserreichs (zuerst Tronchet), 1815 Kirche, 1830 wieder Panthéon, 1848 Temple de l'Humanité, ab Dezember 1851 erneut Kirche. Mit Victor Hugos Begräbnis am 1. Juni 1885, dem rund zwei Millionen Menschen folgten, wurde die Rolle als Ruhmeshalle der Republik dauerhaft.","1851 erlaubte Louis-Napoléon Bonaparte Léon Foucault den Versuch in der Kuppel; die Einladung lautete, die Erde sich drehen zu sehen. Das Pendel hing an einem 67 m langen Stahldraht, die Kugel wiegt 28 kg. Der Staatsstreich vom Dezember 1851 beendete den Versuch; seit 1995 hängt das Pendel dauerhaft.","Seit 1964, als Malraux Jean Moulin einführte, entscheidet allein der Präsident der Republik über eine Panthéonisation. Marie Curie kam 1995 als erste Frau aus eigenem Verdienst, Simone Veil 2018 mit ihrem Mann Antoine, Joséphine Baker am 30. November 2021, Missak Manouchian am 21. Februar 2024 mit seiner Frau Mélinée, Robert Badinter am 9. Oktober 2025; Baker und Badinter haben Kenotaphe. Am 23. Juni 2026 folgten Marc und Simonne Bloch. Marc Bloch (6. Juli 1886 bis 16. Juni 1944) gründete 1929 mit Lucien Febvre in Straßburg die Zeitschrift Annales; die Gestapo verhaftete ihn am 8. März 1944 in Lyon, am 16. Juni 1944 wurde er mit 27 anderen Widerstandskämpfern erschossen. Simonne starb am 2. Juli 1944. Beide liegen in Bourg-d'Hem, im Panthéon steht ein Kenotaph."],"terms":[{"fr":"panthéon","de":"Tempel aller Götter, später Ruhmeshalle","ety":"Von griechisch pántheion, aus pan („alles“) und theós („Gott“)."},{"fr":"cénotaphe","de":"Kenotaph, leeres Grabmal","ety":"Von griechisch kenotáphion, aus kenós („leer“) und táphos („Grab“)."}],"kids":["Das Foucaultsche Pendel hängt an einem 67 m langen Stahldraht, die Kugel wiegt 28 kg.","Voltaire kam 1791 ins Panthéon, Rousseau 1794; Marie Curie war 1995 die erste Frau aus eigenem Verdienst.","Zu Victor Hugos Begräbnis am 1. Juni 1885 kamen rund zwei Millionen Menschen."],"quiz":[{"q":"Was zeigte Léon Foucault 1851 im Panthéon?","a":"Mit dem Pendel, dass sich die Erde dreht."},{"q":"Wer entscheidet heute, wer ins Panthéon aufgenommen wird?","a":"Der Präsident der Republik."},{"q":"Welcher Historiker wurde am 23. Juni 2026 aufgenommen, und was gründete er 1929 mit Lucien Febvre?","a":"Marc Bloch; die Zeitschrift Annales."}],"sources":[{"title":"Panthéon (CMN): History of the Panthéon","url":"https://www.paris-pantheon.fr/en/discover/history-of-the-pantheon"},{"title":"Panthéon (CMN): Quelles sont les grandes figures du Panthéon","url":"https://www.paris-pantheon.fr/en/discover/quelles-sont-les-grandes-figures-du-pantheon"},{"title":"Panthéon (CMN): Foucault's pendulum","url":"https://www.paris-pantheon.fr/en/discover/foucault-s-pendulum"},{"title":"Paris.fr: L'historien et résistant Marc Bloch entre au Panthéon","url":"https://www.paris.fr/pages/l-historien-et-resistant-marc-bloch-entre-au-pantheon-35606"},{"title":"Académie de Versailles: Le Panthéon (Webinaire, PDF)","url":"https://histoire.ac-versailles.fr/IMG/pdf/pantheon_webinaire.pdf"},{"title":"Ozouf, Mona: Le Panthéon. L'École normale des morts, in: Pierre Nora (Hg.), Les Lieux de mémoire, Bd. 1: La République, Paris 1984"}]}},{"t":"17:45","name":"Zurück nach Montmartre und Abendessen","q":"Rue des Abbesses Paris","mode":"Metro","hook":"Ruhiger Abend nach zwei Stationen.","info":"Heute früh ins Bett, morgen steht Versailles an. Für Hungrige: Crêperie oder Bistro in der Nähe der Wohnung.","tip":"Tickets für Versailles heute Abend noch einmal prüfen."}],"kids":"Wer findet die Inschrift am Eingang zum Beinhaus, „Arrête ! C'est ici l'empire de la mort“ (Halt! Hier ist das Reich des Todes)?","fallback":"Luxembourg-Garten kürzen und im Panthéon aufwärmen.","legs":[{"from":"Wohnung","to":"Katakomben","m":6615,"rec":"metro","mixM":305,"metroMin":47,"via":"Abbesses (Metro 12), Montparnasse umsteigen, Denfert-Rochereau (Metro 4 oder 6)","metro":"Abbesses (305 m), Metro 12 Richtung Mairie d'Issy bis Montparnasse–Bienvenüe (14 Stationen), umsteigen in Metro 4 oder 6 bis Denfert-Rochereau (3 Stationen). Der Ausgang liegt am Eingang der Katakomben. Lange Umsteigewege in Montparnasse.","min":88},{"from":"Katakomben","to":"Rue Daguerre (Mittag)","m":413,"rec":"walk","mixM":413,"min":6},{"from":"Rue Daguerre","to":"Jardin du Luxembourg","m":2191,"rec":"either","mixM":2191,"metroMin":16,"metro":"Alternative: Denfert-Rochereau (ca. 450 m), RER B Richtung Gare du Nord bis Luxembourg (2 Stationen). Zu Fuß geht es über den Boulevard Raspail.","min":29},{"from":"Jardin du Luxembourg","to":"Panthéon","m":819,"rec":"walk","mixM":819,"min":11},{"from":"Panthéon","to":"Wohnung","m":5234,"rec":"metro","mixM":705,"metroMin":50,"via":"Cardinal Lemoine (Metro 10), Sèvres–Babylone umsteigen, Abbesses (Metro 12)","metro":"Cardinal Lemoine (ca. 400 m), Metro 10 Richtung Boulogne bis Sèvres–Babylone (5 Stationen), umsteigen in Metro 12 Richtung Mairie d'Aubervilliers bis Abbesses (11 Stationen), dann 305 m.","min":70}]},{"id":"p5","badge":{"label":"5","kind":"day","bg":"#F2B705","fg":"#1A1A1A","sym":"🏰"},"tag":"Paris, Tag 5","date":"2026-10-16","short":"Fr 16.10.","name":"Versailles","title":"Freitag: Schloss Versailles","line":{"label":"C","kind":"rer","bg":"#F2C931","fg":"#1A1A1A","caption":"RER C bis Versailles Château Rive Gauche"},"lead":"Ganztagsausflug zum Schloss des Sonnenkönigs. Freitag ist ideal, die Musical Gardens laufen und das Schloss ist offen (Montag ist Ruhetag).","leave":"10:30","sunset":"18:58","stops":[{"t":"10:30","name":"Anfahrt mit dem RER C oder dem Auto","q":"Gare de Versailles Chateau Rive Gauche","mode":"RER C, ca. 40 Min.","hook":"Zug oder Auto, was ist entspannter?","info":"Mit der Navigo-Wochenkarte (Zonen 1–5) ist Versailles Château Rive Gauche (Zone 4) enthalten. Mit Metro 12, Metro 8 und RER C braucht ihr grob 75 bis 85 Minuten, mit dem Auto je nach Verkehr etwa 50 bis 70 Minuten (Crit'Air-Plakette ist vorhanden). Der Zug umgeht Verkehr und Parkplatzsuche am Schloss, das Auto spart rund 20 Minuten und ist abends mit müden Kindern bequemer. Beides geht.","tip":"Wenn Auto: nach der Rush-Hour starten, Schloss-Zeitfenster entsprechend wählen."},{"t":"12:15","name":"Mittag in der Stadt oder im Park","q":"Jardins du Chateau de Versailles","mode":"zu Fuß ab Bahnhof","hook":"Picknick im Park des Sonnenkönigs?","info":"Der Park ist von 7:00 bis 20:30 Uhr zugänglich. In der Stadt Versailles gibt es Bistros und Bäckereien. Ein Picknick im Park ist am einfachsten.","tip":"Am Freitag laufen die „Musical Gardens“ (bis 30.10.), Musik in den Bosketten.","deep":{"lage":"Stadt Versailles (Département Yvelines), rund 20 km südwestlich von Paris","history":["Vor dem Schloss gab es ein Dorf: Versailles wird 1038 erstmals in einer Urkunde genannt. 1561 erhielt Martial de Loménie die Herrschaft samt vier Jahrmärkten und einem Wochenmarkt; der Ort hatte etwa 500 Einwohner, 1643 rund 1.000. Als Ludwig XIV. ab 1662 das Schloss ausbaute, entstand daneben eine Planstadt: Der König kaufte 1663 Land, 1671 wurde die Stadt gegründet, und 1671/72 verkaufte er Bauparzellen zu sehr günstigen Bedingungen, um Adlige und Kaufleute anzuziehen.","Von der Place d’Armes vor dem Schloss gehen drei Avenuen als „patte d’oie“ aus. Die Bauvorschriften verlangten Backstein und Stein, ersatzweise roten Putz, und Schieferdächer; der Stadthistoriker Lavedan sprach von der „livrée du château“. Im Quartier Notre-Dame entstand ab 1686 die Pfarrkirche nach Plänen Hardouin-Mansarts, das Quartier Saint-Louis wurde ab 1685 auf dem ehemaligen Parc-aux-Cerfs parzelliert; seine Pfarrei folgte 1730, die Kathedrale 1742–1754. Die Grande und Petite Écurie (1679–1682) und der Grand Commun mit den Küchen für das königliche Küchenpersonal (1684) lagen am Schloss.","Die Wasserversorgung war das Dauerproblem. Die Machine de Marly, 1684 eingeweiht, trieb 13 Schaufelräder von je 12 m Durchmesser an, die über 257 Pumpen Seine-Wasser den Hang hinaufhoben; der Aquädukt von Louveciennes leitete es nach Marly und Versailles. Entworfen vom Chevalier Arnold de Ville mit dem Lütticher Rennequin Sualem, lief sie „tant bien que mal“ bis 1817.","Die Einwohnerzahlen sind je nach Quelle verschieden: Die Stadt Versailles nennt rund 24.000 für 1722, 37.000 für 1744 und 50.000 für 1790, andere Darstellungen 60.000 bis 70.000 für 1789. Nach dem Weggang des Hofes im Oktober 1789 sank die Zahl bis 1824 auf etwa 28.000; erst 1901 war mit 54.982 der Stand von 1790 wieder erreicht. Wohlhabende Familien hatten Pariser Stadthäuser ohnehin vorgezogen; viele Hofgebäude, besonders in Saint-Louis, wurden militärisch genutzt.","Seit März 1790 war Versailles Präfektur des Départements Seine-et-Oise, seit der Teilung zum 1. Januar 1968 ist es Präfektur der Yvelines. Das Rathaus ist das ehemalige Hôtel de Conti, Sitz der Stadt seit 1790. Von März 1871 bis 1879 arbeiteten Regierung und Parlament in Versailles, nachdem die Regierung Thiers vor der Pariser Kommune ausgewichen war."],"terms":[{"fr":"patte d’oie","de":"Gänsefuß (drei von einem Punkt ausgehende Straßen)","ety":"Von patte (Pfote, Fuß) und oie (Gans); das Wort nimmt das Bild des gespreizten Gänsefußes auf."},{"fr":"Grand Commun","de":"Großes Wirtschaftsgebäude des Hofes","ety":"commun geht auf lateinisch communis (gemeinsam) zurück; les communs bezeichnet die Wirtschafts- und Dienstgebäude eines Schlosses."}],"kids":["Die Machine de Marly hatte 13 Wasserräder von je 12 m Durchmesser und 257 Pumpen, um Seine-Wasser nach Versailles zu heben.","1561 lebten in Versailles etwa 500 Menschen, 1722 nach Angaben der Stadt rund 24.000.","Die Machine de Marly lief von 1684 bis 1817, also über 130 Jahre.","Die Stadt Versailles entstand ab 1671 auf dem Reißbrett: Der König verkaufte Bauland zu günstigen Bedingungen."],"quiz":[{"q":"Wie hieß die Maschine, die Seine-Wasser nach Versailles pumpte?","a":"Machine de Marly."},{"q":"In welchem Quartier steht die zwischen 1742 und 1754 gebaute Kathedrale?","a":"Im Quartier Saint-Louis."},{"q":"Wie viele Wasserräder hatte die Machine de Marly, und wie groß war jedes?","a":"13 Schaufelräder mit je 12 m Durchmesser."}],"sources":[{"title":"Ville de Versailles: Versailles depuis son origine","url":"https://www.versailles.fr/222/decouvrir-versailles/histoire-de-versailles/versailles-depuis-son-origine.htm"},{"title":"Ville de Versailles: Une ville historique","url":"https://www.versailles.fr/218/decouvrir-versailles/histoire-de-versailles/une-ville-historique.htm"},{"title":"Château de Versailles: La ville de Versailles, cité royale (Autour du Château)","url":"https://en.chateauversailles.fr/discover/estate/around-palace"},{"title":"Île-de-France: La machine de Marly","url":"https://www.iledefrance.fr/toutes-les-actualites/la-machine-de-marly"},{"title":"Encyclopædia Universalis: Versailles et son château, la ville","url":"https://www.universalis.fr/encyclopedie/versailles-et-son-chateau/5-la-ville-urbanisation-et-urbanite/"}]}},{"t":"13:30","name":"Schloss: Spiegelsaal und königliche Gemächer","q":"Chateau de Versailles","mode":"zu Fuß (10 Min.)","hook":"Welcher Saal hat für Deutschland und Frankreich zweimal Geschichte geschrieben?","info":"Ludwig XIV. zog 1682 mit dem Hof nach Versailles. Der Spiegelsaal entstand ab 1678. Hier wurde am 18. Januar 1871 das Deutsche Kaiserreich ausgerufen und am 28. Juni 1919 der Versailler Vertrag unterzeichnet, der den Ersten Weltkrieg beendete. Das Schloss ist Di–So 9:00–18:30 geöffnet, Montag Ruhetag. Nur der Schlossbesuch braucht ein Zeitfenster.","tip":"Zeitfenster online buchen, gut 2 Stunden einplanen.","cost":"Passport (Schloss, Trianon, Gärten): 35 € / 32 € für EWR-Bewohner. Kinder- und Jugendpreise vorab auf chateauversailles.fr prüfen.","closedOn":["Mo"],"deep":{"lage":"Versailles (Département Yvelines), rund 20 km südwestlich von Paris","history":["Ludwig XIV. (1638–1715) aus dem Haus Bourbon erbte ein Jagdschloss: Ludwig XIII. hatte 1623/24 ein kleines Jagdhaus oberhalb des Dorfes Versailles bauen und 1631–1634 zu einem größeren Schloss erweitern lassen. Nach dem Tod Kardinal Mazarins 1661 begann Ludwig XIV. den Ausbau, der bis zu seinem Tod 1715 andauerte. 1682 wurden Hof und Regierung dauerhaft nach Versailles verlegt; zuvor hatte der Hof mehrere Residenzen im Wechsel genutzt.","Norbert Elias beschrieb den Hof als Herrschaftsinstrument, das den Adel an den König band und durch Rangkonkurrenz kontrollierte. Der Tag des Königs war streng ritualisiert. Gegen 8.30 Uhr öffnete der erste Kammerdiener die Bettvorhänge („Sire, voilà l’heure“), danach wurden nach Rang gestaffelte Gruppen zugelassen. Beim Grand Lever wurden die in den Vorzimmern, besonders im Œil-de-Bœuf, wartenden Adligen nach Rang eingelassen; das Schlafzimmer konnte mehr als hundert Personen fassen.","Den Mittelpunkt bildet der Spiegelsaal, 1678–1684 durch Jules Hardouin-Mansart anstelle einer wetterexponierten Terrasse Louis Le Vaus gebaut. Er ist 73 m lang; in 17 Arkaden gegenüber den 17 Fenstern sitzen 357 Spiegel, die als Beleg galten, dass französische Manufakturen mit dem venezianischen Monopol konkurrieren konnten. Charles Le Brun malte 30 Deckenkompositionen zu den ersten 18 Regierungsjahren bis zum Frieden von Nimwegen.","Nach 1715 verließ der Hof Versailles, Ludwig XV. brachte ihn am 15. Juni 1722 zurück. Am 5. und 6. Oktober 1789 zog, ausgelöst auch durch Brotknappheit in Paris, eine Menge mit vielen Frauen nach Versailles; die Königsfamilie ging danach nach Paris, und das Schloss wurde nie wieder Residenz. 1837 richtete Louis-Philippe hier das Musée de l’Histoire de France ein. Am 18. Januar 1871 wurde im Spiegelsaal das Deutsche Kaiserreich ausgerufen, am 28. Juni 1919 der Versailler Vertrag unterzeichnet.","Heute tagt hier der Congrès du Parlement, die gemeinsame Sitzung von Nationalversammlung und Senat. Nach Art. 89 der Verfassung der Fünften Republik billigt er Verfassungsänderungen mit Dreifünftelmehrheit der abgegebenen Stimmen; nach Art. 18 Abs. 2 (seit der Revision von 2008) kann der Präsident vor ihm sprechen. Sitzungsort ist der Saal im Südflügel, nicht der Spiegelsaal. Ansprachen hielten Sarkozy (2009), Hollande (2015) und Macron (2017, 2018). Von 25 Revisionen seit 1958 billigte der Congrès 22."],"terms":[{"fr":"lever du roi","de":"Aufstehzeremoniell des Königs","ety":"lever ist die Substantivierung des Verbs lever (aufstehen, heben) aus lateinisch levare."},{"fr":"Œil-de-Bœuf","de":"Ochsenauge (Vorzimmer des Königs)","ety":"Der Raum ist nach dem ovalen Fenster benannt, das in der Architektur als œil-de-bœuf bezeichnet wird."}],"kids":["Der Spiegelsaal ist 73 m lang und hat 357 Spiegel in 17 Arkaden, denen 17 Fenster gegenüberliegen.","Der Tag des Königs begann gegen 8.30 Uhr mit einem Zeremoniell, bei dem Höflinge nach Rang zusehen durften, wie er aufstand.","Am 28. Juni 1919 wurde im Spiegelsaal der Versailler Vertrag unterzeichnet, am 18. Januar 1871 hier das Deutsche Kaiserreich ausgerufen.","Der Congrès du Parlement tagt nicht im Spiegelsaal, sondern im Saal des Südflügels."],"quiz":[{"q":"Wie viele Spiegel hat der Spiegelsaal?","a":"357 Spiegel, verteilt auf 17 Arkaden."},{"q":"In welchem Jahr zog der Hof dauerhaft nach Versailles, und welches Ereignis beendete 1789 die Rolle als Residenz?","a":"1682; der Zug der Pariser Menge nach Versailles am 5./6. Oktober 1789, nach dem die Königsfamilie nach Paris ging."},{"q":"Wo tagt der Congrès du Parlement in Versailles?","a":"Im Saal des Südflügels (Aile du Midi), nicht im Spiegelsaal."}],"sources":[{"title":"Château de Versailles: Grandes dates de l’histoire","url":"https://www.chateauversailles.fr/decouvrir/histoire"},{"title":"Château de Versailles: Galerie des Glaces","url":"https://en.chateauversailles.fr/discover/estate/palace/hall-mirrors"},{"title":"Mathieu da Vinha: La journée de Louis XIV (Magazine du Château de Versailles)","url":"https://www.chateauversailles.fr/sites/default/files/presse/documents/la_journee_de_louis_xiv_-_article_mathieu_da_vinha_magazine_chateau_de_versailles.pdf"},{"title":"Assemblée nationale: Fiche Le Congrès (Stand 8.3.2024)","url":"https://www.assemblee-nationale.fr/dyn/contenu/telechargement/625540/file/Fiche%202%20-%20Congr%C3%A8s_actualis%C3%A9e08032024.pdf"},{"title":"Journées des 5 et 6 octobre 1789 (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Journées_des_5_et_6_octobre_1789"},{"title":"Norbert Elias: Die höfische Gesellschaft (1969)"}]}},{"t":"15:45","name":"Gärten, Grand Canal und Trianon","q":"Grand Canal Versailles","mode":"zu Fuß / Golfcart / Fahrrad","hook":"Wo hatte Marie Antoinette ihren eigenen kleinen Bauernhof?","info":"Der Grand Canal ist rund 1,7 km lang. Im Domaine de Trianon (ab 12:00) stehen das Grand Trianon, das Petit Trianon und das Hameau de la Reine, ein Bauerndörfchen. Die Wege sind weit, ein Rad oder Golfcart-Miete sind hilfreich (Preise vorab prüfen).","tip":"Boot- und Fahrradverleih am Grand Canal vor Ort prüfen.","cost":"Musical Gardens/Fountains Show: 15 € extra, falls kein Passport.","deep":{"lage":"Versailles, Parkanlage westlich des Schlosses","history":["André Le Nôtre (1613–1700) entstammte einer Familie, die seit dem 16. Jahrhundert für die Krone Gärten pflegte. 1637 wurde er Obergärtner der Tuilerien, 1656–1661 gestaltete er für Fouquet Vaux-le-Vicomte. 1661 vertraute Ludwig XIV. ihm die Gärten von Versailles an; die Arbeiten dauerten etwa vierzig Jahre. 1675 erhielt Le Nôtre einen Titel.","Der Park umfasst rund 800 ha mit geraden Wegen, Wäldchen und Feldern und ist von einer Mauer umgeben; das 1979 in die Welterbeliste eingetragene Gebiet (Kriterien i, ii und vi) misst 1.070 ha. Der 1668–1679 angelegte Grand Canal ist rund 1,7 km lang. 1674 sandte die Republik Venedig dem König zwei Gondeln mit vier Gondolieri; im Winter diente das zugefrorene Wasser zum Schlittschuhlaufen und Schlittenfahren. Der Lac des Suisses entstand 1679–1686 auf 12 ha, der Ru de Gally, der im Park entspringt, ist 22 km lang.","Rund 200.000 Bäume zählte die Domäne vor dem Sturm vom Dezember 1999. Mehr als 10.000 wurden entwurzelt oder gespalten, 80 % der seltenen Arten gingen verloren. Anschließend wurden 50.000 Bäume gepflanzt, finanziert mit 19 Mio. € vom Staat und 2 Mio. € aus einem öffentlichen Spendenaufruf. Die Wasserversorgung der Anlagen übernahm unter anderem die Machine de Marly (siehe vorige Station).","Der Domaine de Trianon diente als Rückzug vom Hof. Das Grand Trianon ließ Ludwig XIV. 1687 durch Hardouin-Mansart auf dem Platz des älteren Porzellan-Trianon in rosa Marmor und Porphyr errichten; Ludwig XVIII. starb dort 1824, und 1963 entschied de Gaulle, den Nordflügel zur Präsidentenresidenz umzubauen.","Das Petit Trianon beschloss Ludwig XV. 1758; Ange-Jacques Gabriel vollendete es 1768. Ludwig XVI. gab es 1774 an Marie-Antoinette (1755 in Wien geboren, Haus Habsburg-Lothringen, 1793 hingerichtet). Das Hameau de la Reine entstand 1783–1786 unter Richard Mique nach normannischem Vorbild mit Mühle und Molkerei, das Theater wurde 1780 eingeweiht."],"terms":[{"fr":"bosquet","de":"Gartenboskett, Lustwäldchen","ety":"Aus italienisch boschetto, der Verkleinerungsform von bosco (Wald)."},{"fr":"hameau","de":"Weiler","ety":"Altfranzösisch hamel, Verkleinerungsform von ham, das auf fränkisch *haim (Heim) zurückgeht."}],"kids":["Der Grand Canal ist rund 1,7 km lang, und 1674 schenkte Venedig dem König dafür zwei Gondeln samt vier Gondolieri.","Der Park von Versailles ist etwa 800 ha groß, das Welterbegebiet 1.070 ha.","Nach dem Sturm von Dezember 1999 gingen mehr als 10.000 der rund 200.000 Bäume verloren, danach wurden 50.000 neu gepflanzt.","Das Hameau de la Reine hat Mühle und Molkerei und entstand 1783–1786 unter Richard Mique."],"quiz":[{"q":"Wer legte die Gärten von Versailles an?","a":"André Le Nôtre."},{"q":"Welche Stadt schenkte Ludwig XIV. 1674 zwei Gondeln mit vier Gondolieri?","a":"Venedig (Republik Venedig)."},{"q":"Wie viele Bäume wurden nach dem Sturm von 1999 gepflanzt?","a":"50.000."}],"sources":[{"title":"Château de Versailles: André Le Nôtre (1613–1700)","url":"https://en.chateauversailles.fr/discover/history/great-characters/andre-notre"},{"title":"Château de Versailles: The Park","url":"https://en.chateauversailles.fr/discover/estate/park"},{"title":"Château de Versailles: The storm of 1999","url":"https://en.chateauversailles.fr/discover/history/key-dates/storm-versailles-1999"},{"title":"Château de Versailles: The estate of Trianon (mit Grand und Petit Trianon)","url":"https://en.chateauversailles.fr/discover/estate/estate-trianon"},{"title":"UNESCO Welterbezentrum: Palace and Park of Versailles","url":"https://whc.unesco.org/en/list/83"}]}},{"t":"17:45","name":"Rückfahrt nach Paris","q":"Gare de Versailles Chateau Rive Gauche","mode":"RER C","hook":"Müde und voller Eindrücke.","info":"Rückfahrt ab etwa 17:00. Abendessen im Viertel, ein ruhiger Abend.","tip":"Gepäck leicht halten, die Wege sind weit."}],"kids":"Jeder sucht den schönsten Spiegel im Spiegelsaal und schätzt, wie viele es sind.","fallback":"Schloss ausführlich, Gärten nur kurz, Trianon eventuell auslassen.","legs":[{"from":"Wohnung","to":"Versailles (RER C)","m":null,"rec":"metro","mixM":305,"metroMin":80,"via":"Abbesses (Metro 12), Concorde (Metro 8), Invalides (RER C)","metro":"Abbesses (305 m), Metro 12 bis Concorde (7 Stationen), umsteigen in Metro 8 bis Invalides (1 Station), RER C Richtung Versailles-Château Rive Gauche (ca. 35–40 Min.). Insgesamt grob 75–85 Min. Mit dem Auto etwa 50–70 Min., je nach Verkehr.","min":null},{"from":"Bahnhof Versailles-Rive-Gauche","to":"Schloss","m":470,"rec":"walk","mixM":470,"note":"Gemessen ab ungefährer Bahnhofslage, rechnet mit 500 bis 700 m","min":6},{"from":"Schloss","to":"Grand Canal (Bassin d'Apollon)","m":1085,"rec":"walk","mixM":1085,"min":14},{"from":"Bassin d'Apollon","to":"Grand Trianon","m":1352,"rec":"walk","mixM":1352,"min":18},{"from":"Grand Trianon","to":"Schloss (zurück)","m":2281,"rec":"walk","mixM":2281,"note":"Direkter Rückweg durch den Park","min":30}]},{"id":"p6","badge":{"label":"6","kind":"day","bg":"#0B7A55","fg":"#FFFFFF","sym":"🛍️"},"tag":"Paris, Tag 6","date":"2026-10-17","short":"Sa 17.10.","name":"Marais und Passagen","title":"Samstag: Marais, Place des Vosges und gedeckte Passagen","line":{"label":"11","kind":"metro","bg":"#8D5E2A","fg":"#FFFFFF","caption":"Metro-Linien 1 und 11, Hôtel de Ville"},"lead":"Ein entspannter letzter Tag mit Altstadtgassen, Spielplatz und Einkaufsbummel. Alternativ ein Ausflug nach Giverny.","leave":"10:30","sunset":"18:56","stops":[{"t":"11:15","name":"Place des Vosges (mit Maison de Victor Hugo)","q":"Place des Vosges Paris","mode":"Metro 12 + 1 (Saint-Paul)","hook":"Welcher Platz ist der älteste regelmäßige von Paris?","info":"Die Place des Vosges entstand Anfang des 17. Jahrhunderts als „Place Royale“ unter Heinrich IV. Rundherum stehen Arkaden mit Backsteinhäusern. Hier wohnte Victor Hugo, sein Haus ist ein Museum. Der Park in der Mitte ist ein guter Platz für eine Pause.","tip":"Im Marais sind viele Läden am Samstag geöffnet.","deep":{"lage":"Marais, 4. Arrondissement","history":["Der Platz liegt auf dem Gelände des königlichen Hôtel des Tournelles, einer 1388 vom Kanzler Pierre d’Orgemont errichteten Residenz. Heinrich II. (1519–1559, Haus Valois) wurde am 30. Juni 1559 bei einem Turnier in der Nähe tödlich verletzt und starb am 10. Juli. Seine Witwe Katharina von Medici ließ den Besitz parzellieren (Letters patent vom 28. Januar 1564); das Herrenhaus wurde später abgerissen.","Heinrich IV. (1553–1610), der erste Bourbone auf dem französischen Thron, richtete 1603 hier eine Seiden- und Textilmanufaktur ein, um die vom Bürgerkrieg geschwächte Wirtschaft zu beleben. Ein Edikt vom Juli 1605 schuf daneben die „place royalle“ für Handwerker, als Promenade und für Hoffeste. Die Pavillons entstanden ab 1605; die Arbeiterhäuser wurden 1607 abgerissen. Der Architekt ist unbekannt. Nach der Ermordung des Königs 1610 wurde der Platz 1612 mit einem Karussell unter Antoine de Pluvinel eingeweiht,
