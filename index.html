<script>
var DATA = {"START":"Place des Abbesses, Paris","days":[{"id":"v0","badge":{"label":"An","kind":"travel","bg":"#3F51B5","fg":"#FFFFFF","sym":"🌙"},"tag":"Anreise","date":"2026-10-10","short":"Sa 10.10.","name":"Anreise nach Verdun","title":"Samstagabend in Verdun","line":{"label":"A4","kind":"road","caption":"Autobahn"},"lead":"Ankommen, Abendessen und ein kurzer Spaziergang an der Maas. Mehr nicht, morgen wird es ein langer Tag.","sunset":"18:58","stops":[{"t":"ab 18:00","name":"Spaziergang Porte Chaussée und Maas-Ufer","q":"Porte Chaussee Verdun","mode":"zu Fuß","hook":"Welches Tor hat Verdun seit dem Mittelalter bewacht?","info":"Die Porte Chaussée ist ein Stadttor aus dem 14. Jahrhundert und liegt direkt an der Maas (Meuse). Verdun war über Jahrhunderte eine Grenz- und Festungsstadt. Im Vertrag von Verdun (843) teilten die Enkel Karls des Großen das Frankenreich unter sich auf. Das gilt als Vorstufe der Entstehung von Frankreich und Deutschland.","tip":"Bei Dämmerung ist das Ufer ruhig und schön. Sonnenuntergang gegen 18:58 Uhr.","deep":{"lage":"Verdun-sur-Meuse (Département Meuse, Lothringen), Altstadt am Maas-Ufer unterhalb der Oberstadt","history":["Verdun (lat. Virodunum) liegt an der Maas (Meuse) und ist seit dem 4. Jahrhundert Bischofssitz; der erste historisch sicher belegte Bischof ist Polychronius im 5. Jahrhundert, die Überlieferung nennt davor Saintin. Der Vertrag von 843 teilte das Frankenreich unter den Enkeln Karls des Großen. 925 kam Lothringen an das ostfränkische Reich, Verdun gehörte damit zum späteren Heiligen Römischen Reich.","Die Porte Chaussée gehört zum Grand Rempart, der im späten 14. Jahrhundert entstand, als Verdun 1374 freie Reichsstadt wurde und seine Verteidigung selbst finanzieren musste. Nach dem Tourismusbüro stiftete sie der wohlhabende Schöffe Wautrec; Structurae nennt ihn Jean Wautrec, Tuchhändler, und datiert das Tor auf 1380. Zwei Rundtürme von etwa 20 m Höhe mit 1,75 m dicken Mauern flankieren die Durchfahrt. Die Quellen weichen im Baujahr leicht ab, belastbar ist nur: Ende des 14. Jahrhunderts, bürgerlich finanziert.","1552 besetzte Heinrich II. die Stadt im Zug des „Voyage d'Austrasie“; zusammen mit Metz und Toul bildete Verdun die Trois-Évêchés, die 1648 im Westfälischen Frieden Frankreich zugesprochen wurden. Zwischen 1624 und 1636 entstand auf dem Gelände der Abtei Saint-Vanne die Zitadelle; ab 1664 plante Vauban eine neue bastionierte Stadtmauer mit Überflutungsanlagen, die wegen der Kosten des Pfälzischen Erbfolgekriegs nicht vollendet wurde.","Nach 1871 rückte die Stadt an die Grenze. Raymond Séré de Rivières (1815–1895) erhielt 1874 den Auftrag für ein System von Sperrforts; um Verdun entstand ein äußerer Gürtel, zu dem später Douaumont gehörte. Die Garnison wuchs von 3.422 Mann (1876) auf rund 27.000 (1914). Unter der Zitadelle wurden 1886 bis 1893 etwa 4 km Galerien in den Fels getrieben, die 1916 als Unterkunft, Bäckerei und Lazarett dienten.","Die Zivilbevölkerung wurde am 23. Februar 1916 evakuiert; bei Beginn der Schlacht lebten 3.000 bis 4.000 Einwohner in der Stadt. Nach den Angaben des Mémorial waren 2.635 von 2.736 Gebäuden beschädigt. Die Stadtverwaltung kehrte im März 1919 zurück, 1921 fehlte noch Wohnraum. Hilfe kam aus dem Ausland: Luxemburg spendete 1 Million Franc, ein Londoner Komitee rund 1,13 Millionen."],"terms":[{"fr":"Trois-Évêchés","de":"Drei Bistümer (Metz, Toul, Verdun)","ety":"évêché geht über lat. episcopatus auf griech. epískopos zurück, wörtlich „Aufseher“."},{"fr":"Chaussée","de":"Dammweg, befestigte Straße","ety":"Vom spätlat. (via) calciata, „mit Kalkstein befestigter Weg“, zu lat. calx, „Kalk, Stein“."}],"kids":["Die beiden Rundtürme der Porte Chaussée sind rund 20 m hoch und haben 1,75 m dicke Mauern.","Unter der Zitadelle von Verdun liegen etwa 4 km Tunnel, die 1916 eine kleine Stadt mit Bäckerei und Lazarett beherbergten.","Als die Schlacht im Februar 1916 begann, mussten alle Zivilisten Verdun innerhalb von zwei Tagen verlassen.","1914 lagen in Verdun ungefähr 27.000 Soldaten, mehr als siebenmal so viele wie 1876."],"quiz":[{"q":"Wie hießen die drei Bistümer, die 1552 an Frankreich kamen?","a":"Metz, Toul und Verdun (Trois-Évêchés)."},{"q":"Wie lang sind die Galerien unter der Zitadelle ungefähr?","a":"Etwa 4 km."},{"q":"Von 2.736 Gebäuden der Stadt waren nach dem Krieg wie viele beschädigt?","a":"2.635."}],"sources":[{"title":"Office de Tourisme de Verdun: Porte Chaussée","url":"https://en.tourisme-verdun.com/decouverte/post/porte-chaussee-auch-chaussee-turm-genannt"},{"title":"Structurae: Porte Chaussée","url":"https://structurae.net/fr/ouvrages/porte-chaussee"},{"title":"Mémorial de Verdun: La reconstruction à Verdun et dans la Somme (PDF)","url":"https://memorial-verdun.fr/files/6a80fff1/20230710_4la_reconstruction_a_verdun_et_dans_la_sommebdef.pdf"},{"title":"Musée de l'Armée: L'hyperbataille de Verdun, 21e épisode, Verdun ville martyre","url":"https://actualites.musee-armee.fr/expositions-en/lhyperbataille-de-verdun-vingt-et-unieme-episode-verdun-ville-martyre-2/?lang=en"},{"title":"Sites Vauban: Verdun, Zitadelle","url":"https://sites-vauban.org/en/node/7813"}]}},{"t":"abends","name":"Abendessen in der Altstadt","q":"Verdun centre ville restaurants","mode":"zu Fuß","optional":true,"hook":"Und was ist eigentlich eine „Dragée de Verdun“?","info":"Verdun ist seit Jahrhunderten für seine Dragées bekannt, mit Zucker überzogene Mandeln. Sie wurden früher zu Taufen verschenkt. Eine Packung eignet sich als kleines Mitbringsel.","tip":"Restaurant am besten heute schon auswählen, am Samstagabend sind die Plätze begrenzt."}],"kids":"Wer findet die Porte Chaussée zuerst auf dem Handy-Stadtplan?","fallback":"früh essen und zeitig schlafen. Morgen geht es um 9:30 Uhr los.","legs":[]},{"id":"v1","badge":{"label":"An","kind":"travel","bg":"#5F7A25","fg":"#FFFFFF","sym":"🪖"},"tag":"Anreise","date":"2026-10-11","short":"So 11.10.","name":"Verdun – Schlachtfeld","title":"Sonntagvormittag: Verdun und der Erste Weltkrieg","line":{"label":"A4","kind":"road","caption":"Auto, ca. 3,5 Std. nach Paris"},"lead":"Drei Orte in einer Reihe: Mémorial, Beinhaus und Fort Douaumont. Alle liegen nur wenige Kilometer auseinander, nordöstlich von Verdun.","sunset":"18:56","stops":[{"t":"08:45","name":"Auschecken und Abfahrt","q":"Memorial de Verdun Fleury-devant-Douaumont","mode":"Auto","hook":"Gepäck ins Auto, dann geht es auf das Schlachtfeld.","info":"Das Gepäck bleibt im Auto, ihr kommt später nicht mehr in die Stadt zurück. Die Fahrt zum Mémorial dauert etwa 15 Minuten.","tip":"Jacken mitnehmen. Im Fort ist es das ganze Jahr kühl und feucht."},{"t":"09:30","name":"Mémorial de Verdun (Museum)","q":"Memorial de Verdun Fleury-devant-Douaumont","mode":"Auto","hook":"Warum steht ein Museum mitten im Wald auf einem Dorf, das es nicht mehr gibt?","info":"Das Museum steht in Fleury-devant-Douaumont. Das Dorf wurde 1916 zerstört und nie wieder aufgebaut, es ist eines von neun „verschwundenen“ Dörfern bei Verdun. Die Ausstellung zeigt die Schlacht aus französischer und deutscher Sicht mit Uniformen, Waffen, Fotos und Alltagsgegenständen der Soldaten.","tip":"Mit Kindern genügt eine Stunde bis 75 Minuten. Zeigt ihnen vor allem die Alltagsgegenstände. Täglich geöffnet 9:30–17:30, letzter Einlass 16:45.","cost":"Erw. 14 €, Kind (8–18 J.) 9 €. Kombiticket mit Fort: 19 € / 14 €. Familienkarte (2 Erw. + 1 Kind) 50 €, weiteres Kind 14 €.","deep":{"lage":"Fleury-devant-Douaumont, nordöstlich von Verdun (Gedenkstätten 5 bis 10 km von der Stadt)","history":["Am 21. Februar 1916 griff die 5. Armee unter Kronprinz Wilhelm (1882–1951, Hohenzollern) nach schwerer Artillerievorbereitung auf dem rechten Maasufer an. Zu den Motiven gilt Falkenhayns „Ausblutungsthese“ lange als Erklärung; Gerd Krumeich hält die Weihnachtsdenkschrift für eine nachträgliche Konstruktion und betont die operative Bedrohung durch die Festung. Ende Februar übernahm Philippe Pétain (1856–1951) die Verteidigung und ließ den Nachschub über die Voie Sacrée von Bar-le-Duc leiten.","Der Verlauf: Ab März wurde auch das linke Ufer angegriffen (Mort-Homme, Cote 304), im Juni fiel Fort Vaux, im Juli blieben die Angriffe etwa 3 km vor Verdun an der Höhe von Souville stecken. Am 24. Oktober nahmen französische Truppen Douaumont zurück, am 2. November Vaux, am 15. Dezember weitere Stellungen; als Ende nennen Quellen Mitte bis 18. Dezember. Das Mémorial beziffert die Toten und Vermissten auf 306.000 (143.000 deutsche, 163.000 französische) und die Gesamtverluste auf rund 712.000; Larousse nennt rund 362.000 französische und 336.000 deutsche Gefallene und Verwundete (zusammen etwa 698.000). Die Zahlen sind gerundet und je nach Zählweise verschieden. Nach Angaben der französischen Tourismusagentur fielen rund 60 Millionen Granaten.","Fleury-devant-Douaumont hatte 1913 noch 422 Einwohner, die von Getreideanbau und Holzverarbeitung lebten. Das Dorf wechselte im Frühsommer 1916 binnen zwei Monaten 16 Mal den Besitzer; am 17./18. August 1916 nahm es ein marokkanisches Kolonialregiment endgültig. Von den neun Gemeinden, die der Staat danach als nicht wiederaufbaubar einstufte, blieben sechs unbewohnt, darunter Fleury. Der Wiederaufbau hätte mehr gekostet, als die Grundstücke 1914 wert waren; hinzu kam die Munitionsbelastung der „Zone rouge“.","Rechtlich blieben die Orte bestehen: Ein Gesetz vom 18. Oktober 1919 erhielt die zerstörten Gemeinden, eine vom Präfekten ernannte dreiköpfige Kommission führt ihre Geschäfte. Der Staat erwarb das Land und pflanzte bis 1932 36 Millionen Bäume. Die Bezeichnung „Mort pour la France“, seit 1915 offizielle Würdigung für Gefallene, wird auf diese Dörfer übertragen.","Das Museum geht auf Veteranen zurück: Maurice Genevoix leitete das Comité national du souvenir de Verdun, das den Bau 1959 beschloss; Eröffnung war am 17. September 1967. Nach Umbau (2013–2016, plus 1.900 m²) zeigt es etwa 2.000 Objekte aus französischer und deutscher Sicht."],"terms":[{"fr":"Mort pour la France","de":"Für Frankreich gefallen","ety":"Offizielle Rechtsbezeichnung aus einem Gesetz vom 2. Juli 1915; sie begründet u. a. Anspruch auf Eintrag in das Gefallenendenkmal der Heimatgemeinde."},{"fr":"Zone rouge","de":"Rote Zone","ety":"Nach 1918 amtlich so benannte Gebiete mit schwersten Zerstörungen und Kampfmitteln, in denen Wohnen und Landwirtschaft zunächst untersagt waren."}],"kids":["Das Dorf Fleury wechselte im Sommer 1916 innerhalb von zwei Monaten 16 Mal zwischen Deutschen und Franzosen.","Auf dem Schlachtfeld wurden rund 60 Millionen Granaten verschossen, im Schnitt rund 6 Millionen pro Monat.","Der Staat pflanzte bis 1932 auf dem Schlachtfeld 36 Millionen Bäume.","Fleury hat heute einen Bürgermeister, aber nur etwa vier Einwohner."],"quiz":[{"q":"An welchem Datum begann die Schlacht von Verdun?","a":"21. Februar 1916."},{"q":"Wie oft wechselte Fleury-devant-Douaumont 1916 den Besitzer?","a":"16 Mal."},{"q":"Wie viele Dörfer wurden als nicht wiederaufbaubar eingestuft, und wie viele davon blieben unbewohnt?","a":"Neun Dörfer, sechs davon blieben unbewohnt."}],"sources":[{"title":"Mémorial de Verdun: Le bilan des batailles de Verdun et de la Somme (PDF)","url":"https://memorial-verdun.fr/files/6a80fff1/le_bilan_des_batailles_de_verdun_et_de_la_somme.pdf"},{"title":"Mémorial de Verdun: Historique du Mémorial","url":"https://memorial-verdun.fr/en/ressources/ressources-historiques/historique-du-memorial"},{"title":"Office de Tourisme de Verdun: Le village détruit de Fleury-devant-Douaumont","url":"https://tourisme-verdun.com/verdun-en/activite-en-groupe-scolaire/post/V|FLEURY"},{"title":"Mémorial de Verdun: La reconstruction à Verdun et dans la Somme (PDF)","url":"https://memorial-verdun.fr/files/6a80fff1/20230710_4la_reconstruction_a_verdun_et_dans_la_sommebdef.pdf"},{"title":"Larousse: Bataille de Verdun (février-décembre 1916)","url":"https://www.larousse.fr/encyclopedie/divers/bataille_de_Verdun/148592"},{"title":"Antoine Prost / Gerd Krumeich: Verdun 1916. Die Schlacht und ihr Mythos aus deutsch-französischer Sicht, Klartext, Essen 2016"}]}},{"t":"10:55","name":"Ossuaire de Douaumont (Beinhaus)","q":"Ossuaire de Douaumont","mode":"Auto","hook":"Was liegt hinter diesen kleinen Fenstern in der Mauer?","info":"Das Beinhaus (lat. ossuarium, von os, „Knochen“) enthält die Gebeine von etwa 130.000 französischen und deutschen Soldaten, die nach dem Krieg auf dem Schlachtfeld gefunden wurden und nicht mehr zu identifizieren waren. Davor liegt ein Friedhof mit über 16.000 Gräbern. Im Haus läuft ein Film über die Schlacht (Sitzplätze für 120 Personen).","tip":"Sonntag geöffnet 10:00–17:30. Gut 40 Minuten einplanen, ruhiges Verhalten ist angebracht.","cost":"Erw. 7 €, Kind 3 €, unter 8 Jahren frei.","deep":{"lage":"Douaumont, nordöstlich von Verdun, auf dem Schlachtfeld rechts der Maas","history":["Charles Ginisty (1864–1946), seit 1914 Bischof von Verdun, regte das Beinhaus am 11. Februar 1919 bei einer Gedenkveranstaltung in Paris an. Ein 1919 gegründetes Komitee finanzierte den Bau über Spenden und Vortragsreisen im In- und Ausland, die Initiative war privat und ging einer staatlichen Beteiligung voraus. Die Grundsteinlegung nahm 1920 Marschall Pétain vor, der Ehrenpräsident des Komitees war. Den Architekturwettbewerb von 1923 gewannen Léon Azéma, Max Edrei und Jacques Hardy. 1932 weihte Präsident Albert Lebrun das Gebäude ein.","Der Bau ist etwa 130 bis 137 m lang (Quellen verschieden). Ein Kreuzgang enthält 46 Grabnischen, je eine für einen Abschnitt des Schlachtfelds zwischen Avocourt und Les Éparges. Dahinter steht der 46 m hohe Turm mit einem Leuchtfeuer und einer zwei Tonnen schweren Glocke. Die Deutung schwankt: Schwert im Boden, Granate, Anspielung auf Festungsbau. Die Gebeine von etwa 130.000 französischen und deutschen Soldaten sind nicht mehr zuzuordnen; eine Quelle nennt 146.000, die Zahl ist eine Schätzung.","Die Nationalnekropole davor wurde ab 1923 angelegt und bis 1936 ausgebaut, eingeweiht am 23. Juni 1929 unter Präsident Doumergue. Es gab hier keinen Frontfriedhof. Der Staat verlegte Gräber aus kleineren Friedhöfen hierher und bestattete Funde aus der Zone rouge, zeitweise bis zu 500 im Monat. Heute liegen hier über 16.000 Gefallene in Einzelgräbern, darunter 592 Muslime. Ein jüdisches Denkmal entstand 1938, ein muslimisches 2006.","Gedenkpolitisch war der Ort lange national-französisch und an Pétain gebunden, der seit 1951 mit einer jährlichen Messe geehrt wurde. 1966 verweigerten die Behörden einer deutschen Delegation die Teilnahme an den Feiern. Ein Wandel setzte in den 1980ern ein. Am 22. September 1984, dem Anlass des Kriegsbeginns vor 70 Jahren, standen Staatspräsident François Mitterrand und Bundeskanzler Helmut Kohl Hand in Hand vor dem Beinhaus. Es war das erste Mal, dass beide Staatschefs dort zusammentrafen; bei den Feiern zum D-Day im selben Jahr waren Deutsche nicht eingeladen gewesen. Nach 2014 stiegen die Besucherzahlen auf fast 400.000 pro Jahr."],"terms":[{"fr":"Ossuaire","de":"Beinhaus","ety":"Von lat. ossuarium, „Behältnis für Gebeine“, zu os, ossis, „Knochen“."},{"fr":"Nécropole nationale","de":"Staatlicher Soldatenfriedhof","ety":"Von griech. nekrópolis, „Totenstadt“ (nekrós, „tot“, pólis, „Stadt“); in Frankreich Bezeichnung für Kriegsgräberstätten in staatlicher Obhut."}],"kids":["Der Turm des Beinhauses ist 46 m hoch, und der Kreuzgang enthält 46 Gräber.","Im Beinhaus liegen die Gebeine von etwa 130.000 Soldaten, französische und deutsche gemischt.","Auf dem Friedhof davor gibt es über 16.000 einzelne Gräber, 592 davon für muslimische Soldaten.","Die Glocke im Turm wiegt rund zwei Tonnen."],"quiz":[{"q":"Welcher Bischof war die treibende Kraft hinter dem Bau?","a":"Charles Ginisty, Bischof von Verdun."},{"q":"Welche beiden Staatsmänner reichten sich 1984 vor dem Beinhaus die Hand?","a":"François Mitterrand und Helmut Kohl."},{"q":"Wofür steht die Zahl der 46 Gräber im Kreuzgang?","a":"Für 46 Abschnitte des Schlachtfelds, von Avocourt bis Les Éparges."}],"sources":[{"title":"Ministère des Armées, Chemins de mémoire: Nécropole nationale et ossuaire de Fleury-devant-Douaumont","url":"https://www.defense.gouv.fr/chemins-memoire/tourisme-memoire/lieux-memoire/10-hauts-lieux-memoire-nationale/necropole-fleury-devant-douaumont"},{"title":"INA, Panorama Grand Est: L'ossuaire de Douaumont et la mémoire de la bataille de Verdun","url":"https://fresques.ina.fr/panorama-grand-est/fiche-media/GRDEST00016/l-ossuaire-de-douaumont-et-la-memoire-de-la-bataille-de-verdun.html"},{"title":"Geneawiki: Charles Ginisty","url":"https://fr.geneawiki.com/wiki/Charles_GINISTY"},{"title":"Europäische Union: Helmut Kohl und François Mitterrand","url":"https://european-union.europa.eu/principles-countries-history/history-eu/eu-pioneers/helmut-kohl-and-francois-mitterrand_fr"},{"title":"Office de Tourisme de Verdun: Ossuaire de Douaumont","url":"https://en.tourisme-verdun.com/decouverte/post/ossuary-of-douaumont"}]}},{"t":"11:45","name":"Fort de Douaumont","q":"Fort de Douaumont","mode":"Auto","hook":"Wie nahm eine kleine Gruppe die stärkste Festung Frankreichs ein?","info":"Das Fort war 1916 die größte und stärkste Festung der Verdun-Sperre. Am 25. Februar 1916 wurde es von deutschen Truppen fast kampflos besetzt, am 24. Oktober 1916 holten es die Franzosen zurück. Ihr lauft durch Gänge, Kasematten und über das Dach mit Blick auf die Trichterlandschaft. Im Mai 1916 starben bei einer Explosion hunderte deutsche Soldaten.","tip":"Rechnet mit 75–90 Minuten. Geöffnet 9:30–17:30, letzter Einlass 17:00. Bequeme Schuhe, die Gänge sind teils uneben.","cost":"Erw. 8 €, Kind 6,50 € (ein Kombiticket mit dem Mémorial ist günstiger).","deep":{"lage":"Douaumont, nordöstlich von Verdun, oberhalb des Ossuaire","history":["Das Fort gehört zum System, das nach der Niederlage von 1871 unter General Raymond Séré de Rivières (1815–1895) entstand. Séré de Rivières entschied 1873 für den Standort auf der 388 m hohen Anhöhe, gebaut wurde ab etwa 1884. Mit knapp 9 Hektar war es das größte Fort des Verdun-Gürtels, ursprünglich für 800 Mann. Die neuen Sprenggranaten machten die gemauerten Gewölbe bald unsicher; ab 1888 deckte man die Kasernen mit Beton ab (2,5 m im Westen, 1,5 m im Osten), zwischen 1903 und 1913 kamen Panzertürme und Beobachtungskuppeln hinzu. Die Kosten lagen bei über 6 Millionen Goldfranc.","Im Februar 1916 galten die Forts als überholt. Douaumont war nur von einer Wartungsmannschaft von 56 Territorialartilleristen unter Feldwebel Chenot besetzt, Teile der Bewaffnung waren abgezogen. Am 25. Februar drang ein Pionierfeldwebel mit seinem Trupp durch eine Bresche ein, in den folgenden Stunden folgten Leutnant Radtke, Hauptmann Haupt und Oberleutnant Cordt von Brandis vom Brandenburgischen Infanterieregiment 24. Es fiel kein Schuss. Brandis meldete den Fall zuerst und erhielt den Pour le Mérite; wem die Ehre gebührt, ist bis heute Gegenstand von Kritik.","Am 8. Mai 1916 brach im Fort ein Feuer aus, das Handgranaten, Flammenwerferbrennstoff und Munition erfasste. Die Zahl der Toten wird unterschiedlich angegeben: 679 deutsche Soldaten (häufig genannt), das Mémorial spricht von 800 bis 1.000. Die Toten wurden in einer Kasematte eingemauert, die bis heute deutsche Kriegsgräberstätte ist. Der französische Gegenangriff am 22. bis 24. Mai scheiterte.","Die Rückeroberung am 24. Oktober 1916 bereiteten schwere Eisenbahngeschütze (zwei 400-mm-Geschütze) tagelang vor; das Fort war bereits teilweise geräumt. Drei Divisionen griffen an, den Sturm trug das Régiment d'infanterie coloniale du Maroc. General François Anselin fiel an diesem Tag durch einen Granatsplitter und liegt heute am Fuß der Ehrentreppe der Nationalnekropole. Das Fort blieb bis zum Kriegsende in französischer Hand."],"terms":[{"fr":"Pour le Mérite","de":"Für das Verdienst","ety":"Preußischer Orden, 1740 von Friedrich II. gestiftet; der französische Name geht auf die Hofsprache der Zeit zurück."}],"kids":["Das Fort liegt auf einer 388 m hohen Anhöhe und bedeckt knapp 9 Hektar, es war das größte von Verdun.","Am 25. Februar 1916 fiel es ohne einen Schuss; die einzige Verletzung war angeblich ein aufgeschürftes Knie.","Im Fort waren damals nur 56 Soldaten statt der möglichen 800.","Vor dem Sturm im Oktober beschossen zwei 400-mm-Eisenbahngeschütze das Fort tagelang."],"quiz":[{"q":"An welchem Tag wurde das Fort 1916 von deutschen Truppen eingenommen?","a":"Am 25. Februar 1916."},{"q":"Wie viele Franzosen verteidigten das Fort bei der Einnahme?","a":"56 Mann Wartungsmannschaft."},{"q":"In welchem Jahr und Monat ereignete sich die Explosion im Fort?","a":"Im Mai 1916 (8. Mai), nicht erst 1917."}],"sources":[{"title":"Mémorial de Verdun: Visiter le fort de Douaumont","url":"https://memorial-verdun.fr/en/memorial-et-forts/visiter-le-fort-de-douaumont"},{"title":"Subterranea Britannica: Fort Douaumont","url":"https://www.subbrit.org.uk/sites/fort-douaumont/"},{"title":"German1914: Cordt von Brandis, Hero of Douaumont?","url":"https://german1914.com/?p=1788"},{"title":"Larousse: Bataille de Verdun (février-décembre 1916)","url":"https://www.larousse.fr/encyclopedie/divers/bataille_de_Verdun/148592"},{"title":"Ministère des Armées, Chemins de mémoire: Nécropole nationale de Fleury-devant-Douaumont","url":"https://www.defense.gouv.fr/chemins-memoire/tourisme-memoire/lieux-memoire/10-hauts-lieux-memoire-nationale/necropole-fleury-devant-douaumont"}]}},{"t":"13:15","name":"Abfahrt nach Paris","q":"Paris Montmartre","mode":"Auto","hook":"Lunchpaket unterwegs, Ankunft zwischen 16:30 und 17:30 Uhr.","info":"Rund 3,5 Stunden Fahrt plus Pause. Ein Mittagessen im Auto oder an einer Raststätte spart Zeit. Alternativ esst ihr in Verdun (siehe Plan B).","tip":"Eine Pause einplanen. Crit'Air-Plakette für Paris ist vorhanden."}],"kids":"Jeder sucht einen Gegenstand im Mémorial, der ihn überrascht, und erzählt abends warum.","fallbackLabel":"Alternative (entspannter, Abfahrt ca. 13:00)","fallback":"Fort Douaumont um 9:30, Beinhaus um 11:15, danach Mittagessen in Verdun. Das Mémorial entfällt dann.","legs":[]},{"id":"p0","badge":{"label":"An","kind":"travel","bg":"#D6336C","fg":"#FFFFFF","sym":"🌇"},"tag":"Ankunft in Paris","date":"2026-10-11","short":"So 11.10.","name":"Ankunft Montmartre","title":"Sonntagabend: Sacré-Cœur, Abbesses und Moulin Rouge","line":{"label":"12","kind":"metro","bg":"#00814F","fg":"#FFFFFF","caption":"Metro-Linie 12, Station Abbesses"},"lead":"Kein Programm mit Eintritt, nur ein Spaziergang von ca. 3 km in der Abenddämmerung. Sonnenuntergang um 19:08 Uhr.","sunset":"19:08","stops":[{"t":"ab 17:45","name":"Place des Abbesses und „Mur des je t'aime“","q":"Mur des je t'aime Paris","mode":"zu Fuß","hook":"Wo steht „Ich liebe dich“ in 250 Sprachen an einer Wand?","info":"Die Wand im kleinen Park Square Jehan-Rictus besteht aus blauen Emailkacheln, auf denen der Satz in vielen Sprachen steht. Gleich daneben liegt der Metro-Eingang Abbesses mit Jugendstil-Dach von Hector Guimard. Das ist einer der wenigen erhaltenen Originale.","tip":"Findet auf der Wand ihr Deutsch, Englisch und eine Sprache, die keiner kennt.","deep":{"lage":"Montmartre, 18. Arrondissement","history":["Ludwig VI. (1081–1137), Kapetinger, gründete 1133/34 auf Drängen seiner Frau Adelheid von Savoyen auf dem Hügel eine königliche Benediktinerinnenabtei; die Gründungsurkunde nennt den Hügel „Mont des Martyrs“. Rund 46 Äbtissinnen leiteten sie, nach ihnen heißen Platz und Metrostation. 1686 zog die Abtei in neue Gebäude am Hang. 1790 wurde sie aufgehoben, 1794 der Besitz verkauft, die letzte Äbtissin, Marie-Louise de Montmorency-Laval, wurde guillotiniert. Die Käufer brachen Steine aus und bebauten das Gelände; erhalten ist nur die Kirche Saint-Pierre.","Bis ins 19. Jahrhundert war Montmartre eine eigene Gemeinde vor den Toren der Stadt, mit Weinbergen, Gipsbrüchen und Mühlen. Die Pariser Zollmauer, der Mur des Fermiers généraux, markierte die Grenze der städtischen Verbrauchssteuer (octroi); hinter ihr entstanden Wirtshäuser und Tanzlokale. 1856 zählte Montmartre 36.450 Einwohner.","Das Gesetz vom 16. Juni 1859 verschob die Stadtgrenze mit Wirkung zum 1. Januar 1860 vom Mur des Fermiers généraux zur Thiers-Befestigung. Elf Vororte, darunter Montmartre, Belleville und Passy, wurden eingemeindet; Paris wuchs von 12 auf 20 Arrondissements, die Fläche etwa von 3.300 auf 7.000 Hektar, die Bevölkerung von rund einer Million auf rund 1,7 Millionen. Die Befragung der Bewohner brachte etwa 1.260 Stellungnahmen, die Maßnahme war umstritten. Montmartre kam überwiegend zum 18. Arrondissement.","Der Metro-Eingang stammt von Hector Guimard (1867–1942), dem Hauptvertreter des Pariser Jugendstils. Er stand ursprünglich an der Station Hôtel de Ville und wurde 1974 wegen einer Tiefgarage nach Abbesses versetzt; nach dem Cercle Guimard ist er das einzige erhaltene Exemplar dieses Modells. Er steht seit 1965 im Zusatzinventar der Monuments historiques. Die Nord-Sud-Gesellschaft beauftragte Guimard nie, daher ist er hier ein Fremdkörper. Der Bahnsteig liegt 36 m tief.","Die Mur des je t'aime wurde im Herbst 2000 eingeweiht. Frédéric Baron konzipierte sie, Claire Kito stellte die Schriftzüge zusammen, Daniel Boulogne baute sie ab 1998. Sie besteht aus 612 Kacheln aus emaillierter Lava und zeigt 311 Schreibweisen in 250 Sprachen; rote Splitter stehen für die Teile eines zerbrochenen Herzens."],"terms":[{"fr":"Octroi","de":"Städtische Verbrauchssteuer auf eingeführte Waren","ety":"Von octroyer, „gewähren“, aus mlat. auctorizare, zu lat. auctor, „Urheber, Bürge“."},{"fr":"Abbesse","de":"Äbtissin","ety":"Von spätlat. abbatissa, weibliche Form zu abbas („Abt“), das über aramäisch abba auf „Vater“ zurückgeht."}],"kids":["Die Metrostation Abbesses liegt 36 m unter der Erde, tiefer als jede andere Station innerhalb der Pariser Stadtgrenze.","Die Wand besteht aus 612 Kacheln und zeigt 311 Mal „Ich liebe dich“ in 250 Sprachen.","Der Metro-Eingang stand früher an einer ganz anderen Station, dem Hôtel de Ville, und wurde 1974 hierher versetzt.","Bis 1860 gehörte Montmartre nicht zu Paris, sondern war ein eigenes Dorf mit Weinbergen und Mühlen."],"quiz":[{"q":"Wie viele Sprachen sind an der Mur des je t'aime vertreten?","a":"250 Sprachen (mit 311 Schreibweisen)."},{"q":"Wann wurde Montmartre nach Paris eingemeindet?","a":"Zum 1. Januar 1860."},{"q":"Von welcher anderen Metrostation wurde der Guimard-Eingang nach Abbesses versetzt?","a":"Von Hôtel de Ville."}],"sources":[{"title":"Le Cercle Guimard: Édicule Guimard de la station Abbesses","url":"https://www.lecercleguimard.fr/?p=7376"},{"title":"Batiweb: Les 20 arrondissements parisiens fêtent leurs 150 ans","url":"https://www.batiweb.com/actualites/vie-pratique/les-20-arrondissements-parisiens-fetent-leurs-150-ans-16641"},{"title":"Fondation Napoléon: Faire le Grand Paris. Avis des habitants consultés en 1859","url":"https://www.napoleon.org/fr/magazine/vient_de_paraitre/files/481649.asp"},{"title":"Wikipedia (fr): Abbaye de Montmartre und Montmartre, als Orientierung","url":"https://fr.wikipedia.org/wiki/Abbaye_de_Montmartre"},{"title":"Wikipedia (fr): Mur des je t'aime, als Orientierung","url":"https://fr.wikipedia.org/wiki/Mur_des_je_t%27aime"}]}},{"t":"18:15","name":"Sacré-Cœur, Treppe und Aussicht","q":"Basilique du Sacre-Coeur Paris","mode":"zu Fuß","hook":"Warum bleibt diese Kirche so weiß, obwohl sie bald 150 Jahre alt ist?","info":"Die Basilika wurde ab 1875 gebaut und 1919 geweiht. Der Stein enthält Kalk, der bei Regen weiß nachzieht. Von der Treppe habt ihr einen weiten Blick über Paris. Die Basilika ist täglich von 6:30 bis 22:30 Uhr kostenlos geöffnet, im Inneren sind keine Fotos erlaubt.","tip":"Am Sonntag ist das Montmartre-Weinfest (Fête des Vendanges) im Gange (7.–11.10., laut Veranstalter), es kann rund um den Place du Tertre voll sein.","cost":"Basilika: kostenlos.","deep":{"lage":"Butte Montmartre, 18. Arrondissement","history":["Die Basilika ist ein Produkt der Niederlage von 1870/71. Im Dezember 1870 formulierten die Laien Alexandre Legentil und Hubert Rohault de Fleury das „Vœu national“: ein Heiligtum für das Herz Jesu in Paris. Am 18. März 1871 begann auf dem Hügel der Aufstand der Commune, als Truppen die von der Nationalgarde per Spendensammlung beschafften Kanonen holen sollten; die Generäle Lecomte und Clément-Thomas wurden getötet. Die Commune dauerte 72 Tage und endete in der Semaine sanglante (21. bis 28. Mai 1871). Die Schätzungen der getöteten Communards reichen von 3.000 bis 5.000 im Kampf bis zu rund 20.000 insgesamt.","Die monarchistisch geprägte Nationalversammlung verabschiedete am 24. Juli 1873 das Gesetz, das den Bau für gemeinnützig erklärte (382 Ja-Stimmen). Die Kirche sollte ausschließlich aus Spenden finanziert und auf Dauer dem katholischen Kult gewidmet werden. Der Erzbischof wählte im Herbst 1872 den Montmartre statt Belleville. Kardinal Guibert legte am 16. Juni 1875 den Grundstein. Paul Abadie (1812–1884) setzte sich im Wettbewerb durch und entwarf einen romanisch-byzantinischen Bau; nach seinem Tod führten Daumet, Laisné, Rauline, Magne und Hulot das Werk weiter.","Die Krypta entstand ab 1878, die Basilika ab 1881; das Langhaus wurde 1891 eröffnet, 1895 kam die Glocke „Savoyarde“ (18.835 kg) auf den Hügel, die Fassade war 1914 fertig. Wegen des Krieges folgte die Weihe erst am 16. Oktober 1919. Der Stein stammt aus Château-Landon; er gibt bei Regen Kalzit ab und bleibt dadurch auffallend hell.","Politisch blieb der Bau umstritten. Die Basilika wird häufig als Sühne („expiation“) für die Verbrechen der Commune gedeutet, ein Verständnis, das vor allem Kritiker aus der politischen Linken ablehnen. In den 1990er-Jahren forderte Lionel Jospin, 2013 Ian Brossat Abriss oder Umwidmung. Auch die Unterschutzstellung als Monument historique ab 2020 war politisch umkämpft."],"terms":[{"fr":"Vœu national","de":"Nationalgelübde","ety":"Von lat. votum, „Gelübde, Versprechen an die Gottheit“."},{"fr":"Expiation","de":"Sühne","ety":"Von lat. expiatio, zu expiare, „durch Sühne reinigen“ (ex- + pius, „fromm, rein“)."}],"kids":["Die Kuppel ist 83 m hoch; 237 Stufen führen zu ihrer Galerie.","Die Glocke „Savoyarde“ wiegt 18.835 kg und hat gut 3 m Durchmesser.","Der Stein gibt bei Regen Kalzit ab und bleibt dadurch hell, statt zu verdunkeln.","Zwischen Grundsteinlegung 1875 und Weihe 1919 vergingen 44 Jahre."],"quiz":[{"q":"In welchem Jahr wurde die Basilika geweiht?","a":"1919 (16. Oktober)."},{"q":"Wie hieß der Architekt, der den Wettbewerb gewann?","a":"Paul Abadie."},{"q":"Warum bleibt der Stein der Basilika so hell?","a":"Er gibt bei Regen Kalzit ab, das ihn weiß hält."}],"sources":[{"title":"Wikipedia (fr): Basilique du Sacré-Cœur de Montmartre, Chronologie, als Orientierung","url":"https://fr.wikipedia.org/wiki/Basilique_du_Sacr%C3%A9-C%C5%93ur_de_Montmartre"},{"title":"Aleteia: Quel est le message de la basilique du Sacré-Cœur de Montmartre","url":"https://fr.aleteia.org/2020/12/01/quel-est-le-message-de-la-basilique-du-sacre-coeur-de-montmartre/"},{"title":"Ville de Paris: Les 150 ans de la Commune, la fin sanglante et les conséquences","url":"https://www.paris.fr/pages/les-150-ans-de-la-commune-la-fin-sanglante-et-les-consequences-5-5-17210"},{"title":"Wikipedia (fr): Commune de Paris (1871), als Orientierung","url":"https://fr.wikipedia.org/wiki/Commune_de_Paris_(1871)"},{"title":"Wikipedia (en): Sacré-Cœur, Paris, als Orientierung (Stein, Wettbewerb, Clemenceau)","url":"https://en.wikipedia.org/wiki/Sacr%C3%A9-C%C5%93ur,_Paris"}]}},{"t":"19:00","name":"Rue Lepic und Moulin de la Galette","q":"Moulin de la Galette Paris","mode":"zu Fuß","optional":true,"hook":"Welche Mühle hat Renoir berühmt gemalt?","info":"Auf dem Weg bergab kommt ihr an der Rue Lepic vorbei. Der Moulin de la Galette war ein Tanzlokal und wurde 1876 von Renoir gemalt. Das Bild hängt heute im Musée d'Orsay, wo ihr am Mittwoch sein werdet.","tip":"Die Straße ist abschüssig. Bergauf geht es mit dem Funiculaire oder zu Fuß.","deep":{"lage":"Montmartre, 18. Arrondissement","history":["Im 18. Jahrhundert standen auf dem Hügel und in seiner Umgebung mehr als 25 Mühlen, um 1860 waren es nur noch drei, alle im Besitz der Familie Debray. Die Debrays waren seit dem 16. Jahrhundert Müller der Benediktinerinnenabtei und erwarben den Blute-fin 1809 und den Radet 1812. Die Mühlen mahlten Getreide, bis in die 1870er-Jahre auch Alabaster für die Porzellanmanufaktur von Clignancourt. Das Alter der Mühlen ist unsicher: Für den Blute-fin ist 1622 belegt, die Familie behauptete 1295.","Wirtschaftlich prägender war der Gips. Die Brüche unter dem Hügel wurden seit gallorömischer Zeit ausgebeutet; in Öfen auf dem Berg wurde daraus der „plâtre de Paris“ gebrannt, der als Baustoff für die Stadt diente. Die ausgehöhlten Gänge führten zu Einstürzen: Der erste belegte fand 1785 auf der heutigen Rue Lepic statt, 1830 musste ein Tanzlokal wegen Bodensenkung schließen. Über das Leben der Arbeiter geben die abgerufenen Quellen wenig her; belegt sind Beschwerden der Nachbarn über Rauch, Staub und Funkenflug aus den Brennöfen.","Die Rue Lepic ist nach General Louis Lepic (1765–1827) benannt, der 1807 bei Eylau focht. Sie entstand nach der Überlieferung um 1809, weil der Weg zur Kirche Saint-Pierre für Napoleon, der den Chappe-Telegrafen sehen wollte, zu steil war. Der Name wechselte mehrfach; seit 1864 heißt sie Rue Lepic. Nr. 54 bewohnten Vincent und Theo van Gogh von 1886 bis 1888.","Aus den Mühlen wurde ein Vergnügungsort. Nach der Überlieferung wurde Vater Debray bei der Verteidigung von Paris am 30. März 1814 von russischen Soldaten getötet. 1833 richtete sein Sohn Nicolas-Charles Freiluftbälle aus, 1834 folgte ein Tanzsaal. Es gab Roggengalette mit Milch, später mit Wein. 1810 gab es in Montmartre 16 genehmigte Tanzlokale, die Kundschaft war zunächst volkstümlich, ab 1900 kam dienstags das Tout-Paris. Renoir malte 1876 den „Bal du moulin de la Galette“, auch Toulouse-Lautrec, Van Gogh und Picasso (1900) verkehrten dort. Seinen amtlichen Namen trägt das Lokal seit 1895; 1966 schloss der Saal."],"terms":[{"fr":"Plâtre de Paris","de":"Pariser Gips","ety":"Plâtre geht über altfrz. plastre auf lat. emplastrum und griech. émplastron, „aufgetragene Masse, Pflaster“, zurück."},{"fr":"Galette","de":"flacher, runder Kuchen","ety":"Wahrscheinlich von galet, „flacher Kiesel“, wegen der runden, flachen Form."}],"kids":["Auf dem Hügel gab es im 18. Jahrhundert mehr als 25 Windmühlen; der Blute-fin gilt als die einzige, die noch betriebsfähig ist.","Unter Montmartre liegen alte Gipsgruben; der erste dokumentierte Einsturz war 1785 in der Rue Lepic.","Renoir malte 1876 das berühmte Bild vom Tanz in der Mühle, es hängt im Musée d'Orsay.","Vincent van Gogh wohnte zwei Jahre (1886–1888) mit seinem Bruder in der Rue Lepic Nr. 54."],"quiz":[{"q":"Welcher Maler hielt 1876 den Tanz im Moulin de la Galette fest?","a":"Pierre-Auguste Renoir."},{"q":"Welcher Rohstoff wurde unter dem Hügel gebrochen?","a":"Gips (für den „plâtre de Paris“)."},{"q":"Nach welchem General ist die Rue Lepic benannt, und bei welcher Schlacht zeichnete er sich 1807 aus?","a":"Louis Lepic; Schlacht von Eylau."}],"sources":[{"title":"Wikipedia (fr): Moulin de la Galette, als Orientierung","url":"https://fr.wikipedia.org/wiki/Moulin_de_la_Galette"},{"title":"Wikipedia (fr): Rue Lepic, als Orientierung","url":"https://fr.wikipedia.org/wiki/Rue_Lepic"},{"title":"Wikipedia (fr): Carrières de Montmartre, als Orientierung","url":"https://fr.wikipedia.org/wiki/Carri%C3%A8res_de_Montmartre"},{"title":"Musée du Plâtre: Des fours à plâtre à Paris 1765–1800 (Thomas Le Roux, PDF)","url":"https://museeduplatre.fr/uploads/HzH7ZztW/DesfoursaplatreaParis1765-1800-MuseeduPlatreBD.pdf"},{"title":"Wikipedia (fr): Montmartre, als Orientierung","url":"https://fr.wikipedia.org/wiki/Montmartre"}]}},{"t":"19:30","name":"Moulin Rouge im Abendlicht","q":"Moulin Rouge Paris","mode":"zu Fuß","hook":"Warum hat diese Windmühle rote Flügel?","info":"Der Moulin Rouge eröffnete 1889 am Boulevard de Clichy und wurde zum berühmtesten Varieté von Paris. Nach Einbruch der Dunkelheit leuchten die roten Flügel. Das Viertel gilt als Vergnügungsmeile, tagsüber eher unspektakulär.","tip":"Von hier mit der Metro 2 (Blanche) oder zu Fuß zurück. Eine Show im Moulin Rouge ist nicht Teil dieses Plans.","deep":{"lage":"Boulevard de Clichy, 18. Arrondissement","history":["Der Moulin Rouge eröffnete am 6. Oktober 1889, im Jahr der Weltausstellung und des Eiffelturms, am Boulevard de Clichy an der Place Blanche. Gegründet wurde er von Joseph Oller (1839–1922) und Charles Zidler als „Jardin de Paris“, ein Garten mit Café-Konzert und Tanzsaal. Der Boulevard de Clichy folgt dem Verlauf der früheren Zollmauer, des Mur des Fermiers généraux. Vor deren Barrières entstanden wegen der städtischen Verbrauchssteuer Wirtshäuser und Tanzlokale (guinguettes); sie sind ein plausibler Vorläufer der Vergnügungsgegend, ein direkter Beleg für den Moulin Rouge liegt nicht vor.","Zum Programm gehörten Elektrizität als Attraktion und der französische Cancan. Tänzer und Tänzerinnen wurden zu Berühmtheiten: La Goulue (Louise Weber), Jane Avril und Valentin le Désossé. Henri de Toulouse-Lautrec (1864–1901) schuf 1891 im Auftrag Zidlers das Plakat „Moulin Rouge. La Goulue“, eine Farblithografie von 1,70 × 1,30 m. Es war sein erstes Plakat und machte ihn bekannt; Zidler bestellte es zum Saisonbeginn. Plakatwerbung, namentlich bekannte Stars und Eintrittsgeld gehörten zum Geschäftsmodell dieser Unterhaltungsindustrie.","Am 27. Februar 1915 zerstörte ein Feuer das Gebäude. Der Wiederaufbau begann nach französischer Wikipedia 1921, die englische Fassung nennt die Wiedereröffnung 1925. In den 1920er-Jahren prägten Jacques-Charles und Mistinguett die Revuen, 1929 wurde das Haus zum Kino, 1937 der Saal zum Nachtclub. 1951 übernahm Georges „Jo“ France den Betrieb, 1955 die Brüder Joseph und Louis Clérico; Jacki Clérico leitete ihn von 1962 bis zu seinem Tod 2013 und führte Revuen mit F-Titeln ein, etwa „Frou-Frou“ (1963) und „Féerie“ (1999–2020).","In der Nacht zum 25. April 2024 stürzten die Flügel auf die Straße und beschädigten die Fassade, ohne Verletzte. Es war die erste Unterbrechung der Drehung seit 1889. Im Juli 2025 drehten sich die Flügel wieder."],"terms":[{"fr":"Quadrille","de":"Gruppentanz für mehrere Paare, in dessen Form der Cancan aufgeführt wurde","ety":"Über span. cuadrilla, „kleine Gruppe“, zu cuadro, „Viereck“, aus lat. quadrum."},{"fr":"La Goulue","de":"Die Gierige, Gefräßige","ety":"Spitzname der Tänzerin Louise Weber; goulu geht auf altfrz. goule, „Kehle, Schlund“, aus lat. gula zurück."},{"fr":"Belle Époque","de":"Schöne Epoche","ety":"Rückblickende Bezeichnung für die Zeit etwa 1890 bis 1914, geprägt erst nach dem Ersten Weltkrieg."}],"kids":["Der Moulin Rouge eröffnete 1889, im selben Jahr wie der Eiffelturm.","Toulouse-Lautrecs erstes Plakat für das Haus von 1891 ist 1,70 m hoch und 1,30 m breit.","Ein Feuer zerstörte das Gebäude 1915, der Neubau öffnete in den 1920er-Jahren.","Im April 2024 fielen die Flügel in der Nacht ab, zum ersten Mal seit 1889; seit Juli 2025 drehen sie sich wieder."],"quiz":[{"q":"In welchem Jahr eröffnete der Moulin Rouge?","a":"1889."},{"q":"Welcher Künstler schuf 1891 das berühmte Plakat?","a":"Henri de Toulouse-Lautrec."},{"q":"Was bedeutet der Spitzname La Goulue?","a":"Die Gierige oder Gefräßige."}],"sources":[{"title":"Musée Toulouse-Lautrec, Albi: Moulin Rouge. La Goulue (Plakat 1891)","url":"https://www.musee-toulouse-lautrec.com/en/collections/masterpieces/Moulin-Rouge-poster/"},{"title":"Time Out Paris: Les ailes du Moulin Rouge se remettent à tourner (7.7.2025)","url":"https://www.timeout.fr/paris/actualites/a-pigalle-les-ailes-du-moulin-rouge-se-remettent-a-tourner-070725"},{"title":"Wikipedia (en): Moulin Rouge, als Orientierung","url":"https://en.wikipedia.org/wiki/Moulin_Rouge"},{"title":"Wikipedia (fr): Moulin Rouge, als Orientierung","url":"https://fr.wikipedia.org/wiki/Moulin_Rouge"},{"title":"Wikipedia (fr): Mur des Fermiers généraux, als Orientierung","url":"https://fr.wikipedia.org/wiki/Mur_des_Fermiers_g%C3%A9n%C3%A9raux"}]}},{"t":"20:00","name":"Abendessen in Montmartre","q":"Rue des Abbesses Paris","mode":"zu Fuß","hook":"Crêpes, Bistro oder Flammkuchen?","info":"Rund um die Rue des Abbesses und die Rue Lepic liegen viele Bistros und Crêperien. Am ersten Abend lohnt sich etwas Einfaches. Reservieren ist am Sonntag selten nötig, bei Weinfest-Ende aber ratsam.","tip":"Eine Crêpe mit Zucker und Zitrone gehört zum ersten Abend dazu.","deep":{"lage":"Montmartre, 18. Arrondissement","history":["Das Wort „bistro“ ist erstmals 1884 belegt, in den „Souvenirs de la Roquette“ des Abbé Georges Moreau. Verbreitet ist die Erzählung, russische Kosaken hätten 1814 in Paris „bystro“ („schnell“) gerufen; eine Plakette am Restaurant „La Mère Catherine“ am Place du Tertre wiederholt sie. Sprachwissenschaftler halten das für unbelegt, weil zwischen 1814 und dem ersten Beleg rund 70 Jahre liegen (so Alain Rey). Eher stammt das Wort vom poitevinischen „bistraud“: Diener, dann Gehilfe eines Weinhändlers, dann der Händler selbst. Gesichert ist die Herkunft nicht.","Wirtschaftsgeschichtlich stehen hinter den Pariser Bistros vor allem Zuwanderer aus dem Zentralmassiv, die „Bougnats“. Sie kamen aus Aubrac, Cantal und Aveyron, arbeiteten zunächst als Wasserträger, Altwarenhändler und Brennholzlieferanten und wechselten unter dem Zweiten Kaiserreich zu Kohle und Getränken. Im „Café-charbon“ („Vins et charbons“) lieferte oft der Mann die Kohle, während die Frau ausschenkte; manche Häuser vermieteten auch Zimmer oder kochten. Bistros entstanden nahe an Fabriken, um Arbeiter anzuziehen.","Zahlen sind unsicher. Jean Ajalbert schätzte 1890 im „Figaro“ rund 300.000 Auvergnaten in Paris, gegenüber etwa 10.000 zwanzig Jahre zuvor; das ist eine journalistische Schätzung, keine Zählung. Die „Ligue auvergnate“ bestand seit 1886. Auch heute stammen auffallend viele Besitzer bekannter Pariser Cafés aus dem Aveyron, etwa Paul Boubal (1908–1988), der 1939 das Café de Flore kaufte.","Die Brasserie ist eine andere Tradition. Sie entwickelte sich unter dem Zweiten Kaiserreich, nach 1870 eröffneten viele Elsässer in Paris „brasseries alsaciennes“; Bier war nach der Annexion Elsass-Lothringens durch Zölle teurer geworden und kam mehr aus Lothringen. Das Wort geht auf den Brauer (brasseur) zurück. Eine amtliche Unterscheidung zwischen Brasserie, Bistro und Restaurant gibt es nicht.","Heute gelten Bistros als immaterielles Kulturerbe Frankreichs (nationales Inventar). Ihre Zahl ist stark gesunken; die Angaben reichen von 400.000 (1945) auf 40.000 (2021) bis zu 170.000 Trinklokalen (1958) auf 34.600 (2021) und sind nicht vereinbar."],"terms":[{"fr":"Bistrot / Bistro","de":"Kleines Lokal mit einfacher Küche und Getränken","ety":"Wahrscheinlich von poitevin. bistraud, „Diener, Weinhändler“; die Herleitung vom russischen bystro, „schnell“, gilt als Volksetymologie."},{"fr":"Bougnat","de":"Auvergnatischer Kohlen- und Weinhändler in Paris","ety":"Pariser Spitzname für Zuwanderer aus dem Zentralmassiv; die Herkunft ist unsicher, genannt wird ein Kohlenhändler-Ruf „de carbou n'ia“."},{"fr":"Brasserie","de":"Brauerei, später Gaststätte","ety":"Zu brasseur, „Brauer“; ursprünglich der Braubetrieb, dann das Lokal, in dem Bier ausgeschenkt wurde."}],"kids":["Das Wort „bistro“ ist erst seit 1884 schriftlich belegt, die russische Kosaken-Geschichte von 1814 gilt deshalb als Legende.","Viele Pariser Bistros gehörten Auvergnaten, die früher Kohle lieferten; auf den Schildern stand „Vins et charbons“, Wein und Kohle.","Eine Plakette am Restaurant La Mère Catherine am Place du Tertre erzählt die Kosaken-Legende.","1945 soll es in Frankreich rund 400.000 Bistros gegeben haben, 2021 rund 40.000 (Angaben schwanken)."],"quiz":[{"q":"Aus welcher Region Frankreichs stammten die „Bougnats“, die Paris mit Kohle und Wein versorgten?","a":"Aus dem Zentralmassiv (Auvergne, Cantal, Aveyron)."},{"q":"Von welchem russischen Wort soll „bistro“ der Legende nach stammen, und was bedeutet es?","a":"Bystro, „schnell“."},{"q":"Warum gilt die Kosaken-Legende als unwahrscheinlich?","a":"Das Wort ist erst 1884 belegt, rund 70 Jahre nach 1814."}],"sources":[{"title":"Wikipedia (fr): Bistrot, als Orientierung","url":"https://fr.wikipedia.org/wiki/Bistrot"},{"title":"Paris Zigzag: L'origine du mot bistrot","url":"https://www.pariszigzag.fr/insolite/histoire-insolite-paris/origine-mot-bistrot/"},{"title":"Wikipedia (en): Bougnat, als Orientierung","url":"https://en.wikipedia.org/wiki/Bougnat"},{"title":"Jean Ajalbert: L'Auvergnat de Paris, Le Figaro, Supplément littéraire, 25.10.1890 (Transkription, Aprogemere)","url":"https://www.aprogemere.fr/documents/dossiers/Auvergnat_Paris.pdf"},{"title":"Wikipedia (fr): Brasserie (restaurant), als Orientierung","url":"https://fr.wikipedia.org/wiki/Brasserie_(restaurant)"}]}}],"kids":"Zählt auf dem Weg die Windmühlen, es sind mindestens drei.","fallback":"nur Sacré-Cœur von innen und anschließend ein warmes Abendessen. Die Wohnung ist nahe.","legs":[{"from":"Wohnung","to":"Place des Abbesses","m":300,"rec":"walk","mixM":300,"min":4},{"from":"Place des Abbesses","to":"Sacré-Cœur","m":657,"rec":"walk","mixM":657,"note":"Bergauf, viele Stufen","min":9},{"from":"Sacré-Cœur","to":"Moulin de la Galette","m":553,"rec":"walk","mixM":553,"min":7},{"from":"Moulin de la Galette","to":"Moulin Rouge","m":564,"rec":"walk","mixM":564,"note":"Bergab","min":8},{"from":"Moulin Rouge","to":"Abendessen (Rue des Abbesses)","m":621,"rec":"walk","mixM":621,"min":8},{"from":"Abendessen","to":"Wohnung","m":300,"rec":"walk","mixM":300,"min":4}]},{"id":"p1","badge":{"label":"1","kind":"day","bg":"#1976B8","fg":"#FFFFFF","sym":"⛪"},"tag":"Paris, Tag 1","date":"2026-10-12","short":"Mo 12.10.","name":"Île de la Cité","title":"Montag: Notre-Dame, Sainte-Chapelle und Seine","line":{"label":"4","kind":"metro","bg":"#BB4D98","fg":"#FFFFFF","caption":"Metro-Linie 4, Station Cité"},"lead":"Die Altstadt auf der Seine-Insel. Am Montag haben Orsay, Katakomben und Versailles zu, Kirchen und Schiffe aber nicht.","leave":"10:30","sunset":"19:06","stops":[{"t":"11:15","name":"Notre-Dame de Paris","q":"Cathedrale Notre-Dame de Paris","mode":"Metro 4 (Cité)","hook":"Was hat der Brand von 2019 wirklich verändert?","info":"Die Kathedrale entstand ab 1163 und brannte im April 2019. Nach fünf Jahren Restaurierung öffnete sie im Dezember 2024 wieder. Innen ist sie hell, die Fassade zeigt Skulpturen und Wasserspeier. Der Eintritt ist kostenlos, man kann einen Zeitfenster-Platz reservieren.","tip":"Große Rucksäcke sind nicht erlaubt. Zeiten und Preise stammen aus einer Sekundärquelle, bitte vorher auf notredamedeparis.fr prüfen.","cost":"Kathedrale: kostenlos. Türme (ca. 16 €, 424 Stufen) und Krypta (ca. 9 €) sind optional.","deep":{"lage":"Île de la Cité, 4. Arrondissement","history":["Die Île de la Cité war nicht der Kern des römischen Lutetia: Nach 52 v. Chr. wuchs die gallo-römische Stadt vor allem am linken Seineufer, eine vorrömische Siedlung der Parisii lässt sich auf der Insel nicht nachweisen. Erst die Einfälle ab 276 trieben die Bewohner auf die Insel, die ab 308 befestigt wurde. 357 residierte hier der Caesar Julian, 508 machte Chlodwig Paris zur Hauptstadt seines Reiches. Ein Zeugnis dieser Frühzeit ist der Pilier des Nautes, die Säule einer Schifferkorporation, zwischen 14 und 37 n. Chr. Jupiter geweiht; sie wurde im frühen 18. Jahrhundert unter der Kathedrale gefunden.","Maurice de Sully (Bischof von Paris 1160–1196), Sohn armer Eltern aus Sully-sur-Loire, ließ die Vorgängerbauten durch eine neue Kathedrale ersetzen, darunter eine frühchristliche Kirche des 4. Jahrhunderts und eine karolingische Kathedrale. Als Grundsteinlegung gilt traditionell 1163; der Baubeginn könnte bereits 1161 gelegen haben. Ludwig VII. (Kapetinger) steuerte 200 Livres bei, getragen wurde der Bau überwiegend von Bischof und Domkapitel. Der Chor entstand 1163–1182, Westfassade und Türme folgten bis etwa 1250.","1789 wurde der Bau Nationalgut. 1793 diente er dem Kult der Vernunft, Statuen wurden geköpft oder zerstört, der Schatz geplündert; zeitweise lagerte Wein im Innern. Nach dem Konkordat wurde 1802 wieder Gottesdienst gefeiert, am 2. Dezember 1804 krönte sich Napoleon hier zum Kaiser. Victor Hugos Roman von 1831 lenkte den Blick auf den verfallenen Bau. 1844 erhielten Lassus und Viollet-le-Duc den Auftrag; Viollet-le-Duc führte die Arbeiten allein bis in die 1860er Jahre zu Ende und errichtete 1859 die 96 m hohe flèche.","Unter Haussmann veränderte sich die Insel grundlegend. Nach gängiger Angabe wurden in den 1860er Jahren rund 25.000 Bewohner verdrängt; die mittelalterlichen Gassen wichen Polizeipräfektur und Handelsgericht, das Hôtel-Dieu wurde 1868–1875 nach Norden verlegt, der Vorplatz etwa versechsfacht.","Am 15. April 2019 brach im Dachstuhl Feuer aus, der Turm stürzte am Abend ein. Der Dachstuhl des 13. Jahrhunderts und Teile der Gewölbe gingen verloren; Fassade, Türme und Strebewerk blieben stehen. Der Wiederaufbau orientierte sich am Zustand vor dem Brand, der neue Turm folgt den Plänen Viollet-le-Ducs. Am 7. und 8. Dezember 2024 wurde die Kathedrale wiedereröffnet."],"terms":[{"fr":"cathédrale","de":"Kathedrale, Bischofskirche","ety":"Von lat. ecclesia cathedralis, „Kirche mit dem Bischofssitz“, zu grch. kathédra „Sitz“."},{"fr":"flèche","de":"Turmspitze, schlanker Vierungsturm","ety":"Das französische Wort bedeutet eigentlich „Pfeil“."},{"fr":"Culte de la Raison","de":"Kult der Vernunft","ety":"Revolutionärer Kult von 1793, in dessen Zeit die Kathedrale als „Temple de la Raison“, Tempel der Vernunft, bezeichnet wurde."}],"kids":["Die Kathedrale ist 127 m lang und 48 m breit und bietet Platz für bis zu 9.000 Menschen.","Beim Brand 2019 stürzte der 96 m hohe Turm ein; die Feuerwehr rettete Fassade und Türme.","In der Revolution lagerte zeitweise Wein in der Kirche, Statuen wurden geköpft oder zerstört.","Unter der Kathedrale fand man im frühen 18. Jahrhundert den Pilier des Nautes, eine römische Säule für Jupiter."],"quiz":[{"q":"In welchem Jahr brannte Notre-Dame, und was stürzte dabei ein?","a":"2019 (15. April); der Vierungsturm (flèche) stürzte ein."},{"q":"Wem war die Kathedrale 1793 offiziell gewidmet?","a":"Dem Kult der Vernunft (Temple de la Raison)."},{"q":"Wie viele Bewohner wurden nach gängiger Angabe in den 1860er Jahren von der Île de la Cité verdrängt?","a":"Rund 25.000."}],"sources":[{"title":"Notre-Dame de Paris, offizielle Seite: Geschichte","url":"https://www.notredamedeparis.fr/en/understand/history/"},{"title":"France.fr: Notre-Dame de Paris, die wichtigen Daten","url":"https://www.france.fr/fr/article/notre-dame-de-paris-en-10-dates-marquantes/"},{"title":"Wikipedia (fr): Cathédrale Notre-Dame de Paris","url":"https://fr.wikipedia.org/wiki/Cathédrale_Notre-Dame_de_Paris"},{"title":"Wikipedia (fr): Île de la Cité","url":"https://fr.wikipedia.org/wiki/Île_de_la_Cité"},{"title":"Wikipedia (en): Notre-Dame de Paris","url":"https://en.wikipedia.org/wiki/Notre-Dame_de_Paris"}]}},{"t":"12:30","name":"Sainte-Chapelle","q":"Sainte-Chapelle Paris","mode":"zu Fuß (5 Min.)","hook":"Wie viele Glasbilder erzählen hier die Bibel?","info":"Ludwig IX. (der Heilige) ließ sie für die Dornenkrone und andere Reliquien bauen, geweiht wurde sie 1248. Die Oberkirche besteht fast nur aus Buntglas, über 1.000 Bildszenen. Es gibt eine Sicherheitskontrolle, Tickets mit Zeitfenster sind sinnvoll.","tip":"Bei Sonne wirkt das Licht am schönsten. Rechnet mit 45 Minuten.","cost":"Erw. 22 €. Kinder: freier Eintritt für unter-26-Jährige mit Wohnsitz in der EU (Ausweis mitnehmen, Ticket trotzdem buchen).","deep":{"lage":"Île de la Cité (Palais de la Cité), 1. Arrondissement","history":["Ludwig IX. (1214–1270), Kapetinger, wurde mit zwölf Jahren König; seine Mutter Blanche de Castille führte die Regentschaft. 1297 wurde er heiliggesprochen, er ist der einzige kanonisierte König Frankreichs. 1239 erwarb er von Balduin II. von Courtenay, dem Kaiser von Konstantinopel, die Dornenkrone, die dieser zuvor einem venezianischen Kaufmann verpfändet hatte. Der Preis betrug 135.000 Livres tournois, nach Angaben der Sainte-Chapelle etwa die Hälfte der jährlichen Einnahmen des Königreichs. 1241 kamen weitere Passionsreliquien hinzu, darunter ein Stück des Wahren Kreuzes.","Die Kapelle entstand innerhalb des Palais de la Cité, seit den frühen Kapetingern Residenz und Sitz der Curia regis. Sie gilt als „monumentaler Reliquienschrein“: Die Oberkapelle war für den König bestimmt, die Unterkapelle für das Palastpersonal. Gebaut wurde in weniger als sieben Jahren, die Kosten werden auf rund 40.000 Livres geschätzt, der Baumeister ist unbekannt (Pierre de Montreuil ist nur eine Zuschreibung). Die Weihe am 26. April 1248 lag kurz vor dem Aufbruch Ludwigs zum Siebten Kreuzzug.","In der Oberkapelle stehen fünfzehn Fenster von etwa 15 m Höhe mit 1.113 Szenen, zusammen rund 670 m² Glas; etwa zwei Drittel stammen aus dem Mittelalter. Der Zyklus beginnt im Norden mit der Genesis und endet im Westen mit der Apokalypse-Rose. Statt Strebebögen halten eiserne Ketten und Stangen die Wände, ein Merkmal der Rayonnant-Gotik.","Philipp IV. der Schöne ließ den Palast 1302–1313 neu errichten. 1360 verließ Karl V. ihn Richtung Louvre; ab 1370 diente ein Teil als Staatsgefängnis (Conciergerie), das Parlement de Paris nutzte das Obergeschoss. 1793–1795 tagte hier das Revolutionstribunal, Marie-Antoinette saß in der Conciergerie ein; 1795 wurde der Palast zum Justizpalast.","Die Revolution traf die Kapelle schwer: Der Schrein wurde 1791 eingeschmolzen, die meisten Reliquien gingen verloren, die Oberkapelle diente als Archiv und Mehlspeicher. Die Dornenkrone kam 1806 in den Schatz von Notre-Dame. Die Restaurierung durch Duban, Lassus und Boeswillwald lief von 1840 bis 1863 und gilt als Vorbild der Denkmalpflege."],"terms":[{"fr":"relique","de":"Reliquie","ety":"Von lat. reliquiae, „Überreste“."},{"fr":"livre tournois","de":"Tournosisches Pfund (Rechnungswährung)","ety":"Nach der Münzprägung in Tours; livre von lat. libra, „Pfund“."},{"fr":"style rayonnant","de":"Strahlenstil, Hochgotik des 13. Jahrhunderts","ety":"Von fr. rayon, „Strahl“, nach dem strahlenförmigen Maßwerk."}],"kids":["Die Dornenkrone kostete 135.000 Livres, nach Schätzung mehr als das Dreifache der Baukosten der Kapelle (rund 40.000 Livres).","In den 15 Fenstern sind 1.113 Szenen aus Altem und Neuem Testament dargestellt.","Die Oberkapelle ist innen 20,5 m hoch, aber nur 10,7 m breit.","Statt Strebebögen halten eiserne Ketten und Stangen die Wände zusammen."],"quiz":[{"q":"Welche Reliquie kaufte Ludwig IX. 1239, und wofür ließ er die Kapelle bauen?","a":"Die Dornenkrone; die Kapelle ist ihr „monumentaler Reliquienschrein“."},{"q":"Wie viele Szenen zeigen die Fenster der Oberkapelle?","a":"1.113."},{"q":"Wo wird die Dornenkrone seit 1806 aufbewahrt?","a":"Im Schatz von Notre-Dame."}],"sources":[{"title":"Sainte-Chapelle (CMN): Geschichte der Sainte-Chapelle","url":"https://www.sainte-chapelle.fr/decouvrir/histoire-de-la-sainte-chapelle"},{"title":"Sainte-Chapelle (CMN): Ein einzigartiger Glasfensterzyklus","url":"https://www.sainte-chapelle.fr/en/discover/a-unique-set-of-stained-glass-windows"},{"title":"Sainte-Chapelle (CMN): Saint Louis","url":"https://www.sainte-chapelle.fr/en/discover/saint-louis"},{"title":"Wikipedia (fr): Sainte-Chapelle","url":"https://fr.wikipedia.org/wiki/Sainte-Chapelle"},{"title":"Wikipedia (fr): Palais de la Cité","url":"https://fr.wikipedia.org/wiki/Palais_de_la_Cité"}]}},{"t":"13:30","name":"Mittag auf der Île Saint-Louis","q":"Rue Saint-Louis en l'Ile Paris","mode":"zu Fuß (10 Min.)","hook":"Gibt es hier das berühmteste Eis von Paris?","info":"Die kleine Nachbarinsel ist ruhig und hat ein paar Bistros in der Rue Saint-Louis-en-l'Île. Das Eis von Berthillon ist eine Tradition. Die Öffnungstage vorher prüfen, Montag und Dienstag sind dort oft geschlossen.","tip":"Alternativ eine Boulangerie und ein Picknick am Seine-Ufer.","deep":{"lage":"Île Saint-Louis, 4. Arrondissement","history":["Bis ins 17. Jahrhundert bestand die Fläche aus zwei Inseln: der Île Notre-Dame, deren Eigentümer das Domkapitel von Notre-Dame war, und östlich davon der Île aux Vaches. Ein Kanal trennte sie; die Datierung dieser Teilung wird in den Quellen unterschiedlich angegeben (13. Jahrhundert bzw. 1360). Die Inseln dienten als Weide- und Lagerfläche und waren nur per Boot erreichbar. Schon 867 hatte Karl der Kahle die Insel dem Bischof von Paris geschenkt.","Heinrich IV. (Bourbone) plante eine Bebauung, nach seiner Ermordung 1610 verzögerte sich das Vorhaben. Unter der Regentschaft Marie de Médicis wurde der Bauunternehmer Christophe Marie mit den Geldgebern Lugles Poulletier und François Le Regrattier beauftragt (die Quellen nennen 1614 oder um 1616). Sie sollten den Kanal zuschütten sowie Brücken, Kais und Straßen anlegen und erhielten dafür das Land zur Parzellierung. Das Domkapitel klagte, weil es sich als Eigentümer sah; die Unternehmer gerieten in finanzielle Schwierigkeiten, Marie wurde zahlungsunfähig. Der Pont Marie war 1635 fertig.","Danach ging es schnell: Die meisten Hôtels particuliers entstanden zwischen etwa 1620 und 1660, um 1664 war die Parzellierung nahezu abgeschlossen, die Insel hieß „l'île des palais“. Louis Le Vau zog 1639 mit seiner Familie hierher, sein Bruder François entwarf die Kirche Saint-Louis-en-l'Île. Der Hôtel Lambert, ab 1640 von Le Vau gebaut, und der Hôtel de Lauzun (1657–1658, für den Financier Charles Gruyn) zählen zu den bekanntesten Bauten.","Zur Sozialgeschichte: Marie de Médicis zog nach der Darstellung der englischen Wikipedia vor allem Magistrate und Financiers an, kaum Hochadel, der das Marais bevorzugte. Wohlhabende wohnten an den Kais, Händler und Handwerker im Inneren der Insel. Die Insel zählte im 17. und 18. Jahrhundert zu den wohlhabenden Pariser Vierteln.","Den heutigen Namen trägt die Insel nach Louis IX. seit 1725, in der Revolution hieß sie kurz Île de la Fraternité. Im 19. und frühen 20. Jahrhundert wohnten hier Künstler und Gelehrte, etwa Baudelaire (1843–1846), Camille Claudel (1899–1923) und Marie Curie (1912–1934). 2016 lebten 2.323 Menschen auf der Insel; seit den 1980er Jahren wurden viele kleine Wohnungen zu Zweitwohnungen. Das Eis von Berthillon ist seit 1961 belegt (Gault et Millau)."],"terms":[{"fr":"hôtel particulier","de":"Stadtpalais","ety":"Fr. hôtel geht auf lat. hospitale, „Gästehaus“, zurück; particulier bedeutet hier „privat“."},{"fr":"l'île des palais","de":"Insel der Paläste","ety":"Beiname der Insel wegen ihrer vielen Stadtpalais des 17. Jahrhunderts."}],"kids":["Die Insel entstand, indem ein Kanal zugeschüttet und zwei Inseln verbunden wurden.","Der Pont Marie wurde 1635 fertig und ist nach dem Bauunternehmer Christophe Marie benannt.","In etwa fünfzig Jahren war die ganze Insel bebaut.","2016 lebten dort nur 2.323 Menschen."],"quiz":[{"q":"Nach wem ist der Pont Marie benannt?","a":"Nach dem Bauunternehmer Christophe Marie."},{"q":"Welche zwei Inseln wurden zur heutigen Île Saint-Louis verbunden?","a":"Die Île Notre-Dame und die Île aux Vaches."}],"sources":[{"title":"Wikipedia (fr): Île Saint-Louis","url":"https://fr.wikipedia.org/wiki/Île_Saint-Louis"},{"title":"Wikipedia (en): Île Saint-Louis","url":"https://en.wikipedia.org/wiki/%C3%8Ele_Saint-Louis"},{"title":"Cityzeum: Urbanisierung der Île Saint-Louis","url":"https://www.cityzeum.com/historique-de-lurbanisation-de-lile-saint-louis"},{"title":"Wikipedia (fr): Hôtel de Lauzun","url":"https://fr.wikipedia.org/wiki/Hôtel_de_Lauzun"},{"title":"Wikipedia (fr): Berthillon","url":"https://fr.wikipedia.org/wiki/Berthillon"}]}},{"t":"15:00","name":"Seine-Rundfahrt (ca. 1 Std.)","q":"Vedettes du Pont Neuf Paris","mode":"zu Fuß (15 Min.)","hook":"Wie viele Brücken fahrt ihr unterwegs hindurch?","info":"Das Boot legt an der Spitze der Insel (Square du Vert-Galant) ab und fährt an Louvre, Orsay und Eiffelturm vorbei. Die Rundfahrt dauert eine Stunde. Abfahrtszeiten im Kalender der Vedettes prüfen.","tip":"Oberdeck für die Aussicht, Jacken für den Wind.","cost":"Erw. 15 € (statt 17 €), Kind 7 € (statt 9 €), laut Anbieter; Altersgrenze für Kinderpreis vorab prüfen.","deep":{"lage":"Seine, Abfahrt an der Westspitze der Île de la Cité (Square du Vert-Galant), 1. Arrondissement","history":["Die Seine war Verkehrs- und Handelsweg lange vor der Stadt im heutigen Sinn. Eine Schifferkorporation, die nautae Parisiaci, bestand schon in römischer Zeit (siehe Notre-Dame). Im Mittelalter organisierten sich die Kaufleute der Wasserwege in der Hanse der Pariser Wasserkaufleute (marchands de l'eau). 1121 erlaubte ihnen Ludwig VI. Abgaben auf Weinschiffe, 1141 erwarben sie die Place de Grève. 1170 verlieh Ludwig VII. (Kapetinger) ihnen die Aufsicht über den Flussverkehr von der Brücke von Mantes bis Paris; die Einnahmen teilte der König mit ihnen. Unter Ludwig IX. ging die Hanse in der prévôté des marchands auf, 1672 hob Ludwig XIV. sie auf.","Das Stadtwappen geht auf diese Kaufleute zurück: Ihr Siegel zeigte um 1210 ein Flussschiff, als Stadtwappen mit Schiff ist es seit 1358 belegt. Das Motto „Fluctuat nec mergitur“ erscheint seit den 1580er Jahren auf Pariser Jetons und wurde am 24. November 1853 unter Haussmann amtlich.","Heinrich III. (Valois) beschloss den Pont Neuf 1577; während der Unruhen ruhte der Bau von 1588 bis 1598. Heinrich IV. (Bourbone) vollendete ihn 1607 ohne Häuser auf der Brücke und mit den ersten Gehwegen von Paris. Er ist 238 m lang und trotz seines Namens die älteste erhaltene Brücke der Stadt. Hier boten Händler, Gaukler und Buchhändler ihre Waren an. Das Reiterstandbild Heinrichs IV. von 1614 wurde 1792 eingeschmolzen, 1818 ersetzt. An der Inselspitze unterhalb der Brücke liegt der Square du Vert-Galant, der Anlegeplatz der Rundfahrt.","Wie sehr die Stadt vom Fluss abhängt, zeigte das Hochwasser von 1910: Der Scheitel lag am 28. Januar bei 8,62 m am Pegel des Pont d'Austerlitz, rund 22.000 Keller liefen voll, die Hälfte des damaligen Metronetzes stand unter Wasser, darunter die erst wenige Wochen zuvor eröffnete Linie 4. Die Schifffahrt in Paris wurde eingestellt, Kanalisation und Abwassergruben liefen über, es traten Typhus- und Scharlachfälle auf. Der direkte Schaden wird auf etwa 400 Millionen Goldfranc beziffert; Todesopfer verzeichnet die Quelle nicht.","1991 nahm die UNESCO die „Pariser Seineufer“ vom Pont de Sully bis zum Pont d'Iéna (538 ha, Kriterien i, ii, iv) in die Welterbeliste auf."],"terms":[{"fr":"nautes","de":"Schiffer","ety":"Von lat. nauta, aus grch. naútēs, „Seemann“."},{"fr":"prévôt des marchands","de":"Kaufmannsvorsteher","ety":"Von lat. praepositus, „Vorgesetzter“."},{"fr":"Fluctuat nec mergitur","de":"Sie schwankt, geht aber nicht unter","ety":"Lateinischer Wahlspruch, verkürzt aus einem mittelalterlichen Vers über das „Schiff Petri“, seit 1853 Motto der Stadt."}],"kids":["Das Pariser Stadtwappen zeigt ein Schiff, und das Motto bedeutet: „Sie schwankt, geht aber nicht unter“.","Der Pont Neuf heißt „Neue Brücke“, ist aber mit 238 m Länge die älteste erhaltene Brücke von Paris.","Beim Hochwasser 1910 stand die Seine 8,62 m hoch am Pegel Austerlitz und überflutete auch Metrotunnel.","Die Hanse der Wasserkaufleute durfte ab 1170 den Flussverkehr zwischen Mantes und Paris beaufsichtigen; Ludwig XIV. hob sie 1672 auf."],"quiz":[{"q":"Was ist auf dem Pariser Stadtwappen abgebildet?","a":"Ein Schiff."},{"q":"In welchem Jahr wurde der Pont Neuf vollendet, und was war für Paris neu an ihm?","a":"1607; keine Häuser auf der Brücke und die ersten Gehwege der Stadt."},{"q":"Welche Metro-Linie war mit ihrem Abschnitt unter der Seine erst wenige Wochen in Betrieb, als das Hochwasser kam?","a":"Die Linie 4."}],"sources":[{"title":"UNESCO: Paris, Banks of the Seine","url":"https://whc.unesco.org/en/list/600/"},{"title":"Wikipedia (fr): Hanse parisienne","url":"https://fr.wikipedia.org/wiki/Hanse_parisienne"},{"title":"Wikipedia (en): Coat of arms of Paris","url":"https://en.wikipedia.org/wiki/Coat_of_arms_of_Paris"},{"title":"Wikipedia (fr): Pont Neuf","url":"https://fr.wikipedia.org/wiki/Pont_Neuf"},{"title":"Wikipedia (fr): Crue de la Seine de 1910","url":"https://fr.wikipedia.org/wiki/Crue_de_la_Seine_de_1910"}]}},{"t":"16:30","name":"Quartier Latin und Shakespeare and Company","q":"Shakespeare and Company Paris","mode":"zu Fuß (15 Min.)","optional":true,"hook":"Welche Buchhandlung ist Treffpunkt für Schriftsteller?","info":"Die Buchhandlung gegenüber der Seine bietet englischsprachige Bücher in engen Gängen. Das Viertel um die Place Saint-Michel und die Rue de la Huchette ist lebendig und voller kleiner Läden.","tip":"Zurück nach Montmartre fahrt ihr ab Saint-Michel mit der Metro, Google Maps nennt den schnellsten Weg.","deep":{"lage":"Quartier Latin, 5. Arrondissement (linkes Seine-Ufer)","history":["Das Viertel am linken Seineufer war der Kern der römischen Stadt Lutetia: Das Forum lag unter der heutigen Rue Soufflot, und die beiden Nord-Süd-Achsen entsprechen der Rue Saint-Jacques und dem Boulevard Saint-Michel. Seit dem Mittelalter ist es das Viertel der Hochschulen.","Aus der Domschule entstand um 1150 eine Körperschaft von Lehrenden und Studenten. 1200 erkannte Philipp II. Augustus (Kapetinger) sie als universitas an und stellte die Studenten unter kirchliche statt königliche Gerichtsbarkeit. 1215 legte der päpstliche Legat Robert de Courçon Statuten fest. Bis 1254 bestanden die vier Fakultäten Artes, Theologie, Recht und Medizin; die Artisten waren in vier Nationen gegliedert (französisch, normannisch, pikardisch, englisch, später deutsch). Die Studenten kamen aus ganz Europa. Die Universität besaß zunächst keine eigenen Gebäude.","Zur Sozialgeschichte gehören die Colleges: 1180 entstand das Collège des Dix-Huit für arme Scholaren, später am Hang der Montagne Sainte-Geneviève viele weitere. Robert de Sorbon, Kaplan und Beichtvater Ludwigs IX., gründete das Collège de Sorbonne für arme Theologiestudenten (1253 nach fr. Wikipedia; königlich anerkannt 1257). Weil an der Universität viel Latein gesprochen und gelehrt wurde, spottete man im 17. Jahrhundert vom „pays latin“; Ende des 18. Jahrhunderts setzte sich „quartier latin“ durch.","1229–1231 setzten die Lehrenden den Betrieb nach einer verweigerten Rechtshilfe der Königin aus; 1231 erlaubte Gregor IX. dies künftig bei Rechtsverweigerung. 1793 hob der Konvent die Universität auf, 1806 gründete Napoleon sie neu. Richelieu, seit 1622 Leiter der Sorbonne, ließ sie ab 1635 neu bauen, 1885–1901 folgte der Neubau von Nénot. Nach 1968 wurde die Universität Paris 1971 auf dreizehn Universitäten aufgeteilt.","Shakespeare and Company: Die Amerikanerin Sylvia Beach eröffnete 1919 den ersten Laden, 1922 verlegte sie Joyces „Ulysses“; 1941 schloss sie ihn nach der deutschen Besetzung. George Whitman gründete 1951 einen eigenen Buchladen „Le Mistral“ gegenüber von Notre-Dame, in einem Gebäude des frühen 17. Jahrhunderts, einem früheren Kloster, und nannte ihn 1964 zum 400. Geburtstag Shakespeares nach Beachs Laden. Whitman starb 2011."],"terms":[{"fr":"université","de":"Universität","ety":"Von lat. universitas, „Gesamtheit“; im Mittelalter die Körperschaft der Lehrenden und Lernenden."},{"fr":"nations","de":"Landsmannschaften der Studenten","ety":"Von lat. natio, „Geburt, Herkunft“."},{"fr":"quartier latin","de":"Lateinisches Viertel","ety":"Zunächst scherzhaft „pays latin“ (17. Jahrhundert), weil an der Universität Latein verwendet wurde."}],"kids":["Das Viertel heißt „Lateinisches Viertel“, weil an der Universität Latein gelehrt und gesprochen wurde.","Seit 1200 durften Studenten nicht mehr vom königlichen Gericht, sondern nur noch von kirchlichen Gerichten verurteilt werden.","Die Sorbonne begann als Wohnheim für arme Theologiestudenten.","In Shakespeare and Company durften Schreibende gratis übernachten, wenn sie täglich ein Buch lasen; geschätzt rund 30.000 haben dort geschlafen."],"quiz":[{"q":"Warum heißt das Viertel „Quartier Latin“?","a":"Weil an der Universität Latein verwendet und gelehrt wurde."},{"q":"In welchem Jahr erkannte Philipp II. Augustus die Universität an?","a":"1200."}],"sources":[{"title":"Wikipedia (fr): Quartier latin","url":"https://fr.wikipedia.org/wiki/Quartier_latin_(Paris)"},{"title":"Wikipedia (en): University of Paris","url":"https://en.wikipedia.org/wiki/University_of_Paris"},{"title":"Wikipedia (fr): Sorbonne","url":"https://fr.wikipedia.org/wiki/Sorbonne"},{"title":"Sorbonne Université: Geschichte","url":"https://www.sorbonne-universite.fr/en/about-us/history"},{"title":"Shakespeare and Company: History","url":"https://www.shakespeareandcompany.com/history"}]}}],"kids":"Zählt die Wasserspeier an Notre-Dame, die ihr von unten erkennt.","fallback":"Sainte-Chapelle zuerst, Boot nur bei Aufhellung, sonst ein Café im Quartier Latin.","legs":[{"from":"Wohnung","to":"Notre-Dame","m":4330,"rec":"metro","mixM":1536,"metroMin":40,"via":"Château Rouge (Metro 4) bis Cité","metro":"Zu Fuß 1,2 km nach Château Rouge, Metro 4 Richtung Bagneux–Lucie Aubrac bis Cité (10 Stationen, ohne Umsteigen), dann ca. 350 m. Alternative: Anvers (0,8 km), Metro 2 bis Barbès-Rochechouart, umsteigen in Metro 4 bis Cité.","min":58},{"from":"Notre-Dame","to":"Sainte-Chapelle","m":394,"rec":"walk","mixM":394,"min":5},{"from":"Sainte-Chapelle","to":"Île Saint-Louis (Mittag)","m":1072,"rec":"walk","mixM":1072,"note":"Über die Brücken, schöne Strecke","min":14},{"from":"Île Saint-Louis","to":"Seine-Schiff (Vert-Galant)","m":1451,"rec":"walk","mixM":1451,"note":"Am Seine-Ufer entlang, keine sinnvolle Metro","min":19},{"from":"Seine-Schiff","to":"Shakespeare and Company","m":751,"rec":"walk","mixM":751,"min":10},{"from":"Shakespeare and Company","to":"Wohnung","m":4354,"rec":"metro","mixM":860,"metroMin":45,"via":"Saint-Michel (Metro 4), Barbès umsteigen, Pigalle (Metro 2)","metro":"Saint-Michel (ca. 300 m), Metro 4 Richtung Porte de Clignancourt bis Barbès-Rochechouart (10 Stationen), umsteigen in Metro 2 Richtung Porte Dauphine bis Pigalle (2 Stationen), dann 560 m. Ohne Umsteigen: Metro 4 bis Château Rouge (11 Stationen), dann 1,2 km bergauf.","min":58}]},{"id":"p2","badge":{"label":"2","kind":"day","bg":"#D9560F","fg":"#FFFFFF","sym":"🗼"},"tag":"Paris, Tag 2","date":"2026-10-13","short":"Di 13.10.","name":"Eiffelturm und Invalides","title":"Dienstag: Eiffelturm, Champ de Mars und Invalides","line":{"label":"8","kind":"metro","bg":"#C5A3CA","fg":"#1A1A1A","caption":"Metro-Linie 8, École Militaire / Invalides"},"lead":"Der berühmteste Turm der Stadt und eine militärische Gedenkstätte mit Bezug zum Ersten Weltkrieg.","leave":"10:30","sunset":"19:04","stops":[{"t":"11:15","name":"Trocadéro und Blick auf den Eiffelturm","q":"Trocadero Paris","mode":"Metro 2 + 6 (Trocadéro)","hook":"Von wo sieht man den Turm am besten?","info":"Die Terrasse des Palais de Chaillot ist der klassische Fotopunkt. Von dort geht ihr über die Pont d'Iéna direkt zum Turm. Der Eiffelturm wurde für die Weltausstellung 1889 gebaut und war zunächst auf 20 Jahre geplant.","tip":"Fotos am Vormittag, wenn die Sonne von der Seite kommt.","deep":{"lage":"Palais de Chaillot, 16. Arrondissement (rechtes Seine-Ufer)","history":["Der Name Trocadéro stammt nicht aus Paris. Er geht auf das Fort Trocadero zurück, das Cádiz in Spanien verteidigte. 1823 nahm es eine französische Expedition unter dem Herzog von Angoulême ein, im Feldzug zur Wiedereinsetzung König Ferdinands VII. in Spanien. Der Name wurde zum Ortsnamen auf dem Hügel von Chaillot im heutigen 16. Arrondissement.","Für die Weltausstellung von 1878 entstand hier der Palais du Trocadéro. Die Planung begann 1876, 1877 kam das Dach auf das Gebäude. Die Architekten waren Gabriel Davioud und Jules Bourdais; sie mischten mit maurischen und neobyzantinischen Elementen, als Vorbilder gelten die Giralda in Sevilla und der Palazzo Vecchio in Florenz.","1935 wurde der Palast abgerissen, um Platz für die Exposition internationale von 1937 zu schaffen, die vom 25. Mai bis 25. November 1937 dauerte und Trocadéro, Champ-de-Mars und Seineufer umfasste. Das Thema lautete Kunst und Technik im modernen Leben. 45 Länder nahmen teil, es kamen rund 31 Millionen Besucher. Der sowjetische und der deutsche Pavillon standen sich unmittelbar gegenüber; im spanischen Pavillon hing Picassos „Guernica“. Der Neubau, der Palais de Chaillot von Boileau, Carlu und Azéma, übernahm die beiden Seitenflügel des alten Palasts.","An den Fassaden stehen Inschriften von Paul Valéry. Heute befinden sich im Palast das Musée national de la Marine, das Musée de l'Homme, die Cité de l'architecture et du patrimoine und das Théâtre national de Chaillot. Am 10. Dezember 1948 verabschiedete die UN-Generalversammlung hier die Allgemeine Erklärung der Menschenrechte.","Der Weg zum Turm führt über den Pont d'Iéna. Napoleon ordnete ihn 1807 an und benannte ihn nach seinem Sieg bei Jena (1806); er wurde 1814 eröffnet. Während der Besetzung wollte der preußische General Blücher ihn zerstören; ihm wurde vorübergehend der Name Pont de l'École militaire gegeben, der Name Pont d'Iéna kehrte unter Louis-Philippe zurück."],"terms":[{"fr":"Exposition universelle","de":"Weltausstellung","ety":"Von lat. exponere, „ausstellen“, und universalis, „allgemein“."}],"kids":["Der Name Trocadéro stammt von einem Fort bei Cádiz in Spanien, das Frankreich 1823 eroberte.","Die Ausstellung von 1937 zählte rund 31 Millionen Besucher aus 45 teilnehmenden Ländern.","Auf der Ausstellung 1937 hing Picassos Bild „Guernica“ im spanischen Pavillon.","Vom alten Palast von 1878 blieben nach dem Abriss 1935 nur die beiden Seitenflügel erhalten."],"quiz":[{"q":"Wo wurde am 10. Dezember 1948 die Allgemeine Erklärung der Menschenrechte beschlossen?","a":"Im Palais de Chaillot, von der UN-Generalversammlung."},{"q":"Woher hat das Trocadéro seinen Namen?","a":"Von einem Fort bei Cádiz in Spanien, das Frankreich 1823 einnahm."}],"sources":[{"title":"Wikipedia (fr): Palais du Trocadéro","url":"https://fr.wikipedia.org/wiki/Palais_du_Trocadéro"},{"title":"Wikipedia (en): Palais de Chaillot","url":"https://en.wikipedia.org/wiki/Palais_de_Chaillot"},{"title":"Wikipedia (en): Exposition Internationale des Arts et Techniques dans la Vie Moderne (1937)","url":"https://en.wikipedia.org/wiki/Exposition_Internationale_des_Arts_et_Techniques_dans_la_Vie_Moderne"},{"title":"Wikipedia (en): Pont d'Iéna","url":"https://en.wikipedia.org/wiki/Pont_d%27I%C3%A9na"}]}},{"t":"11:45","name":"Eiffelturm (Aufstieg optional)","q":"Tour Eiffel Paris","mode":"zu Fuß (10 Min.)","hook":"Treppen oder Aufzug, 2. Etage oder Spitze?","info":"Der Turm war in der Woche vom 7. bis 12. Oktober täglich 9:30–23:00 Uhr geöffnet (laut offizieller Seite), Zeiten können sich ändern. Der Treppenaufstieg zur 2. Etage erfordert nach der offiziellen Seite eine Reservierung. Wer nicht hinauf möchte, genießt ihn vom Champ de Mars aus. Abends funkelt er zu jeder vollen Stunde etwa fünf Minuten.","tip":"Tickets nur auf der offiziellen Seite kaufen und das Zeitfenster vorher buchen.","cost":"2. Etage Treppe: Erw. 14,80 €, 12–24 J. 7,40 €. 2. Etage Aufzug: 23,50 € / 11,80 €. Spitze (Treppe+Aufzug): 28 € / 14 €. Spitze (Aufzug): 36,70 € / 18,40 €.","deep":{"lage":"Champ de Mars, 7. Arrondissement (linkes Seine-Ufer)","history":["Gustave Eiffel (1832–1923), geboren in Dijon, Bauunternehmer, hatte mit seiner Firma Eiffel et Cie (gegründet 1868) bereits die Maria-Pia-Brücke (1877) und das Viadukt von Garabit (1884) gebaut und das Innengerüst der Freiheitsstatue entworfen. Die Idee eines 300 m hohen Eisenturms hatten 1884 die Ingenieure Maurice Koechlin und Émile Nouguier; Eiffel meldete am 18. September 1884 ein Patent an, der Architekt Stephen Sauvestre ergänzte die Gestaltung. Für den Wettbewerb zur Weltausstellung 1889 gingen 107 Entwürfe ein; die Bedingungen wurden im Mai 1886 so geändert, dass sie Eiffels Entwurf begünstigten.","Die Fundamente begannen im Januar 1887, fertig war der Turm am 31. März 1889, nach zwei Jahren, zwei Monaten und fünf Tagen. Die 18.038 Eisenteile entstanden nach 5.300 Werkstattzeichnungen weitgehend im Werk in Levallois-Perret, 150 Arbeiter dort, 150 bis 300 auf der Baustelle. Von 2,5 Millionen Nieten wurde nur ein Drittel vor Ort gesetzt, ein Niet brauchte eine Vierergruppe. Das Tragwerk wiegt 7.300 t Puddeleisen.","Am 14. Februar 1887 erschien in „Le Temps“ eine „Protestation contre la Tour de M. Eiffel“, unterzeichnet unter anderem von Gounod, Maupassant, Garnier und Dumas dem Jüngeren. Die Kritik verebbte nach der Fertigstellung angesichts des Publikumserfolgs: Rund zwei Millionen Besucher kamen während der Ausstellung.","Eiffel durfte den Turm vom 1. Januar 1890 bis 31. Dezember 1909 kommerziell nutzen; danach hätte er abgebaut werden können. Dass dies unterblieb, hing mit dem Nutzen für die Funktechnik zusammen: Eiffel hatte 1903 Gustave Ferriés Versuche zur drahtlosen Telegrafie finanziert, 1910 wurde das Nutzungsrecht um 70 Jahre verlängert. Im Ersten Weltkrieg diente die Station auch dem Abhören gegnerischer Funksprüche.","Eigentümerin ist die Stadt Paris; den Betrieb führt die Société d'exploitation de la tour Eiffel (SETE), nach Quellenstand mit 60 % städtischem Anteil. Den Panama-Skandal überstand Eiffel nur beschädigt: 1893 in erster Instanz verurteilt, in der Berufung freigesprochen, zog er sich aus dem Geschäft zurück. Heute misst der Turm mit Antennen 330 m; bis 1930, der Fertigstellung des Chrysler Building, war er das höchste Bauwerk der Welt."],"terms":[{"fr":"TSF (télégraphie sans fil)","de":"drahtlose Telegrafie","ety":"Von grch. tēle, „fern“, und gráphein, „schreiben“, mit fr. sans fil, „ohne Draht“."}],"kids":["Der Turm war bei Fertigstellung 300 m hoch, mit den heutigen Antennen sind es 330 m.","Er besteht aus 18.038 Eisenteilen, die mit 2,5 Millionen Nieten verbunden sind.","Die Bauzeit betrug nur 2 Jahre, 2 Monate und 5 Tage
