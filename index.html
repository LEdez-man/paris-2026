anlässlich der Verbindung Ludwigs XIII. mit Anna von Österreich. Jede Seite hat neun Pavillons aus Backstein und Stein, zusammen 36, mit Arkaden im Erdgeschoss.","Das Marais, ein seit dem frühen 12. Jahrhundert entwässertes Sumpfgebiet, wurde im 17. Jahrhundert zum Viertel von Adel und wohlhabendem Bürgertum, die hôtels particuliers bauten. Ab Mitte des 18. Jahrhunderts zog die Elite in die Faubourgs Saint-Honoré und Saint-Germain; nach der Revolution richteten Handwerker und Kleinhändler Werkstätten in den Höfen ein. 1964 wurde das Marais auf Betreiben André Malraux’ erstes secteur sauvegardé.","Die Umbenennungen spiegeln die Politik: 1792 place des Fédérés, 1793 place de l’Indivisibilité, 1800 per Konsulatsdekret place des Vosges, nach dem Département Vosges, das als erstes die Revolutionssteuer zahlte. 1814–1830 und 1852–1870 hieß er wieder Place Royale.","Victor Hugo (1802–1885) mietete von 1832 bis 1848 eine Wohnung im zweiten Stock des Hôtel de Rohan-Guéménie, Place Royale Nr. 6. Hier entstanden unter anderem Ruy Blas, Marie Tudor und Les Chants du crépuscule; am 17. November 1845, nach seiner Ernennung zum Pair de France, begann er die erste Fassung der Misérables (damals Les Misères) und arbeitete daran bis zur Februarrevolution 1848. Auf eine Schenkung Paul Meurices hin richtete die Stadt Paris hier ein Museum ein (nach den Quellen seit 1902)."],"terms":[{"fr":"hôtel particulier","de":"Stadtpalais","ety":"hôtel kommt über altfranzösisch hostel aus lateinisch hospitale (Gästeraum), particulier bedeutet hier privat im Gegensatz zu öffentlich."},{"fr":"secteur sauvegardé","de":"Denkmalschutzbereich","ety":"sauvegarde (Schutz) setzt sich aus sauf (unversehrt) und garde (Obhut) zusammen."}],"kids":["Der Platz hat 36 Pavillons, je neun pro Seite, und jede Seite ist rund 140 m lang.","Seinen Namen erhielt er 1800 vom Département Vosges, das als erstes die Revolutionssteuer zahlte.","Heinrich II. starb 1559 an den Folgen eines Turnierunfalls ganz in der Nähe, danach wurde sein Palast aufgeteilt.","Victor Hugo lebte 16 Jahre lang hier, von 1832 bis 1848, und begann in der Wohnung die erste Fassung der Misérables."],"quiz":[{"q":"Warum heißt der Platz Place des Vosges?","a":"Nach dem Département Vosges, das 1800 als erstes die Revolutionssteuer gezahlt hatte."},{"q":"Wie viele Pavillons umgeben den Platz?","a":"36, nämlich neun an jeder der vier Seiten."},{"q":"In welchen Jahren wohnte Victor Hugo am Platz, und welcher Roman wurde dort begonnen?","a":"1832 bis 1848; die erste Fassung der Misérables (damals Les Misères) begann er 1845."}],"sources":[{"title":"Ville de Paris: La place des Vosges (Dokument)","url":"https://cdn.paris.fr/paris/2020/02/26/f518e2989d8970e2dc5d899968876a7c.pdf"},{"title":"Place des Vosges (Wikipedia, zur Orientierung und Gegenprüfung)","url":"https://fr.wikipedia.org/wiki/Place_des_Vosges"},{"title":"Maisons de Victor Hugo (Paris Musées): Visiter l’appartement","url":"https://www.maisonsvictorhugo.paris.fr/en/paris/museum/visit-apartment-today"},{"title":"Paris Musées Collections: Les Maisons de Victor Hugo Paris / Guernesey","url":"https://www.parismuseescollections.paris.fr/fr/les-maisons-de-victor-hugo-paris-guernesey"},{"title":"Le Marais, quartier parisien (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Le_Marais_(quartier_parisien)"}]}},{"t":"12:15","name":"Musée Carnavalet (Geschichte von Paris)","q":"Musee Carnavalet Paris","mode":"zu Fuß (5 Min.)","optional":true,"hook":"Wie sah Paris vor 2.000 Jahren aus?","info":"Das Museum erzählt die Geschichte der Stadt anhand von Möbeln, Modellen und Gemälden. Die Dauerausstellung ist nach Angaben der Stadt Paris kostenlos. Öffnungszeiten vorab auf carnavalet.paris.fr prüfen, wir konnten sie nicht verifizieren.","tip":"Mit Kindern genügt eine Stunde.","cost":"Dauerausstellung: kostenlos (bitte prüfen).","closedOn":["Mo"],"deep":{"lage":"Marais, 3. Arrondissement","history":["Das Hôtel Carnavalet wurde 1548–1560 für Jacques des Ligneris, Präsident des Pariser Parlement, gebaut und gehört zu den seltenen Renaissancebauten der Stadt; es wird Pierre Lescot zugeschrieben. 1578 erwarb es Françoise de la Baume, verheiratet mit dem Bretonen François de Kernevenoy; „Carnavalet“ ist eine Verformung dieses Namens. 1660 erhöhte François Mansart den Eingangsbau an der heutigen Rue de Sévigné und fügte zwei Flügel hinzu.","Madame de Sévigné (1626–1696), an der Place Royale geboren, wurde 1651 mit 25 Jahren Witwe, als ihr Mann Henri de Sévigné im Duell starb. Den größten Teil ihrer erhaltenen Briefe richtete sie an ihre Tochter, die 1669 den Comte de Grignan heiratete. Im September 1677 mietete sie das Hôtel und zog im Oktober ein; sie nannte es „La Carnavalette“ und teilte die Kosten mit ihrem Onkel, dem Abbé de Coulanges, ihrem Sohn und den Grignans während deren Paris-Aufenthalten. Das Ende ihres Aufenthalts wird in den Quellen mit 1694 oder 1696 angegeben; sie starb am 17. April 1696 in Grignan. Die erste Briefausgabe erschien 1725.","1866 kaufte die Stadt Paris das Hôtel auf Anregung von Präfekt Haussmann, um die Geschichte der Hauptstadt zu zeigen. Frühere Sammlungen im Hôtel de Ville gingen nach Angaben der Sekundärliteratur beim Brand in der Kommune 1871 weitgehend verloren. Das Museum öffnete 1880; erster Direktor war Jules Cousin (1880–1895). Viele Revolutionsbestände stammen aus der Schenkung des Grafen de Liesville von 1880.","1989, zum Bicentenaire der Revolution, wurde das benachbarte Hôtel Le Peletier de Saint-Fargeau angegliedert, das Pierre Bullet 1688–1690 für Michel Le Peletier de Souzy (1640–1725) gebaut hatte. Das Museum besitzt nach eigenen Angaben die weltweit größte Sammlung zur Französischen Revolution. Mit dem Namen verbindet sich die Erinnerung an Louis-Michel Lepeletier de Saint-Fargeau, Abgeordneten des Konvents, der am 20. Januar 1793 im Palais-Royal ermordet wurde, nachdem er für den Tod des Königs gestimmt hatte.","Von Oktober 2016 bis 2021 war das Haus für eine umfassende Sanierung geschlossen. Seither führt ein chronologischer Rundgang von der Vorgeschichte bis zur Gegenwart. Rund 3.800 Werke sind ausgestellt; der Bestand umfasst mehr als 600.000 Werke, von denen sich etwa 10 % gleichzeitig zeigen lassen."],"terms":[{"fr":"Carnavalet","de":"Name des Hôtels","ety":"Verformung des bretonischen Familiennamens Kernevenoy, den der Eigentümer François de Kernevenoy trug."},{"fr":"La Carnavalette","de":"Das Kleine Carnavalet (Kosename)","ety":"Verkleinerungsform auf -ette zu Carnavalet, so nannte Madame de Sévigné das gemietete Hôtel."}],"kids":["Das Museum zeigt rund 3.800 Werke, besitzt aber mehr als 600.000, von denen sich nur etwa 10 % gleichzeitig ausstellen lassen.","Madame de Sévigné nannte das Hôtel „La Carnavalette“ und schrieb von hier viele Briefe an ihre Tochter.","Das Museum hat nach eigenen Angaben die weltweit größte Sammlung zur Französischen Revolution.","Das Haus wurde 1548–1560 gebaut, 1880 als Stadtmuseum eröffnet und war von Oktober 2016 bis 2021 für Umbauten geschlossen."],"quiz":[{"q":"Wie nannte Madame de Sévigné das Hôtel Carnavalet?","a":"„La Carnavalette“."},{"q":"Von welchem Namen wurde „Carnavalet“ abgeleitet?","a":"Vom bretonischen Namen Kernevenoy."},{"q":"Welcher Präfekt regte 1866 den Kauf des Hôtels für die Stadt an?","a":"Georges-Eugène Haussmann."}],"sources":[{"title":"Musée Carnavalet: History (Hôtel und Museum)","url":"https://www.carnavalet.paris.fr/en/museum/history"},{"title":"Musée Carnavalet: Dossier pédagogique Madame de Sévigné. Lettres parisiennes (2026)","url":"https://www.carnavalet.paris.fr/sites/default/files/2026-04/Dossier%20p%C3%A9dagogique_V2d%C3%A9f.pdf"},{"title":"Musée Carnavalet: La rénovation du musée Carnavalet (Dossier de presse)","url":"https://www.carnavalet.paris.fr/sites/default/files/2021-01/dp_renovation_carnavalet.pdf"},{"title":"Paris Parcours Révolution: The Carnavalet Museum","url":"https://parcoursrevolution.paris.fr/en/points-of-interest/9-the-carnavalet-museum"},{"title":"Musée Carnavalet (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Musée_Carnavalet"}]}},{"t":"13:30","name":"Mittag in der Rue des Rosiers","q":"Rue des Rosiers Paris","mode":"zu Fuß (10 Min.)","hook":"Falafel oder Crêpes?","info":"Die Rue des Rosiers ist das Zentrum des jüdischen Viertels (Pletzl) mit Falafel, Bäckereien und kleinen Läden. Ein schneller und günstiger Mittagsimbiss.","tip":"Am Samstag haben einige jüdische Geschäfte wegen Schabbat geschlossen, Falafel gibt es aber meist.","deep":{"lage":"Marais (Pletzl), 4. Arrondissement","history":["Der Straßenname geht nach Jacques Hillairet auf Rosenstöcke in den angrenzenden Gärten zurück und ist seit 1230/1233 belegt. Die Straße wurde damals fast vollständig entlang der Stadtmauer Philipp Augusts angelegt; Reste der Mauer stehen im Jardin des Rosiers–Joseph-Migneret (Zugang über Nr. 10). Die heutige Rue Ferdinand-Duval trug seit dem 15. Jahrhundert den Namen Rue des Juifs und wurde 1900 umbenannt. Jüdisches Leben in Paris wurde durch die Vertreibungen von 1306 (Philipp IV.) und 1394 (Karl VI.) unterbrochen.","Ab 1881 kamen Aschkenasim, die vor Verfolgung in Russland, Rumänien und Österreich-Ungarn flohen; bis 1914 ließen sich rund 20.000 Menschen im Viertel nieder. Die Bewohner nannten es Pletzl, jiddisch „kleiner Platz“ (Nancy Green, The Pletzl of Paris). Zwischen den Weltkriegen war die Straße überwiegend jiddischsprachig. Von 90 Akten zur „Arisierung“ betrafen 38 Lebensmittelgeschäfte; im Dezember 1932 gab es acht koschere Metzgereien. Der 1855 gegründete Fourneau économique gab zwischen den Kriegen im Schnitt über 800 koschere Mahlzeiten täglich aus. Daneben arbeiteten Schneider, Schuster und Mützenmacher. 1936 galten nach den Akten der Besatzungszeit 568 von 1.360 Bewohnern als jüdisch (41,8 %).","Unter der deutschen Besatzung wurden Geschäfte „arisiert“; am 14. Mai 1941 wurden rund 21 Männer aus der Straße, meist polnische Staatsangehörige, in Lagern im Loiret interniert. Bei der Rafle du Vel d’Hiv am 16. und 17. Juli 1942 nahm die Pariser Polizeipräfektur auf Initiative der deutschen Behörden in Paris und Umgebung 12.884 Menschen fest, mehr als 4.500 Polizisten waren beteiligt. Familien (8.160 Personen, darunter 4.115 Kinder) wurden im Vélodrome d’Hiver festgehalten, dann in die Lager Pithiviers und Beaune-la-Rolande gebracht und nach Auschwitz-Birkenau deportiert; rund 3.000 Kinder wurden zunächst von den Eltern getrennt.","Aus der Rue des Rosiers kamen 43 Personen in die Loiret-Lager; mindestens 225 Deportierte sind für die Straße dokumentiert, die Liste gilt als unvollständig. Nach 1944 öffneten einzelne Geschäfte wieder, neue Händler kamen hinzu. Später zogen Einwanderer aus Nordafrika zu; heute prägen Synagogen, Metzgereien, Delikatessen und Falafel-Stände das Bild. 1982 tötete ein Anschlag auf das Restaurant Goldenberg (Nr. 7) sechs Menschen und verletzte 22. Im Marais erinnert das Mémorial de la Shoah an die Opfer."],"terms":[{"fr":"Pletzl","de":"kleiner Platz (Name des jüdischen Viertels)","ety":"Jiddisch, Verkleinerungsform zu plats (Platz), das aus mittelhochdeutsch platz entlehnt ist."},{"fr":"Vél d’Hiv","de":"Winter-Radrennbahn","ety":"Kurzform von Vélodrome d’Hiver; vélodrome setzt sich aus vélo (Kurzform von vélocipède) und griechisch dromos (Lauf) zusammen."}],"kids":["Pletzl heißt auf Jiddisch „kleiner Platz“, so nannten die Bewohner ihr Viertel.","Der Name Rue des Rosiers ist seit etwa 1230 belegt und geht auf Rosenstöcke in Gärten zurück.","Im Jardin des Rosiers hinter Nr. 10 stehen noch Steine der Stadtmauer von Philipp August.","Der 1855 gegründete Fourneau économique gab zwischen den Weltkriegen im Schnitt über 800 koschere Mahlzeiten pro Tag aus."],"quiz":[{"q":"Was bedeutet Pletzl?","a":"Auf Jiddisch „kleiner Platz“, der Name für das jüdische Viertel im Marais."},{"q":"Welche mittelalterliche Anlage lässt sich in der Straße noch an Mauerresten erkennen?","a":"Die Stadtmauer Philipp Augusts, im Jardin des Rosiers–Joseph-Migneret."},{"q":"Wie viele Menschen wurden am 16. und 17. Juli 1942 in Paris und Umgebung festgenommen?","a":"12.884."}],"sources":[{"title":"Rue des Rosiers (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Rue_des_Rosiers_(Paris)"},{"title":"Jean Laloum: Au cœur du Pletzl, la rue des Rosiers (PDF)","url":"https://convoisduloiret.org/wp-content/uploads/2025/06/AU-COEUR-DU-PLETZL-LA-RUE-DES-ROSIERS-par-Jean-Laloum.pdf"},{"title":"Mémorial de la Shoah: 16 et 17 juillet 1942, la rafle du Vel d’Hiv","url":"https://www.memorialdelashoah.org/en/16-et-17-juillet-1942-la-rafle-du-vel-dhiv.html"},{"title":"Pletzl (Wikipedia, zur Orientierung)","url":"https://en.wikipedia.org/wiki/Pletzl"},{"title":"Nancy Green: Les Travailleurs immigrés juifs à la Belle Époque. Le „Pletzl“ de Paris (Fayard, 1985)"}]}},{"t":"15:30","name":"Gedeckte Passagen (Galerie Vivienne, Passage Jouffroy)","q":"Galerie Vivienne Paris","mode":"Metro (Google Maps)","hook":"Wo gab es vor den Kaufhäusern die Shoppingmeilen?","info":"Die „Passages couverts“ sind Einkaufsstraßen mit Glasdach aus dem frühen 19. Jahrhundert. Die Galerie Vivienne hat ein Mosaik und kleine Läden, im Passage Jouffroy findet ihr Spielzeug- und Antiquitätenläden. Praktisch bei Regen.","tip":"Das Wachsfigurenkabinett Musée Grévin liegt in der Nähe (Preis und Öffnungszeiten vorab prüfen).","deep":{"lage":"Galerie Vivienne im 2., Passage Jouffroy im 9. Arrondissement","history":["Die älteste Pariser Passage, die Passage des Panoramas, entstand 1799. Der amerikanische Reeder James William Thayer kaufte das Hôtel de Montmorency-Luxembourg und ließ einen Durchgang schlagen, zunächst, um seine Panorama-Rotunden zu erreichen und Besucher vor Regen und Schlamm zu schützen. Der Name geht auf zwei Rotunden von 17 m Durchmesser zurück, die 1831 abgerissen wurden. 1816 gab es dort einen ersten Versuch mit Gasbeleuchtung (genannt wird Philippe Lebon). Ursprünglich zählte die Passage über sechzig Läden.","Die Galerie Vivienne ließ der Notar Louis-Auguste Marchoux 1823 auf seinem Grundstück an der Rue Vivienne nach Plänen von François-Jacques Delannoy bauen; 1825 erhielt sie den heutigen Namen. Sie ist 176 m lang und 3 m breit und liegt zwischen dem Palais-Royal, der Börse und den Grands Boulevards. Der Boden zeigt ein Mosaik im pompejanischen Stil. 1828 zog das Cosmorama aus den Holzgalerien des Palais-Royal ein; die Konkurrenz kam bald mit der Galerie Colbert. Unter dem Zweiten Kaiserreich ging die Galerie zurück und war mehrfach vom Abriss bedroht; 1986 belebten Boutiquen von Jean-Paul Gaultier und Yuki Torii sie neu.","Die Passage Jouffroy wurde ab 1845 als Verlängerung der Passage des Panoramas jenseits des Boulevard Montmartre gebaut, benannt nach dem Grundbesitzer Félix de Jouffroy-Gonsans (1791–1863). Sie gilt als erste Pariser Passage ganz aus Metall und Glas und als erste mit Fußbodenheizung; sie ist rund 140 m lang. Anfang der 1880er Jahre entstand daneben das Wachsfigurenkabinett des Musée Grévin, dessen Ausgang in der Passage liegt. 1912 war die Passage fast abgerissen worden; 1974 wurde sie als Monument historique geschützt.","Im Zweiten Kaiserreich gab es bis zu 150 Passagen, heute etwa dreißig. Die Boulevarddurchbrüche schnitten sie an; die Passage Brady wurde 1854 vom Boulevard de Strasbourg zerteilt. Zugleich entstanden Kaufhäuser mit festen Preisen: Le Bon Marché 1852 (1869 von Gustave Eiffel erweitert), Printemps 1865, La Samaritaine 1870.","Walter Benjamin (1892–1940) arbeitete von 1927 bis zu seinem Tod am Passagen-Werk, dessen Exposés „Paris, die Hauptstadt des XIX. Jahrhunderts“ heißen. 1940 vertraute er das Material Georges Bataille an, der es in der Bibliothèque nationale versteckte; veröffentlicht wurde es erst 1982 bei Suhrkamp."],"terms":[{"fr":"passage couvert","de":"gedeckte Passage","ety":"passage ist das Substantiv zu passer (durchqueren, gehen); couvert bedeutet überdacht, vom Verb couvrir."},{"fr":"cosmorama","de":"Schaustellung von Ansichten ferner Orte","ety":"Gebildet aus griechisch kosmos (Welt) und horama (Anblick) nach dem Muster von panorama."}],"kids":["Die Galerie Vivienne ist 176 m lang, aber nur 3 m breit.","Die Passage Jouffroy war die erste Pariser Passage ganz aus Metall und Glas und die erste mit Fußbodenheizung.","Die Passage des Panoramas von 1799 ist die älteste Passage von Paris; 1816 wurde dort erstmals Gasbeleuchtung ausprobiert.","Im Zweiten Kaiserreich gab es bis zu 150 Passagen, heute noch etwa dreißig."],"quiz":[{"q":"Welche Passage ist die älteste von Paris?","a":"Die Passage des Panoramas, 1799."},{"q":"Wie heißt der Notar, der die Galerie Vivienne 1823 bauen ließ?","a":"Louis-Auguste Marchoux."},{"q":"Was war an der Passage Jouffroy technisch neu?","a":"Sie war die erste Pariser Passage ganz aus Metall und Glas und die erste mit Fußbodenheizung."}],"sources":[{"title":"Ville de Paris: Découvrez la magie des galeries et des passages","url":"https://www.paris.fr/pages/decouvrez-la-magie-des-galeries-et-des-passages-18889"},{"title":"Passage des Panoramas (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Passage_des_Panoramas"},{"title":"Galerie Vivienne (Wikipedia, mit Verweis auf die Base Mérimée PA00086024)","url":"https://fr.wikipedia.org/wiki/Galerie_Vivienne"},{"title":"Passage Jouffroy (Wikipedia, mit Verweis auf die Base Mérimée PA00088996)","url":"https://fr.wikipedia.org/wiki/Passage_Jouffroy"},{"title":"Fondation Napoléon: Les grands magasins sous le Second Empire","url":"https://www.napoleon.org/histoire-des-2-empires/articles/les-grands-magasins-sous-le-second-empire"},{"title":"Walter Benjamin: Das Passagen-Werk, hg. von Rolf Tiedemann (Gesammelte Schriften V, Suhrkamp 1982)"}]}},{"t":"17:30","name":"Abschied in Montmartre","q":"Place du Tertre Paris","mode":"Metro 12 / zu Fuß","hook":"Ein letzter Abend auf dem Hügel.","info":"Für den Abschied passt der Place du Tertre mit den Malern, das Clos Montmartre mit Weinreben und Le Lapin Agile. Danach ein gutes Abendessen, ganz ohne Eile.","tip":"Die Rückreise ist morgen früh, Koffer heute Abend packen.","deep":{"lage":"Butte Montmartre, 18. Arrondissement","history":["Montmartre war eine eigene Gemeinde. Das königliche Frauenkloster der Dames de Montmartre wurde 1133/34 von Ludwig VI. gegründet, 1794 wurde sein Besitz als Nationalgut verkauft; in der Revolution hieß der Ort kurz „Mont-Marat“. 1856 hatte die Gemeinde 36.450 Einwohner. 1860 wurde sie nach Paris eingemeindet, der größte Teil bildet den 18. Arrondissement.","Am 18. März 1871 begann hier die Pariser Kommune. Auf der Butte standen 171 Kanonen, von der Nationalgarde vor dem deutschen Heer in Sicherheit gebracht und aus Spenden der Pariser bezahlt. Nachdem Thiers am 17. März beschlossen hatte, sie zu beschlagnahmen, rückten morgens gegen 5 Uhr etwa 6.000 Soldaten unter General Lecomte an. Frauen aus Montmartre umringten sie und boten Brot und Milch an; die Truppen weigerten sich, auf die Menge zu schießen, und verbrüderten sich. Lecomte und General Clément-Thomas wurden von Soldaten erschossen. Thiers ging nach Versailles, am 26. März wurde gewählt. Die Kommune endete in der Semaine sanglante vom 21. bis 28. Mai; etwa 43.000 Menschen wurden festgenommen, 25 der 95 Todesurteile vollstreckt, rund 3.800 nach Neukaledonien deportiert (darunter Louise Michel).","Die Künstlerkolonie wuchs um das Bateau-Lavoir am Place Émile-Goudeau 13: Eine Klaviermanufaktur wurde 1889 in Ateliers umgebaut, 1892 zog Maxime Maufra ein. Das Haus hatte etwa 25 Mieter und eine Wasserstelle, daher Max Jacobs ironischer Name „Lavoir“ (Waschhaus). Picasso lebte hier 1904–1909 und behielt das Atelier bis 1912; 1907 wurde hier Les Demoiselles d’Avignon gezeigt. Nach dem Ersten Weltkrieg verlagerte sich die Szene nach Montparnasse. 1970 zerstörte ein Brand fast das ganze Haus, 1978 wurde es nach Plänen von Claude Charpentier in Beton nachgebaut.","Der Clos Montmartre geht auf Reben der Abtei im 12. Jahrhundert zurück; die Bebauung ließ ihn 1928 verschwinden, 1933 wurden an der Rue des Saules neue Reben gepflanzt. Seit 1934 findet die Fête des Vendanges statt, damals von der Commune Libre de Montmartre als „Fête du Raisin“ begonnen. Sie ist üblicherweise am zweiten Oktoberwochenende; die Ausgabe 2026 läuft vom 7. bis 11. Oktober, ist also vor dem geplanten Besuch am 17. Oktober beendet. Der Erlös der Cuvée fließt über COFAS in soziale Projekte des Arrondissements."],"terms":[{"fr":"clos","de":"umfriedeter Weingarten","ety":"Von lateinisch clausum (das Eingeschlossene, vom Verb claudere, schließen)."},{"fr":"bateau-lavoir","de":"Waschschiff","ety":"lavoir (Waschhaus) gehört zu laver (waschen) aus lateinisch lavare; bateau-lavoir bezeichnete ursprünglich ein Waschschiff auf der Seine."}],"kids":["Am 18. März 1871 standen 171 Kanonen auf der Butte Montmartre, bezahlt aus Spenden der Pariser.","Montmartre wurde erst 1860 ein Teil von Paris.","Im Bateau-Lavoir hatten etwa 25 Mieter eine einzige Wasserstelle, daher der Spitzname „Waschhaus“.","Der Clos Montmartre wurde 1933 neu gepflanzt, die Fête des Vendanges gibt es seit 1934."],"quiz":[{"q":"In welchem Jahr wurde Montmartre Teil von Paris?","a":"1860."},{"q":"Wie viele Kanonen standen am 18. März 1871 auf der Butte Montmartre?","a":"171."},{"q":"Welcher Künstler lebte von 1904 bis 1909 im Bateau-Lavoir?","a":"Pablo Picasso."}],"sources":[{"title":"Montmartre (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Montmartre"},{"title":"Parcours Commune 1871: The cannons of 18 March","url":"https://parcours.commune1871.org/en/communard-montmartre/the-cannons-of-18-march/"},{"title":"Ville de Paris: Les 150 ans de la Commune, la fin sanglante et les conséquences","url":"https://www.paris.fr/pages/les-150-ans-de-la-commune-la-fin-sanglante-et-les-consequences-5-5-17210"},{"title":"Bateau-Lavoir (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Bateau-Lavoir"},{"title":"Fête des Vendanges de Montmartre (festivalenfrance.com)","url":"https://www.festivalenfrance.com/festival/fete-des-vendanges-de-montmartre"}]}}],"kids":"Jeder wählt ein Souvenir bis maximal 10 Euro und erklärt, warum.","fallbackLabel":"Alternative","fallback":"Giverny mit dem Auto (ca. 1 Std. 15): Monets Haus und Garten, täglich 10:00–18:00 geöffnet bis 1. November. Erw. 13 €, Kinder ab 7 J. 7 €, unter 7 J. frei.","legs":[{"from":"Wohnung","to":"Place des Vosges","m":4682,"rec":"metro","mixM":655,"metroMin":40,"via":"Abbesses (Metro 12), Concorde umsteigen, Saint-Paul (Metro 1)","metro":"Abbesses (305 m), Metro 12 bis Concorde (7 Stationen), umsteigen in Metro 1 Richtung Château de Vincennes bis Saint-Paul (6 Stationen), dann ca. 350 m.","min":62},{"from":"Place des Vosges","to":"Musée Carnavalet","m":347,"rec":"walk","mixM":347,"min":5},{"from":"Musée Carnavalet","to":"Rue des Rosiers","m":320,"rec":"walk","mixM":320,"min":4},{"from":"Rue des Rosiers","to":"Galerie Vivienne","m":2018,"rec":"walk","mixM":2018,"metroMin":21,"metro":"Metro spart nur etwa 6 Minuten: Saint-Paul (300 m), Metro 1 bis Palais Royal–Musée du Louvre (4 Stationen), dann ca. 450 m. Zu Fuß geht es durch die Altstadt.","min":27},{"from":"Galerie Vivienne","to":"Place du Tertre","m":2595,"rec":"either","mixM":2595,"metroMin":37,"metro":"Metro spart keine Zeit, aber Kraft am Hang: Bourse (ca. 300 m), Metro 3 bis Saint-Lazare (4 Stationen), umsteigen in Metro 12 bis Abbesses (5 Stationen), dann ca. 700 m bergauf.","min":35},{"from":"Place du Tertre","to":"Wohnung","m":468,"rec":"walk","mixM":468,"min":6}]},{"id":"p7","badge":{"label":"Ab","kind":"travel","bg":"#546E7A","fg":"#FFFFFF","sym":"🧳"},"tag":"Abreise","date":"2026-10-18","short":"So 18.10.","name":"Abreise","title":"Sonntagvormittag: Abreise","line":{"label":"A","kind":"road","caption":"Auto, ab Vormittag"},"lead":"Gemütliches Frühstück, Wohnung übergeben, Auto aus dem Parkhaus und auf die Heimreise.","sunset":"18:55","stops":[{"t":"08:30","name":"Frühstück in einer Boulangerie","q":"Boulangerie Rue des Abbesses Paris","mode":"zu Fuß","hook":"Croissant, Pain au chocolat, Baguette.","info":"Sonntagsmorgens sind viele Bäckereien in Montmartre geöffnet. Ein letztes französisches Frühstück.","tip":"Bargeld oder Karte griffbereit.","deep":{"lage":"Montmartre, 18. Arrondissement","history":["Das Wort baguette bedeutet „Stab, Stöckchen“; es stammt aus dem Italienischen bacchetta und geht wahrscheinlich auf lateinisch baculum zurück. Als Brotname ist es erst im 20. Jahrhundert belegt (Patentschriften ab 1902, allgemein um 1920); zuvor sprach man von der flûte. Lange Brote gab es nach Angaben des Kulturministeriums schon im 17. Jahrhundert. Zur Entstehung kursieren Legenden (Napoleons Soldaten, Metro-Baustellen, der Wiener Bäcker August Zang 1839); Eine wissenschaftliche Studie zur Geschichte der Baguette gibt es nicht.","Das Bäckerhandwerk war im Ancien Régime in einer Korporation organisiert, die Praxis, Preise und Steuern wurden kontrolliert; bis zur Revolution bestand vielerorts Zwang zur Nutzung des herrschaftlichen Backofens (four banal). Vor und während der Revolution standen Bäcker im Verdacht, mit Mehlpreisen zu spekulieren; am 21. Oktober 1789 wurde ein Bäcker gelyncht. Steven L. Kaplan hat in Le meilleur pain du monde die Pariser Bäcker des 18. Jahrhunderts untersucht. 1801 versuchte die Verwaltung, die Zahl der Bäckereien zu verringern und die Brotpreise streng zu regeln.","Ein Gesetz von 1919, das ab 1920 Arbeit vor 4 Uhr morgens verbot, wird häufig mit dem Aufstieg der Baguette verbunden: Sie braucht weniger Gärzeit und Backzeit als große Laibe. Diese Erklärung gilt allerdings als nicht gesichert. Belegt ist, dass die Präfektur der Seine im August 1920 Größe und Preis des Brotes regelte. Kaplan sieht die Baguette als Antwort des 20. Jahrhunderts auf den städtischen Wunsch nach frischerem, kleinerem Brot.","Das Décret 93-1074 von 1993 definiert das „pain de tradition française“: Mehl, Wasser, Salz und Hefe oder Sauerteig, keine Zusatzstoffe, keine Tiefkühlung, Kneten, Formen und Backen im Betrieb. Anlass waren Aufbackstationen mit tiefgekühltem Teig. 1997 wurde die Bezeichnung boulangerie Betrieben vorbehalten, die Teig selbst herstellen und am Verkaufsort backen; 1998 folgte ein Gesetz, 2016 die Aufnahme in den Code de la consommation.","Im November 2022 nahm die UNESCO „Artisanal know-how and culture of baguette bread“ in die Repräsentative Liste des immateriellen Kulturerbes auf. Eine Standardbaguette misst etwa 65 cm bei 250 g; in Frankreich werden täglich rund 30 Millionen gegessen."],"terms":[{"fr":"baguette","de":"Stab, Stöckchen; langes Weißbrot","ety":"Aus italienisch bacchetta, wahrscheinlich zu lateinisch baculum (Stock)."},{"fr":"four banal","de":"herrschaftlicher Backofen mit Benutzungszwang","ety":"banal gehört zu ban (Gebot, Herrschaftsrecht) aus fränkisch *ban."},{"fr":"pain de tradition française","de":"Brot nach französischer Tradition (geschützte Bezeichnung)","ety":"pain aus lateinisch panis (Brot), tradition aus lateinisch traditio (Übergabe, Überlieferung)."}],"kids":["Eine Standardbaguette ist etwa 65 cm lang und wiegt rund 250 g.","In Frankreich werden täglich rund 30 Millionen Baguettes gegessen.","Baguette heißt wörtlich „Stäbchen“ oder „kleiner Stock“.","Eine Baguette de tradition darf nur Mehl, Wasser, Salz und Hefe oder Sauerteig enthalten, seit dem Dekret von 1993."],"quiz":[{"q":"Welche vier Zutaten enthält eine Baguette de tradition?","a":"Mehl, Wasser, Salz und Hefe oder Sauerteig."},{"q":"Was bedeutet das Wort baguette wörtlich?","a":"Stab oder Stöckchen."},{"q":"Was verbot das Gesetz von 1919 den Bäckern, und warum wird es mit der Baguette in Verbindung gebracht?","a":"Arbeit vor 4 Uhr morgens; die Baguette braucht weniger Gärzeit und Backzeit als große Laibe (ob das wirklich der Anlass war, ist aber nicht gesichert)."}],"sources":[{"title":"Baguette (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Baguette_(pain)"},{"title":"Boulangerie (Wikipedia, zur Orientierung)","url":"https://fr.wikipedia.org/wiki/Boulangerie"},{"title":"Sortiraparis: La baguette, l’histoire de ce pain parisien","url":"https://www.sortiraparis.com/hotel-restaurant/tendances-food/articles/330833-histoire-baguette-tradition-parisienne-symbole-francais-national"},{"title":"Ministère de la Culture: Inscription of artisanal know-how and the culture of the bread stick on the Representative List","url":"https://www.culture.gouv.fr/en/press/press-releases/Inscription-of-artisanal-know-how-and-the-culture-of-the-bread-stick-on-the-Representative-List-of-the-intangible-cultural-heritage-of-humanity"},{"title":"Wiktionnaire: baguette","url":"https://fr.wiktionary.org/wiki/baguette"},{"title":"Steven L. Kaplan: Le meilleur pain du monde. Les boulangers de Paris au XVIIIe siècle (Fayard, 1996)"}]}},{"t":"09:30","name":"Wohnung übergeben, Parkhaus, Heimfahrt","q":"Paris Montmartre","mode":"Auto","hook":"Gute Fahrt!","info":"Wohnung übergeben, Auto aus dem Parkhaus holen und los. Vor der Abfahrt tanken und die Route prüfen.","tip":"Pausen unterwegs einplanen."}],"kids":"Wer hat die beste Erinnerung? Eine Runde am Frühstückstisch.","fallback":"","legs":[]}],"prep":[{"id":"navigo","text":"Navigo-Wochenkarte (Mo 12.–So 18.10.) für alle vier besorgen. Der Verkauf für die kommende Woche beginnt ab Freitag davor."},{"id":"kombi","text":"Verdun: Kombiticket Mémorial + Fort Douaumont online kaufen (Familienkarte 50 €)."},{"id":"sc","text":"Sainte-Chapelle: Zeitfenster buchen (Mo 12.10.). Kinder unter 26 mit EU-Wohnsitz frei, Ausweis mitnehmen."},{"id":"cat","text":"Katakomben: Zeitfenster online buchen (Do 15.10.). Erw. 31 €, Kinder 15 €."},{"id":"vers","text":"Versailles: Passport mit Zeitfenster für das Schloss buchen (Fr 16.10.)."},{"id":"orsay","text":"Musée d'Orsay: Tickets für die Eltern online (Mi 14.10.), Kinder unter 18 frei."},{"id":"eif","text":"Eiffelturm: nur bei Aufstieg, Ticket online mit Zeitfenster (Di 13.10.)."},{"id":"boot","text":"Seine-Rundfahrt: Abfahrtszeit für   function mapsLink(q) {

    var e = function (x) { return encodeURIComponent(x).replace(/%20/g, "+").replace(/'/g, "%27"); };

  }
  function icon(mode) {
    var m = (mode || "").toLowerCase();
    if (m.indexOf("auto") === 0) return "🚗";
    if (m.indexOf("metro") === 0 || m.indexOf("rer") === 0) return "🚇";
    if (m.indexOf("zu fuß") === 0) return "🚶";
    return "➡️";
  }
  function headline(d) {
    var parts = d.title.split(": ");
    return parts.length > 1 ? parts.slice(1).join(": ") : d.title;
  }
  function fmtDist(m) {
    if (m == null) return "";
    if (m >= 1000) return (m / 1000).toFixed(1).replace(".", ",") + " km";
    return (Math.round(m / 10) * 10) + " m";
  }
  function legTotals(d) {
    var all = 0, mix = 0;
    (d.legs || []).forEach(function (l) { all += l.m || 0; mix += l.mixM || 0; });
    return { all: all, mix: mix, minAll: Math.round(all / 75), minMix: Math.round(mix / 75) };
  }
  function legLines(d) {
    var L = [], legs = d.legs || [];
    if (!legs.length) return L;
    var t = legTotals(d), hasM = legs.some(function (l) { return l.rec === "metro"; });
    if (d.id === "p5") L.push("🦶 *Wege:* im Park und in Versailles ca. 5 km zu Fuß, dazu die Anfahrt.");

    legs.forEach(function (l) {
      if (l.rec === "metro") {
        L.push("🚇 " + l.from + " → " + l.to + ": " + l.via + ", ca. " + l.metroMin + " Min." + (l.m != null ? " statt " + l.min + " Min. zu Fuß" : " (Auto 50–70 Min.)"));
      } else if (l.rec === "either" && l.metro) {
        L.push("↔️ " + l.from + " → " + l.to + ": " + fmtDist(l.m) + " (" + l.min + " Min.) zu Fuß, Metro ca. " + l.metroMin + " Min.");
      }
    });
    return L;
  }
  function dayText(d, o) {
    o = o || {};
    var START = o.start || "Place des Abbesses, Paris";
    var L = [];
    L.push(d.badge.sym + " *" + d.short.toUpperCase() + " · " + headline(d) + "*");
    L.push("_" + d.lead + "_");
    if (d.leave) L.push("🚪 *Aufbruch frühestens " + d.leave + " Uhr* (vorher in Ruhe frühstücken)");
    L.push("");
    d.stops.forEach(function (s) {
      L.push("🕘 *" + s.t + "* · " + s.name + (s.optional ? " (optional)" : ""));
      L.push("_" + s.hook + "_");
      L.push(icon(s.mode) + " " + s.mode + " · 📍 " + mapsLink(s.q));
      L.push("");
    });
    var paris = ["p1", "p2", "p3", "p4", "p5", "p6"].indexOf(d.id) >= 0;
    if (paris) {
      L.push("🧭 Route ab Wohnung zum ersten Ziel: " + dirLink(START, d.stops[0].q));
      L.push("");
    }
    var wl = legLines(d);
    if (wl.length) { wl.forEach(function (x) { L.push(x); }); L.push(""); }
    if (d.kids) { L.push("🧒 *Aufgabe für die Kinder:* " + d.kids); }
    if (d.fallback) { L.push((d.fallbackLabel ? "🔀 *" + d.fallbackLabel + ":* " : "🌧️ *Bei Regen:* ") + d.fallback); }
    L.push("🌇 Sonnenuntergang: " + d.sunset + " Uhr");
    if (o.url) { L.push(""); L.push("🔗 Kurzinfos zum Aufklappen: " + o.url); }
    else if (o.placeholder) { L.push(""); L.push("🔗 Kurzinfos zum Aufklappen: " + o.placeholder); }
    return L.join("\n");
  }
  function overviewText(days, o) {
    o = o || {};
    var L = [];
    L.push("*🇫🇷 FAMILIENREISE VERDUN → PARIS*");
    L.push("_10.–18. Oktober 2026_");

    else if (o.placeholder) { L.push(""); L.push("🔗 Kurzinfos zum Aufklappen: " + o.placeholder); }
    return L.join("\n");
  }
  function ticketsText(prep, tarife) {
    var L = [];
    L.push("*✅ VORHER ERLEDIGEN*");
    prep.forEach(function (p) { L.push("☐ " + p.text); });
    L.push("");
    L.push("*🚇 NAHVERKEHR PARIS*");

    L.push("• Kauf: App Bonjour RATP aufs Smartphone oder Navigo Découverte (5 €, Passfoto).");
    return L.join("\n");
  }
  return { fmtDist: fmtDist, legTotals: legTotals, legLines: legLines, mapsLink: mapsLink, dirLink: dirLink, dayText: dayText, overviewText: overviewText, ticketsText: ticketsText, headline: headline };

  var paris=['p1','p2','p3','p4','p5','p6'].indexOf(d.id)>=0;
  var h='<section id="sec-'+d.id+'" hidden><div class="dayhead" style="--rb:'+d.badge.bg+'">'+rd(d,true,true)+'<div><p class="eyebrow">'+esc(d.short)+' · '+esc(d.tag)+' · '+esc(d.line.caption)+'</p><h2>'+esc(d.title)+'</h2></div></div>';
  h+='<p class="lead">'+esc(d.lead)+'</p><div class="chips">'+(d.leave?'<span class="chip mt">Aufbruch frühestens '+esc(d.leave)+' Uhr</span>':'')+'<span class="chip">Sonnenuntergang '+esc(d.sunset)+' Uhr</span></div>';
  h+='<div class="actions"><button class="btn primary" type="button" data-copy="'+d.id+'">Für WhatsApp kopieren</button>';
  if(paris) h+='<a class="btn" target="_blank" rel="noopener" data-route="'+d.id+'" href="#">Route zum ersten Ziel</a>';
  h+='<span class="toast" role="status" aria-live="polite"></span></div><div class="copybox" hidden><textarea readonly aria-label="Text zum Kopieren"></textarea></div>';
  h+='<div class="stops">'+d.stops.map(stopHtml).join('')+'</div>';
  if(d.legs&&d.legs.length) h+=legsHtml(d);
  if(d.kids) h+='<div class="box"><h3>Aufgabe für die Kinder</h3><p>'+esc(d.kids)+'</p></div>';
  if(d.fallback) h+='<div class="box note"><h3>'+esc(d.fallbackLabel||'Bei Regen')+'</h3><p>'+esc(d.fallback)+'</p></div>';
  if(d.id==='v1') h+=verdunExtra();
  var prev=D.days[i-1], next=D.days[i+1];
  h+='<div class="pager">'+(prev?'<button class="btn" type="button" data-go="'+prev.id+'">← '+esc(TABS[prev.id])+'</button>':'<button class="btn" type="button" data-go="ueberblick">← Überblick</button>')+(next?'<button class="btn" type="button" data-go="'+next.id+'">'+esc(TABS[next.id])+' →</button>':'')+'</div></section>';
  return h;
}
function overview(){
  var h='<section id="sec-ueberblick" hidden><p class="lead">Tippt auf einen Tag. Zu jeder Station gibt es zunächst nur eine Neugier-Frage. Die Kurzinfo klappt ihr auf, wenn ihr mehr wissen wollt.</p><p class="legend"><span><b>An</b> = Anreise</span><span><b>1 bis 6</b> = Pariser Tage, Mo bis Sa</span><span><b>Ab</b> = Abreise</span><span>Das kleine Symbol zeigt das Thema des Tages.</span></p><div class="plan">';
  D.days.forEach(function(d){ h+='<button type="button" data-go="'+d.id+'">'+rd(d,false,true)+'<span><b>'+esc(d.short)+' · '+esc(WA.headline(d))+'</b><small>'+esc(d.lead)+'</small></span></button>'; });
  h+='</div><div class="actions"><button class="btn primary" type="button" data-copy="overview">Überblick für WhatsApp kopieren</button><button class="btn" type="button" data-copy="tickets">Tickets und Nahverkehr kopieren</button><span class="toast" role="status" aria-live="polite"></span></div><div class="copybox" hidden><textarea readonly aria-label="Text zum Kopieren"></textarea></div>';
  h+='<div class="box"><h3>Vorher erledigen</h3>'+D.prep.map(function(p){return '<label class="check"><input type="checkbox" id="chk-'+p.id+'"><span>'+esc(p.text)+'</span></label>'}).join('')+'</div>';
  h+='<div class="box"><h3>Nahverkehr in Paris</h3><div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Preis</th><th>Hinweis</th></tr></thead><tbody>'+D.tarife.rows.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td class="num"><b>'+esc(r.preis)+'</b></td><td>'+esc(r.note)+'</td></tr>'}).join('')+'</tbody></table></div><p>'+esc(D.tarife.tipp)+'</p><p>'+esc(D.tarife.kauf)+'</p><p><b>'+esc(D.tarife.rechnung)+'</b></p></div>';
  h+='<div class="box"><h3>Haltestellen rund um die Wohnung</h3><div class="tablewrap"><table><thead><tr><th>Haltestelle</th><th>Linie</th><th>Fußweg</th></tr></thead><tbody>'+D.stations.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b>'+(s.note?'<br><small>'+esc(s.note)+'</small>':'')+'</td><td>'+esc(s.lines)+'</td><td class="num">'+WA.fmtDist(s.m)+'<br><small>'+Math.round(s.m/75)+' Min.</small></td></tr>'}).join('')+'</tbody></table></div><p>Faustregel: Unter 800 m geht ihr zu Fuß. Ab etwa 1,5 km oder mehr als 20 Gehminuten lohnt sich die Metro, bergauf und mit müden Kindern schon früher. Gemessen ab der Wohnung, die Haltestellenlage ist auf etwa 100 m genau.</p></div>';
  h+='<div class="box"><h3>Eure Startadresse für die Routen</h3><div class="field"><label for="startAddr">Unterkunft in Paris (bleibt nur in diesem Browser gespeichert)</label><input id="startAddr" type="text" autocomplete="off" placeholder="'+esc(D.START)+'"></div><p class="eyebrow" style="text-transform:none;letter-spacing:0">Ohne Eintrag starten die Routen am Place des Abbesses.</p></div>';
  h+='<div class="box"><h3>Quellen und Stand</h3><p>Preise, Öffnungszeiten und Ruhetage laut offiziellen Seiten, Stand 8. Oktober 2026. Mit „bitte prüfen“ markierte Angaben konnten nicht bestätigt werden.</p><ul class="plain src">'+D.sources.map(function(s){return '<li><a target="_blank" rel="noopener" href="'+s[1]+'">'+esc(s[0])+'</a></li>'}).join('')+'</ul></div></section>';
  return h;
}
main.innerHTML=overview()+D.days.map(daySection).join('');
nav.innerHTML=sections.map(function(s){return '<button class="tab" type="button" data-go="'+s.id+'">'+(s.day?rd(s.day):'')+esc(s.label)+'</button>'}).join('');

function show(id,push){
  if(!sections.some(function(s){return s.id===id})) id='ueberblick';
  main.querySelectorAll('section').forEach(function(el){el.hidden = el.id!=='sec-'+id});
  nav.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-current', b.getAttribute('data-go')===id ? 'true':'false'); if(b.getAttribute('data-go')===id){ try{b.scrollIntoView({inline:'center',block:'nearest'})}catch(e){} } });
  if(push){ try{ history.replaceState(null,'','#'+id) }catch(e){ try{location.hash=id}catch(_){} } }
  window.scrollTo(0,0);
}
function textFor(key){
  var o={start:startAddr(), url:pageUrl()};
  if(key==='overview') return WA.overviewText(D.days,o);
  if(key==='tickets') return WA.ticketsText(D.prep,D.tarife);
  var d=D.days.filter(function(x){return x.id===key})[0];
  return WA.dayText(d,o);
}
function copy(key,btn){
  var sec=btn.closest('section'), box=$('.copybox',sec), ta=$('textarea',box), toast=$('.toast',btn.parentNode), text=textFor(key);
  ta.value=text;
  function manual(){ box.hidden=false; ta.focus(); ta.select(); toast.textContent='Text markiert, bitte kopieren.'; }
  function ok(){ box.hidden=true; toast.textContent='Kopiert. In WhatsApp einfügen.'; setTimeout(function(){toast.textContent=''},3500); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,manual); }
    else manual();
  }catch(e){ manual(); }
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){ show(g.getAttribute('data-go'),true); return; }
  var c=e.target.closest('[data-copy]'); if(c){ copy(c.getAttribute('data-copy'),c); return; }
  var r=e.target.closest('[data-route]'); if(r){ var d=D.days.filter(function(x){return x.id===r.getAttribute('data-route')})[0]; r.href=WA.dirLink(startAddr(),d.stops[0].q); }
});
D.prep.forEach(function(p){ var el=document.getElementById('chk-'+p.id); if(!el) return; el.checked = store('chk-'+p.id)==='1'; el.addEventListener('change',function(){store('chk-'+p.id, el.checked?'1':'0')}); });
var sa=document.getElementById('startAddr'); if(sa){ sa.value=store('startAddr')||''; sa.addEventListener('input',function(){store('startAddr',sa.value)}); }
window.addEventListener('hashchange',function(){ show((location.hash||'').slice(1),false) });
show((location.hash||'').slice(1),false);
})();

</script>
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
